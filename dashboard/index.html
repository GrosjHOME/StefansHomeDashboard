<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stefans Zuhause – Dashboard</title>
<style>
  :root{
    --bg:#eef2f5; --card:#ffffff; --ink:#1f2933; --muted:#6b7280; --line:#e3e8ee;
    --amber:#f5a623; --green:#2e9e5b; --blue:#2b83c7; --red:#d64545;
    --nav:#ffffff; --shadow:0 1px 3px rgba(20,30,40,.10), 0 1px 2px rgba(20,30,40,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0f1720; --card:#18212b; --ink:#e6edf3; --muted:#95a1ad; --line:#2a3540;
    --nav:#131b24; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0f1720; --card:#18212b; --ink:#e6edf3; --muted:#95a1ad; --line:#2a3540; --nav:#131b24; --shadow:0 1px 3px rgba(0,0,0,.4);
  }}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; font-size:15px; line-height:1.4;}

  /* Moderne Top-Navigation */
  .nav{position:sticky; top:0; z-index:10; background:var(--nav); border-bottom:1px solid var(--line);
    box-shadow:var(--shadow); display:flex; align-items:center; gap:14px; padding:10px 16px; flex-wrap:wrap;}
  .brand{font-weight:700; font-size:1.05rem; display:flex; align-items:center; gap:7px; white-space:nowrap;}
  .tabs{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
  .tabs a{cursor:pointer; text-decoration:none; color:var(--muted); font-weight:600; font-size:.92rem;
    padding:7px 14px; border-radius:999px; display:flex; align-items:center; gap:6px; transition:all .15s ease;}
  .tabs a:hover{background:var(--bg); color:var(--ink);}
  .tabs a.active{background:var(--green); color:#fff;}
  .navright{display:flex; align-items:center; gap:10px;}
  .link-old{font-size:.8rem; color:var(--muted); text-decoration:none; padding:6px 10px; border:1px solid var(--line); border-radius:8px;}
  .link-old:hover{color:var(--ink);}
  .theme-btn{cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; width:36px; height:36px; font-size:1.05rem;}

  .wrap{max-width:1100px; margin:0 auto; padding:16px 16px 30px;}
  .view-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .view-head h1{font-size:1.3rem; margin:0; display:flex; align-items:center; gap:8px;}
  .meta{font-size:.82rem; color:var(--muted); text-align:right;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle;}
  .dot.ok{background:var(--green);} .dot.bad{background:var(--red);} .dot.na{background:#b0b8c0;}

  .hero{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:16px;}
  .hero .lbl{color:var(--muted); font-size:.85rem; text-transform:uppercase; letter-spacing:.04em;}
  .hero .val{font-size:2.8rem; font-weight:700; line-height:1.1; margin:2px 0 6px;}
  .hero .val small{font-size:1.1rem; font-weight:600; color:var(--muted);}
  .bar{height:12px; border-radius:6px; background:var(--line); overflow:hidden;}
  .bar > span{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--green),var(--amber)); transition:width .6s ease;}
  .bar-scale{display:flex; justify-content:space-between; font-size:.72rem; color:var(--muted); margin-top:3px;}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px;}
  .kpi{background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px;}
  .kpi .k{color:var(--muted); font-size:.8rem; margin-bottom:4px;}
  .kpi .v{font-size:1.45rem; font-weight:700;}
  .kpi .v small{font-size:.8rem; font-weight:600; color:var(--muted);}

  .panel{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px; margin-bottom:16px;}
  .panel h2{font-size:1rem; margin:0 0 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .panel h2 .tag{font-size:.7rem; font-weight:600; color:var(--muted); background:var(--bg); padding:2px 8px; border-radius:20px;}
  .seg{display:inline-flex; gap:2px; background:var(--bg); border-radius:8px; padding:2px; flex-wrap:wrap; margin-left:auto;}
  .seg button{cursor:pointer; border:0; background:transparent; color:var(--muted); font-family:inherit; font-size:.76rem; font-weight:600; padding:4px 10px; border-radius:6px;}
  .seg button.active{background:var(--card); color:var(--ink); box-shadow:var(--shadow);}
  .chart-wrap{position:relative;}
  .tip{position:absolute; pointer-events:none; background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:8px; padding:6px 9px; font-size:.78rem; line-height:1.35; white-space:nowrap; opacity:0; transition:opacity .08s; z-index:5;}
  svg.chart{width:100%; height:auto; display:block;}
  .chart-empty{color:var(--muted); font-size:.9rem; padding:20px 0; text-align:center;}
  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:.8rem; color:var(--muted); margin:2px 0 10px;}
  .legend .it{display:flex; align-items:center; gap:6px;}
  .legend .sw{width:16px; height:0; border-top:3px solid;}

  table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums;}
  th,td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--line);}
  th:first-child,td:first-child{text-align:left;}
  thead th{font-size:.78rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  tbody tr:last-child td{border-bottom:none;}
  tr.sum td{font-weight:700; border-top:2px solid var(--line);}
  .wr-head{font-weight:700; color:var(--blue);}
  .note{font-size:.8rem; color:var(--muted); margin-top:10px;}
  footer{font-size:.78rem; color:var(--muted); text-align:center; margin-top:8px;}
  @media (max-width:560px){
    .wrap{padding:12px 12px 24px;}
    .nav{gap:8px 12px; padding:8px 12px;}
    .brand{font-size:.95rem; order:1;}
    .navright{order:2; margin-left:auto;}
    .tabs{order:3; flex:1 1 100%; flex-wrap:nowrap; overflow-x:auto;}
    .tabs a{padding:6px 10px; font-size:.85rem; white-space:nowrap;}
    .hero .val{font-size:2.2rem;}
    .panel{padding:12px 12px;}
    .kpis{gap:8px; grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}
    .view-head h1{font-size:1.15rem;}
  }
</style>
</head>
<body>
  <header class="nav">
    <div class="brand">⚡ Stefans Zuhause</div>
    <nav class="tabs" id="tabs">
      <a data-view="pv">☀️ PV</a>
      <a data-view="wallbox">🚗 Wallbox</a>
      <a data-view="heizung">🔥 Heizung</a>
      <a data-view="boiler"><svg viewBox="0 0 24 24" width="17" height="17" style="vertical-align:-4px"><rect x="5.5" y="4" width="13" height="17" rx="5" fill="#2b83c7"/><rect x="10.5" y="1.5" width="3" height="3" rx="1" fill="#7fb2dd"/><path d="M12 9.5c1.7 2.1 2.6 3.4 2.6 4.7a2.6 2.6 0 1 1-5.2 0c0-1.3 .9-2.6 2.6-4.7z" fill="#eaf4fb"/></svg> Boiler</a>
    </nav>
    <div class="navright">
      <a class="link-old" href="../thingspeak-dashboard/index.html" title="Original mit ThingSpeak-iframes">ThingSpeak</a>
      <button id="theme-toggle" class="theme-btn" title="Hell/Dunkel">🌙</button>
    </div>
  </header>
  <main id="view"></main>

<script>
/* ================= Theme ================= */
(function(){
  var root=document.documentElement, t=null;
  try{ t=localStorage.getItem("shoTheme"); }catch(e){}
  if(t) root.setAttribute("data-theme",t);
  function cur(){ return root.getAttribute("data-theme") || ((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light"); }
  var btn=document.getElementById("theme-toggle");
  function upd(){ btn.textContent = cur()==="dark"?"☀️":"🌙"; }
  btn.addEventListener("click",function(){ var n=cur()==="dark"?"light":"dark"; root.setAttribute("data-theme",n); try{localStorage.setItem("shoTheme",n);}catch(e){} upd(); });
  upd();
})();

/* ================= Helfer ================= */
function j(u){ return fetch(u,{cache:"no-store"}).then(function(r){return r.json();}); }
function num(x){ return (x===null||x===undefined||x==="")?null:parseFloat(x); }
function fmt(v,d){ return v===null?"–":v.toLocaleString("de-CH",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function relTime(dt){ var s=Math.round((Date.now()-dt.getTime())/1000); if(s<90)return "vor "+s+" s"; var m=Math.round(s/60); if(m<90)return "vor "+m+" min"; var h=Math.round(m/60); if(h<48)return "vor "+h+" h"; return "vor "+Math.round(h/24)+" T"; }
function niceMax(m){ if(m<=0)return 1; var p=Math.pow(10,Math.floor(Math.log10(m))); var c=[1,1.5,2,2.5,3,4,5,6,8,10]; for(var i=0;i<c.length;i++){ if(c[i]*p>=m) return c[i]*p; } return 10*p; }
function ylab(v){ return (Math.abs(v-Math.round(v))<1e-9)?String(Math.round(v)):v.toFixed(1); }
// Ampelfarbe fuer ein Verhaeltnis 0..1: rot -> gelb/amber -> gruen
function ratioColor(r){ r=Math.max(0,Math.min(1,isFinite(r)?r:0));
  var stops=[[214,69,69],[245,166,35],[46,158,91]]; // rot, amber, gruen
  var x=r*2, i=Math.min(1,Math.floor(x)), f=x-i, a=stops[i], b=stops[i+1];
  return "rgb("+Math.round(a[0]+(b[0]-a[0])*f)+","+Math.round(a[1]+(b[1]-a[1])*f)+","+Math.round(a[2]+(b[2]-a[2])*f)+")"; }
function el(html){ var d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }
function api(ch,path,withKey){ var u="https://api.thingspeak.com/channels/"+ch+path; if(withKey) u+=(path.indexOf("?")>=0?"&":"?")+"api_key=6GIAGINL9VN4CTL8"; return u; }

/* Zeit-Liniendiagramm (1..n Serien) */
function lineChart(holder, series, opts){
  opts=opts||{};
  var hasRight = series.some(function(s){ return s.axis==="right"; });
  var allL=[], allR=[];
  series.forEach(function(s){ if(s.bandFrac!=null)return; var tgt=(s.axis==="right")?allR:allL; s.pts.forEach(function(p){ if(p.v!=null) tgt.push(p); }); });
  var all=allL.concat(allR);
  if(all.length<2){ holder.innerHTML='<div class="chart-empty">noch keine Daten</div>'; return; }
  var W=1000,H=300,padL=(opts.padL||46),padR=(hasRight?54:12),padT=24,padB=26;
  var tMin=Math.min.apply(null,all.map(function(p){return p.t.getTime();}));
  var tMax=Math.max.apply(null,all.map(function(p){return p.t.getTime();})); if(tMax===tMin)tMax=tMin+1;
  function scaleFor(arr, zeroOpt, yMinOpt, yMaxOpt){
    if(!arr.length) return {base:0, top:1};
    var vMin=Math.min.apply(null,arr.map(function(p){return p.v;}));
    var vMax=Math.max.apply(null,arr.map(function(p){return p.v;}));
    var base,top;
    if(zeroOpt===false){ var pad=(vMax-vMin)*0.1||1; base=Math.floor(vMin-pad); top=Math.ceil(vMax+pad); }
    else { base=0; top=niceMax(vMax); }
    if(yMinOpt!=null) base=yMinOpt;
    if(yMaxOpt!=null) top=yMaxOpt;
    if(top<=base) top=base+1;
    return {base:base, top:top};
  }
  var L=scaleFor(allL, opts.zero, opts.yMin, opts.yMax);
  var R=scaleFor(allR, opts.zero2, opts.yMin2, opts.yMax2);
  function X(t){ return padL+(W-padL-padR)*((t-tMin)/(tMax-tMin)); }
  function clampF(f){ return f<0?0:(f>1?1:f); }
  function Y(v){ return padT+(H-padT-padB)*(1-clampF((v-L.base)/(L.top-L.base))); }
  function Y2(v){ return padT+(H-padT-padB)*(1-clampF((v-R.base)/(R.top-R.base))); }
  function YF(s){ return (s.axis==="right")?Y2:Y; }
  var rColor="var(--amber)"; series.forEach(function(s){ if(s.axis==="right") rColor=s.color; });
  var grid="",yl="";
  var ticks = opts.yTicks || [{v:L.base},{v:(L.base+L.top)/2},{v:L.top}];
  ticks.forEach(function(tk){ var y=Y(tk.v);
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    yl+='<text x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+(tk.label!=null?tk.label:ylab(tk.v))+'</text>';
    if(hasRight){ var frac=1-(y-padT)/(H-padT-padB), rv=R.base+(R.top-R.base)*frac;
      yl+='<text x="'+(W-padR+6)+'" y="'+(y+4)+'" text-anchor="start" font-size="11" fill="'+rColor+'">'+ylab(rv)+'</text>'; } });
  var paths="";
  series.forEach(function(s){ if(s.pts.length<2)return; var YS=YF(s);
    if(s.segColor){ // segmentweise Faerbung nach Wert
      for(var q=0;q<s.pts.length-1;q++){ var p0=s.pts[q],p1=s.pts[q+1]; if(p0.v==null||p1.v==null)continue;
        paths+='<path d="M '+X(p0.t.getTime())+' '+YS(p0.v)+' L '+X(p1.t.getTime())+' '+YS(p1.v)+'" fill="none" stroke="'+s.segColor(p0.v)+'" stroke-width="2" stroke-linejoin="round"/>'; }
    } else { var yb = s.bandFrac!=null ? (padT+(H-padT-padB)*(1-s.bandFrac)) : null;
      var d="", pen=false; s.pts.forEach(function(p){ if(p.v==null){ pen=false; return; } d+=(pen?" L ":"M ")+X(p.t.getTime())+" "+(yb!=null?yb:YS(p.v)); pen=true; });
      paths+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.width||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="5 4"':'')+'/>'; } });
  var fill="";
  if(series.length===1 && L.base<=0 && series[0].pts.every(function(p){return p.v!=null;})){ var s0=series[0], a="M "+X(s0.pts[0].t.getTime())+" "+Y(0);
    s0.pts.forEach(function(p){ a+=" L "+X(p.t.getTime())+" "+Y(p.v); });
    a+=" L "+X(s0.pts[s0.pts.length-1].t.getTime())+" "+Y(0)+" Z";
    var gid="g"+Math.random().toString(36).slice(2);
    fill='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+s0.color+'" stop-opacity="0.30"/><stop offset="100%" stop-color="'+s0.color+'" stop-opacity="0.02"/></linearGradient></defs><path d="'+a+'" fill="url(#'+gid+')"/>'; }
  var xl="";
  for(var k=0;k<=5;k++){ var tt=tMin+(tMax-tMin)*k/5, x=padL+(W-padL-padR)*k/5;
    var span=tMax-tMin, dd=new Date(tt);
    var lab = span> 26*3600*1000 ? dd.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit"}) : dd.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
    xl+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+lab+'</text>'; }
  var unit2Lab = hasRight ? '<text x="'+(W-padR+6)+'" y="14" text-anchor="start" font-size="11" fill="'+rColor+'">'+(opts.unit2||"")+'</text>' : "";
  var svgStr='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+fill+grid+paths+yl+xl+
    '<text x="6" y="14" font-size="11" fill="var(--muted)">'+(opts.unit||"")+'</text>'+unit2Lab+'<g class="ov" style="display:none"></g></svg>';
  holder.innerHTML='<div class="chart-wrap">'+svgStr+'<div class="tip"></div></div>';
  var wrap=holder.firstChild, svg=wrap.querySelector("svg"), ov=wrap.querySelector(".ov"), tip=wrap.querySelector(".tip");
  var dec=(opts.dec!=null)?opts.dec:1;
  svg.addEventListener("mousemove",function(ev){
    var rect=svg.getBoundingClientRect(), mx=(ev.clientX-rect.left)/rect.width*W;
    if(mx<padL||mx>W-padR){ ov.style.display="none"; tip.style.opacity=0; return; }
    var t=tMin+(mx-padL)/(W-padL-padR)*(tMax-tMin), dots="", rows="", anyX=null;
    series.forEach(function(s){ if(!s.pts.length||s.bandFrac!=null)return; var best=null,bd=Infinity;
      s.pts.forEach(function(p){ if(p.v==null)return; var dd=Math.abs(p.t.getTime()-t); if(dd<bd){bd=dd;best=p;} });
      if(best){ var px=X(best.t.getTime()),py=YF(s)(best.v); anyX=px;
        var su=(s.axis==="right")?(opts.unit2||""):(opts.unit||""); var sd=(s.dec!=null)?s.dec:dec;
        dots+='<circle cx="'+px+'" cy="'+py+'" r="3.5" fill="'+s.color+'"/>';
        rows+='<div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+s.color+';margin-right:5px"></span>'+fmt(best.v,sd)+' '+su+'</div>'; } });
    if(anyX===null){ ov.style.display="none"; tip.style.opacity=0; return; }
    ov.innerHTML='<line x1="'+anyX+'" x2="'+anyX+'" y1="'+padT+'" y2="'+(H-padB)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>'+dots; ov.style.display="";
    var dd=new Date(t), span=tMax-tMin;
    var hdr= span>26*3600*1000 ? dd.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit"})+" "+dd.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"}) : dd.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
    tip.innerHTML='<div style="color:var(--muted);margin-bottom:2px">'+hdr+'</div>'+rows;
    var px=anyX/W*rect.width; tip.style.left=Math.max(0,Math.min(rect.width-tip.offsetWidth-4, px+10))+"px"; tip.style.top=Math.max(0,(ev.clientY-rect.top)-10)+"px"; tip.style.opacity=1;
  });
  svg.addEventListener("mouseleave",function(){ ov.style.display="none"; tip.style.opacity=0; });
}
/* Balkendiagramm */
function barChart(holder, bars, opts){
  opts=opts||{}; if(!bars.length){ holder.innerHTML='<div class="chart-empty">noch keine Daten</div>'; return; }
  var W=1000,H=300,padL=46,padR=12,padT=24,padB=40,n=bars.length;
  var vMax=niceMax(Math.max.apply(null,bars.map(function(b){return b.v;})));
  function Y(v){ return padT+(H-padT-padB)*(1-v/vMax); }
  var slot=(W-padL-padR)/n, bw=slot*0.6, grid="",yl="";
  [0,vMax/2,vMax].forEach(function(v){ var y=Y(v);
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    yl+='<text x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+ylab(v)+'</text>'; });
  var r="";
  bars.forEach(function(b,i){ var x=padL+slot*i+(slot-bw)/2, y=Y(b.v), h=Y(0)-y;
    r+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+(opts.color||"var(--green)")+'"/>';
    r+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+fmt(b.v,0)+'</text>';
    r+='<text x="'+(x+bw/2)+'" y="'+(H-24)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+b.label+'</text>'; });
  var svgStr='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+grid+r+yl+
    '<text x="6" y="14" font-size="11" fill="var(--muted)">'+(opts.unit||"")+'</text><g class="ov" style="display:none"></g></svg>';
  holder.innerHTML='<div class="chart-wrap">'+svgStr+'<div class="tip"></div></div>';
  var wrap=holder.firstChild, svg=wrap.querySelector("svg"), ov=wrap.querySelector(".ov"), tip=wrap.querySelector(".tip");
  svg.addEventListener("mousemove",function(ev){
    var rect=svg.getBoundingClientRect(), mx=(ev.clientX-rect.left)/rect.width*W, idx=Math.floor((mx-padL)/slot);
    if(mx<padL||idx<0||idx>=n){ ov.style.display="none"; tip.style.opacity=0; return; }
    var b=bars[idx], bx=padL+slot*idx+(slot-bw)/2;
    ov.innerHTML='<rect x="'+bx+'" y="'+padT+'" width="'+bw+'" height="'+(H-padT-padB)+'" fill="var(--ink)" opacity="0.06"/>'; ov.style.display="";
    tip.innerHTML='<div style="color:var(--muted);margin-bottom:2px">'+b.label+'</div><div>'+fmt(b.v,0)+' '+(opts.unit||"")+'</div>';
    var px=(bx+bw/2)/W*rect.width; tip.style.left=Math.max(0,Math.min(rect.width-tip.offsetWidth-4, px+8))+"px"; tip.style.top="6px"; tip.style.opacity=1;
  });
  svg.addEventListener("mouseleave",function(){ ov.style.display="none"; tip.style.opacity=0; });
}
function parseStatus(s){ var o={},re=/([UI])([56])=([\d.]+)\/([\d.]+)\/([\d.]+)/g,m; while((m=re.exec(s))){ o[m[1]+m[2]]=[parseFloat(m[3]),parseFloat(m[4]),parseFloat(m[5])]; } return o; }

function simpleView(cfg){
  var mode = "heute";  // "heute" | "7tage" (steuert alle Charts der Ansicht)
  function g(id){ return document.getElementById(id); }
  function periodUrl(){ return mode === "7tage" ? "/feeds.json?days=7" : "/feeds.json?days=1"; }

  // KPIs immer aktuell (letzter bekannter Wert), unabhaengig vom Zeitraum
  function loadKpis(){
    j(api(cfg.channel, "/feeds.json?results=10", false)).then(function(d){
      var f=(d&&d.feeds)?d.feeds:[]; if(!f.length){ if(g("head-meta"))g("head-meta").textContent="keine Daten"; return; }
      var last=f[f.length-1];
      function L(fd){ for(var i=f.length-1;i>=0;i--){var v=num(f[i][fd]); if(v!==null)return v;} return null; }
      cfg.kpis.forEach(function(k,i){ if(k.channel&&k.channel!==cfg.channel)return; var v=L(k.field); if(v!==null&&k.scale)v=v*k.scale; var el=g("kpi_"+i); if(!el)return;
        el.textContent = k.map ? (v===null?"–":k.map(v)) : fmt(v,k.dec||0);
        if(k.warnAbove!=null) el.style.color = (v!==null && v>k.warnAbove) ? "var(--red)" : ""; });
      if(g("head-meta")&&last.created_at) g("head-meta").textContent="Aktualisiert "+relTime(new Date(last.created_at));
      // Ampel-Faerbung: KPI-Wert nach Verhaeltnis aktuelle PV-Leistung / Schwelle
      // (rot = keine PV-Leistung, gruen = Schwelle erreicht)
      if(cfg.kpis.some(function(k){return k.colorPv;})){
        j(api(172430,"/feeds.json?results=5",true)).then(function(pd){
          var pf=(pd&&pd.feeds)?pd.feeds:[], pv=null; for(var i=pf.length-1;i>=0;i--){ var vv=num(pf[i].field1); if(vv!==null){pv=vv;break;} }
          cfg.kpis.forEach(function(k,ix){ if(!k.colorPv)return; var thr=L(k.field), el=g("kpi_"+ix); if(!el||thr===null||!thr||pv===null)return;
            el.style.color=ratioColor(pv/thr); });
        }).catch(function(){});
      }
    }).catch(function(){});
    // KPIs aus anderen Kanaelen (z. B. HSH-Auslastung liegt im Wallbox-Kanal 172228)
    var extra={};
    cfg.kpis.forEach(function(k,i){ if(k.channel&&k.channel!==cfg.channel){ (extra[k.channel]=extra[k.channel]||[]).push({k:k,i:i}); } });
    Object.keys(extra).forEach(function(ch){
      j(api(ch, "/feeds.json?results=300", false)).then(function(d){
        var f=(d&&d.feeds)?d.feeds:[];
        function L2(fd){ for(var i=f.length-1;i>=0;i--){ var v=num(f[i][fd]); if(v!==null)return v; } return null; }
        extra[ch].forEach(function(o){ var g2=g("kpi_"+o.i); if(!g2)return; var v=L2(o.k.field); if(v!==null&&o.k.scale)v=v*o.k.scale;
          g2.textContent = o.k.map ? (v===null?"–":o.k.map(v)) : fmt(v,o.k.dec||0); });
      }).catch(function(){});
    });
  }

  // Charts gemaess Zeitraum (Heute: days=1 / 7 Tage: days=7)
  function loadCharts(){
    // Alle Kanaele sammeln, die von Chart-Linien gebraucht werden (Standard: cfg.channel).
    var chans={}; chans[String(cfg.channel)]=cfg.channel;
    cfg.charts.forEach(function(c){ (c.lines||[]).forEach(function(ln){ if(ln.channel) chans[String(ln.channel)]=ln.channel; }); });
    var keys=Object.keys(chans);
    Promise.all(keys.map(function(k){ var ch=chans[k];
      return j(api(ch, periodUrl(), String(ch)==="172430")).then(function(d){ return {k:k, feeds:(d&&d.feeds)?d.feeds:[]}; }); }))
    .then(function(results){
      var byChan={}; results.forEach(function(r){ byChan[r.k]=r.feeds; });

      var lastTs = f.length ? new Date(f[f.length-1].created_at) : null;
      cfg.charts.forEach(function(c,i){ var holder=g("chart_"+i); if(!holder)return;
        var series=c.lines.map(function(ln){ var pts=[]; var ff=byChan[String(ln.channel||cfg.channel)]||[]; ff.forEach(function(x){ var raw=num(x[ln.field]);
            var v = ln.derive ? ln.derive(raw) : (raw===null?null:(ln.scale? raw*ln.scale : raw));
            pts.push({t:new Date(x.created_at), v:v}); });
          return {color:ln.color, dash:ln.dash, width:ln.width, segColor:ln.segColor, bandFrac:ln.bandFrac, axis:ln.axis, dec:ln.dec, pts: ln.derive? pts : downsample(pts,300)}; }).filter(function(s){return s.pts.length>1;});

          if(vv.length>1){ var mn=Math.min.apply(null,vv), mx=Math.max.apply(null,vv), t0=ct[0], t1=ct[ct.length-1];
            series.push({color:"var(--muted)",dash:true,pts:[{t:t0,v:mn},{t:t1,v:mn}]});
            series.push({color:"var(--muted)",dash:true,pts:[{t:t0,v:mx},{t:t1,v:mx}]}); } }
        if(c.threshold!=null && f.length){ var t0=new Date(f[0].created_at), t1=new Date(f[f.length-1].created_at);
          series.push({color:"var(--red)",dash:true,pts:[{t:t0,v:c.threshold},{t:t1,v:c.threshold}]}); }
        if(g("ct_"+i)) g("ct_"+i).textContent = lastTs ? "Stand "+relTime(lastTs) : "";
        lineChart(holder, series, {unit:c.unit, zero:c.zero, padL:c.padL, yMin:c.yMin, yMax:c.yMax, yTicks:c.yTicks, unit2:c.unit2, zero2:c.zero2, yMin2:c.yMin2, yMax2:c.yMax2});
      });

  }

  return {

      var charts=cfg.charts.map(function(c,i){
        var items=(c.lines||[]).map(function(ln){ return '<span class="it"><span class="sw" style="border-color:'+ln.color+(ln.dash?';border-top-style:dashed':'')+'"></span>'+(ln.label||'')+'</span>'; });
        if(c.minmaxField) items.push('<span class="it"><span class="sw" style="border-color:var(--muted);border-top-style:dashed"></span>Min/Max</span>');
        var leg = (c.lines && (c.lines.length>1 || c.minmaxField)) ? '<div class="legend">'+items.join("")+'</div>' : "";
        return '<div class="panel"><h2>'+c.title+' <span class="tag" id="ct_'+i+'"></span></h2>'+leg+'<div id="chart_'+i+'"><div class="chart-empty">wird geladen…</div></div>'+(c.note?'<div class="note">'+c.note+'</div>':'')+'</div>';
      }).join("");

/* ================= Routing ================= */
var VIEWS={ pv:PV, wallbox:WALLBOX, heizung:HEIZUNG, boiler:BOILER };
var state={timer:null};
function switchView(v){
  if(!VIEWS[v]) v="pv";
  if(state.timer){ clearInterval(state.timer); state.timer=null; }
  var tabs=document.querySelectorAll("#tabs a");
  tabs.forEach(function(a){ a.classList.toggle("active", a.getAttribute("data-view")===v); });
  var main=document.getElementById("view");
  VIEWS[v].render(main);
  VIEWS[v].load();
  state.timer=setInterval(VIEWS[v].load, 60000);
  if(location.hash.slice(1)!==v) location.hash=v;
}
document.getElementById("tabs").addEventListener("click",function(e){ var a=e.target.closest("a[data-view]"); if(!a)return; e.preventDefault(); switchView(a.getAttribute("data-view")); });
window.addEventListener("hashchange",function(){ switchView(location.hash.slice(1)); });
switchView(location.hash.slice(1) || "pv");
</script>
