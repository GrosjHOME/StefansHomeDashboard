<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Stefans Zuhause – Dashboard</title>
<style>
  :root{
    --bg:#eef2f5; --card:#ffffff; --ink:#1f2933; --muted:#6b7280; --line:#e3e8ee;
    --amber:#f5a623; --amber-lt:#f7d774; --green:#2e9e5b; --blue:#2b83c7; --red:#d64545;
    --nav:#ffffff; --shadow:0 1px 3px rgba(20,30,40,.10), 0 1px 2px rgba(20,30,40,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0f1720; --card:#18212b; --ink:#e6edf3; --muted:#95a1ad; --line:#2a3540;
    --nav:#131b24; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0f1720; --card:#18212b; --ink:#e6edf3; --muted:#95a1ad; --line:#2a3540; --nav:#131b24; --shadow:0 1px 3px rgba(0,0,0,.4);
  }}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; font-size:15px; line-height:1.4;}

  /* Moderne Top-Navigation */
  .nav{position:sticky; top:0; z-index:10; background:var(--nav); border-bottom:1px solid var(--line);
    box-shadow:var(--shadow); display:flex; align-items:center; gap:14px; padding:10px 16px; flex-wrap:wrap;}
  .brand{font-weight:700; font-size:1.05rem; display:flex; align-items:center; gap:7px; white-space:nowrap;}
  .tabs{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
  .tabs a{cursor:pointer; text-decoration:none; color:var(--muted); font-weight:600; font-size:.92rem;
    padding:7px 14px; border-radius:999px; display:flex; align-items:center; gap:6px; transition:all .15s ease;}
  .tabs a:hover{background:var(--bg); color:var(--ink);}
  .tabs a.active{background:var(--green); color:#fff;}
  .navright{display:flex; align-items:center; gap:10px;}
  .link-old{font-size:.8rem; color:var(--muted); text-decoration:none; padding:6px 10px; border:1px solid var(--line); border-radius:8px;}
  .link-old:hover{color:var(--ink);}
  .theme-btn{cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; width:36px; height:36px; font-size:1.05rem;}

  .wrap{max-width:1100px; margin:0 auto; padding:16px 16px 30px;}
  .view-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .view-head h1{font-size:1.3rem; margin:0; display:flex; align-items:center; gap:8px;}
  .meta{font-size:.82rem; color:var(--muted); text-align:right;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle;}
  .dot.ok{background:var(--green);} .dot.bad{background:var(--red);} .dot.na{background:#b0b8c0;}

  .hero{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:16px;}
  .hero .lbl{color:var(--muted); font-size:.85rem; text-transform:uppercase; letter-spacing:.04em;}
  .hero .val{font-size:2.8rem; font-weight:700; line-height:1.1; margin:2px 0 6px;}
  .hero .val small{font-size:1.1rem; font-weight:600; color:var(--muted);}
  .bar{height:12px; border-radius:6px; background:var(--line); overflow:hidden;}
  .bar > span{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--green),var(--amber)); transition:width .6s ease;}
  .bar-scale{display:flex; justify-content:space-between; font-size:.72rem; color:var(--muted); margin-top:3px;}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px;}
  .kpi{background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px;}
  .kpi .k{color:var(--muted); font-size:.8rem; margin-bottom:4px;}
  .kpi .v{font-size:1.45rem; font-weight:700;}
  .kpi .v small{font-size:.8rem; font-weight:600; color:var(--muted);}

  .panel{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px; margin-bottom:16px;}
  .panel h2{font-size:1rem; margin:0 0 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .panel h2 .tag{font-size:.7rem; font-weight:600; color:var(--muted); background:var(--bg); padding:2px 8px; border-radius:20px;}
  .seg{display:inline-flex; gap:2px; background:var(--bg); border-radius:8px; padding:2px; flex-wrap:wrap; margin-left:auto;}
  .seg button{cursor:pointer; border:0; background:transparent; color:var(--muted); font-family:inherit; font-size:.76rem; font-weight:600; padding:4px 10px; border-radius:6px;}
  .seg button.active{background:var(--card); color:var(--ink); box-shadow:var(--shadow);}
  .chart-wrap{position:relative;}
  .tip{position:absolute; pointer-events:none; background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:8px; padding:6px 9px; font-size:.78rem; line-height:1.35; white-space:nowrap; opacity:0; transition:opacity .08s; z-index:5;}
  svg.chart{width:100%; height:auto; display:block;}
  .chart-empty{color:var(--muted); font-size:.9rem; padding:20px 0; text-align:center;}
  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:.8rem; color:var(--muted); margin:2px 0 10px;}
  .legend .it{display:flex; align-items:center; gap:6px;}
  .legend .sw{width:16px; height:0; border-top:3px solid;}

  table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums;}
  th,td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--line);}
  th:first-child,td:first-child{text-align:left;}
  thead th{font-size:.78rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  tbody tr:last-child td{border-bottom:none;}
  tr.sum td{font-weight:700; border-top:2px solid var(--line);}
  .wr-head{font-weight:700; color:var(--blue);}
  .note{font-size:.8rem; color:var(--muted); margin-top:10px;}
  .pldays{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;}
  .plday{background:var(--bg); border-radius:12px; padding:12px 14px; border:1px solid var(--line);}
  .plday .pd-date{font-size:.8rem; color:var(--muted); font-weight:600;}
  .plday .pd-kwh{font-size:1.5rem; font-weight:700; margin:2px 0;}
  .plday .pd-sun{font-size:1.05rem; margin-bottom:6px;}
  .plday .pd-win{font-size:.78rem; color:var(--muted); margin-bottom:6px;}
  .plday .pd-rec{font-size:.85rem; line-height:1.35;}
  footer{font-size:.78rem; color:var(--muted); text-align:center; margin-top:8px;}
  @media (max-width:560px){
    .wrap{padding:12px 12px 24px;}
    .nav{gap:8px 12px; padding:8px 12px;}
    .brand{font-size:.95rem; order:1;}
    .navright{order:2; margin-left:auto;}
    .tabs{order:3; flex:1 1 100%; flex-wrap:nowrap; justify-content:space-between;}
    .tabs a{padding:6px 10px; font-size:1.15rem; white-space:nowrap;}
    .tabs a .tl{display:none;}  /* wenig Platz -> nur Icons */
    .hero .val{font-size:2.2rem;}
    .panel{padding:12px 12px;}
    .kpis{gap:8px; grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}
    .view-head h1{font-size:1.15rem;}
  }
</style>
</head>
<body>
  <header class="nav">
    <div class="brand">⚡ Stefans Zuhause</div>
    <nav class="tabs" id="tabs">
      <a data-view="pv">☀️<span class="tl"> PV-Anlage</span></a>
      <a data-view="wallbox">🚗<span class="tl"> Wallbox</span></a>
      <a data-view="heizung">🔥<span class="tl"> Heizung</span></a>
      <a data-view="boiler"><svg viewBox="0 0 24 24" width="17" height="17" style="vertical-align:-4px"><rect x="5.5" y="4" width="13" height="17" rx="5" fill="#2b83c7"/><rect x="10.5" y="1.5" width="3" height="3" rx="1" fill="#7fb2dd"/><path d="M12 9.5c1.7 2.1 2.6 3.4 2.6 4.7a2.6 2.6 0 1 1-5.2 0c0-1.3 .9-2.6 2.6-4.7z" fill="#eaf4fb"/></svg><span class="tl"> Boiler</span></a>
      <a data-view="planer">🗓️<span class="tl"> Nutzung</span></a>
    </nav>
    <div class="navright">
      <a class="link-old" href="../thingspeak-dashboard/index.html" title="Original mit ThingSpeak-iframes">ThingSpeak</a>
      <button id="theme-toggle" class="theme-btn" title="Hell/Dunkel">🌙</button>
    </div>
  </header>
  <main id="view"></main>

<script>
/* ================= Theme ================= */
(function(){
  var root=document.documentElement, t=null;
  try{ t=localStorage.getItem("shoTheme"); }catch(e){}
  if(t) root.setAttribute("data-theme",t);
  function cur(){ return root.getAttribute("data-theme") || ((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light"); }
  var btn=document.getElementById("theme-toggle");
  function upd(){ btn.textContent = cur()==="dark"?"☀️":"🌙"; }
  btn.addEventListener("click",function(){ var n=cur()==="dark"?"light":"dark"; root.setAttribute("data-theme",n); try{localStorage.setItem("shoTheme",n);}catch(e){} upd(); });
  upd();
})();

/* ================= Helfer ================= */
function j(u){ return fetch(u,{cache:"no-store"}).then(function(r){return r.json();}); }
function num(x){ return (x===null||x===undefined||x==="")?null:parseFloat(x); }
function fmt(v,d){ return v===null?"–":v.toLocaleString("de-CH",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function relTime(dt){ var s=Math.round((Date.now()-dt.getTime())/1000); if(s<90)return "vor "+s+" s"; var m=Math.round(s/60); if(m<90)return "vor "+m+" min"; var h=Math.round(m/60); if(h<48)return "vor "+h+" h"; return "vor "+Math.round(h/24)+" T"; }
function niceMax(m){ if(m<=0)return 1; var p=Math.pow(10,Math.floor(Math.log10(m))); var c=[1,1.5,2,2.5,3,4,5,6,8,10]; for(var i=0;i<c.length;i++){ if(c[i]*p>=m) return c[i]*p; } return 10*p; }
function ylab(v){ return (Math.abs(v-Math.round(v))<1e-9)?String(Math.round(v)):v.toFixed(1); }
// Farbverlauf ueber Stuetzstellen [[x,[r,g,b]],...], ausserhalb geklemmt
function rampColor(stops,x){
  var c=stops[stops.length-1][1];
  if(!(x>stops[0][0])) c=stops[0][1];
  else for(var i=1;i<stops.length;i++){ if(x<=stops[i][0]){ var a=stops[i-1], b=stops[i], f=(x-a[0])/(b[0]-a[0]);
    c=[0,1,2].map(function(k){ return Math.round(a[1][k]+(b[1][k]-a[1][k])*f); }); break; } }
  return "rgb("+c.join(",")+")";
}
// Feste Farbbaender [[obereGrenze,farbe],...] wie bei den ThingSpeak-Tachos
function bandColor(bands,v){ for(var i=0;i<bands.length;i++){ if(v<bands[i][0]) return bands[i][1]; } return bands[bands.length-1][1]; }
var C_RED=[214,69,69], C_ORANGE=[245,140,35], C_GREEN_LT=[166,227,161], C_GREEN_MID=[87,201,106], C_GREEN=[22,163,74];
// Einschaltschwelle: rot (keine PV) -> orange bis zur Schwelle; ab Schwelle gruen, 2 kW darueber voll gruen
function thresholdColor(pv,thr){
  return pv<thr ? rampColor([[0,C_RED],[thr,C_ORANGE]],pv) : rampColor([[thr,C_GREEN_LT],[thr+2000,C_GREEN]],pv);
}
// Boiler-Ladeleistung: 0 W neutral, 1-10 W rot (Laden verlangt, zu wenig PV), darueber Gruenverlauf
function chargeColor(w){
  if(w<=0) return "";
  if(w<11) return "rgb("+C_RED.join(",")+")";
  return rampColor([[1000,C_GREEN_LT],[1800,C_GREEN_MID],[4000,C_GREEN]],w);
}
function el(html){ var d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }
function api(ch,path,withKey){ var u="https://api.thingspeak.com/channels/"+ch+path; if(withKey) u+=(path.indexOf("?")>=0?"&":"?")+"api_key=6GIAGINL9VN4CTL8"; return u; }

/* Zeit-Liniendiagramm (1..n Serien) */
function lineChart(holder, series, opts){
  opts=opts||{};
  var hasRight = series.some(function(s){ return s.axis==="right"; });
  var allL=[], allR=[];
  series.forEach(function(s){ if(s.bandFrac!=null)return; var tgt=(s.axis==="right")?allR:allL; s.pts.forEach(function(p){ if(p.v!=null) tgt.push(p); }); });
  var all=allL.concat(allR);
  if(all.length<1){ holder.innerHTML='<div class="chart-empty">noch keine Daten</div>'; return; }
  var W=1000,H=(opts.height||300),padL=(opts.padL||58),padR=(hasRight?70:16),padT=28,padB=36;
  var tMin=Math.min.apply(null,all.map(function(p){return p.t.getTime();}));
  var tMax=Math.max.apply(null,all.map(function(p){return p.t.getTime();}));
  var singleT=(tMax===tMin); if(singleT)tMax=tMin+1;  // nur ein Zeitpunkt -> mittig
  function scaleFor(arr, zeroOpt, yMinOpt, yMaxOpt){
    if(!arr.length) return {base:0, top:1};
    var vMin=Math.min.apply(null,arr.map(function(p){return p.v;}));
    var vMax=Math.max.apply(null,arr.map(function(p){return p.v;}));
    var base,top;
    if(zeroOpt===false){ var pad=(vMax-vMin)*0.1||1; base=Math.floor(vMin-pad); top=Math.ceil(vMax+pad); }
    else { base=0; top=niceMax(vMax); }
    if(yMinOpt!=null) base=yMinOpt;
    if(yMaxOpt!=null) top=yMaxOpt;
    if(top<=base) top=base+1;
    return {base:base, top:top};
  }
  var L=scaleFor(allL, opts.zero, opts.yMin, opts.yMax);
  var R=scaleFor(allR, opts.zero2, opts.yMin2, opts.yMax2);
  function X(t){ return singleT ? (padL+(W-padR))/2 : padL+(W-padL-padR)*((t-tMin)/(tMax-tMin)); }
  function clampF(f){ return f<0?0:(f>1?1:f); }
  function Y(v){ return padT+(H-padT-padB)*(1-clampF((v-L.base)/(L.top-L.base))); }
  function Y2(v){ return padT+(H-padT-padB)*(1-clampF((v-R.base)/(R.top-R.base))); }
  function YF(s){ return (s.axis==="right")?Y2:Y; }
  var rColor="var(--amber)"; series.forEach(function(s){ if(s.axis==="right") rColor=s.color; });
  var grid="",yl="";
  var ticks = opts.yTicks || [{v:L.base},{v:(L.base+L.top)/2},{v:L.top}];
  ticks.forEach(function(tk){ var y=Y(tk.v);
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    yl+='<text x="'+(padL-8)+'" y="'+(y+7)+'" text-anchor="end" font-size="21" fill="var(--muted)">'+(tk.label!=null?tk.label:ylab(tk.v))+'</text>';
    if(hasRight){ var frac=1-(y-padT)/(H-padT-padB), rv=R.base+(R.top-R.base)*frac;
      yl+='<text x="'+(W-padR+8)+'" y="'+(y+7)+'" text-anchor="start" font-size="21" fill="'+rColor+'">'+ylab(rv)+'</text>'; } });
  var paths="";
  series.forEach(function(s){ if(s.pts.length<2)return; var YS=YF(s);
    if(s.segColor){ // segmentweise Faerbung nach Wert
      for(var q=0;q<s.pts.length-1;q++){ var p0=s.pts[q],p1=s.pts[q+1]; if(p0.v==null||p1.v==null)continue;
        paths+='<path d="M '+X(p0.t.getTime())+' '+YS(p0.v)+' L '+X(p1.t.getTime())+' '+YS(p1.v)+'" fill="none" stroke="'+s.segColor(p0.v)+'" stroke-width="2" stroke-linejoin="round"/>'; }
    } else { var yb = s.bandFrac!=null ? (padT+(H-padT-padB)*(1-s.bandFrac)) : null;
      var d="", pen=false; s.pts.forEach(function(p){ if(p.v==null){ pen=false; return; } d+=(pen?" L ":"M ")+X(p.t.getTime())+" "+(yb!=null?yb:YS(p.v)); pen=true; });
      paths+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.width||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="5 4"':'')+'/>'; } });
  // Punkt-Marker: bei opts.dots oder wenn eine Serie nur aus einem Punkt besteht
  // (dann waere sonst keine Linie sichtbar, z.B. erster Tag der Verlust-Diagnose).
  series.forEach(function(s){ if(s.bandFrac!=null||s.segColor)return; var YS=YF(s);
    var vis=s.pts.filter(function(p){return p.v!=null;});
    if(opts.dots || vis.length===1){ vis.forEach(function(p){ paths+='<circle cx="'+X(p.t.getTime())+'" cy="'+YS(p.v)+'" r="'+(vis.length===1?5:3)+'" fill="'+s.color+'"/>'; }); } });
  // Flaeche nur fuer Linien mit fill:true (aktive Leistung); bis zur Achsen-
  // Grundlinie gefuellt, Luecken (null) unterbrechen die Flaeche.
  var fill="";
  series.forEach(function(s){ if(!s.fill||s.pts.length<2)return; var YS=YF(s), by=H-padB;
    var gid="g"+Math.random().toString(36).slice(2), d="", open=false, lastX=null;
    s.pts.forEach(function(p){ if(p.v==null){ if(open){ d+=" L "+lastX+" "+by+" Z"; open=false; } return; }
      var x=X(p.t.getTime()), y=YS(p.v);
      if(!open){ d+="M "+x+" "+by+" L "+x+" "+y; open=true; } else { d+=" L "+x+" "+y; }
      lastX=x; });
    if(open){ d+=" L "+lastX+" "+by+" Z"; }
    if(d){ fill+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+s.color+'" stop-opacity="0.30"/><stop offset="100%" stop-color="'+s.color+'" stop-opacity="0.02"/></linearGradient></defs><path d="'+d+'" fill="url(#'+gid+')"/>'; } });
  var xl="";
  if(opts.xTicks){ opts.xTicks.forEach(function(xt){ var tv=(xt.t instanceof Date)?xt.t.getTime():xt.t; if(tv<tMin||tv>tMax)return; var x=X(tv);
      xl+='<text x="'+x+'" y="'+(H-9)+'" text-anchor="middle" font-size="21" fill="var(--muted)">'+xt.label+'</text>'; }); }
  else for(var k=0;k<=5;k++){ var tt=tMin+(tMax-tMin)*k/5, x=padL+(W-padL-padR)*k/5;
    var span=tMax-tMin, dd=new Date(tt);
    var lab = span> 26*3600*1000 ? dd.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit"}) : dd.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
    xl+='<text x="'+x+'" y="'+(H-9)+'" text-anchor="middle" font-size="21" fill="var(--muted)">'+lab+'</text>'; }
  var unit2Lab = hasRight ? '<text x="'+(W-padR+8)+'" y="18" text-anchor="start" font-size="18" fill="'+rColor+'">'+(opts.unit2||"")+'</text>' : "";
  var svgStr='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+fill+grid+paths+yl+xl+
    '<text x="6" y="18" font-size="18" fill="var(--muted)">'+(opts.unit||"")+'</text>'+unit2Lab+'<g class="ov" style="display:none"></g></svg>';
  var legHtml="";
  if(opts.legend&&opts.legend.length){ legHtml='<div class="legend">'+opts.legend.map(function(it){ return '<span class="it"><span class="sw" style="border-color:'+it.color+'"></span>'+it.label+'</span>'; }).join("")+'</div>'; }
  holder.innerHTML=legHtml+'<div class="chart-wrap">'+svgStr+'<div class="tip"></div></div>';
  var wrap=holder.querySelector(".chart-wrap"), svg=wrap.querySelector("svg"), ov=wrap.querySelector(".ov"), tip=wrap.querySelector(".tip");
  var dec=(opts.dec!=null)?opts.dec:1;
  svg.addEventListener("mousemove",function(ev){
    var rect=svg.getBoundingClientRect(), mx=(ev.clientX-rect.left)/rect.width*W;
    if(mx<padL||mx>W-padR){ ov.style.display="none"; tip.style.opacity=0; return; }
    var t=tMin+(mx-padL)/(W-padL-padR)*(tMax-tMin), dots="", rows="", anyX=null;
    series.forEach(function(s){ if(!s.pts.length||s.bandFrac!=null)return; var best=null,bd=Infinity;
      s.pts.forEach(function(p){ if(p.v==null)return; var dd=Math.abs(p.t.getTime()-t); if(dd<bd){bd=dd;best=p;} });
      if(best){ var px=X(best.t.getTime()),py=YF(s)(best.v); anyX=px;
        var su=(s.axis==="right")?(opts.unit2||""):(opts.unit||""); var sd=(s.dec!=null)?s.dec:dec;
        dots+='<circle cx="'+px+'" cy="'+py+'" r="3.5" fill="'+s.color+'"/>';
        rows+='<div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+s.color+';margin-right:5px"></span>'+fmt(best.v,sd)+' '+su+'</div>'; } });
    if(anyX===null){ ov.style.display="none"; tip.style.opacity=0; return; }
    ov.innerHTML='<line x1="'+anyX+'" x2="'+anyX+'" y1="'+padT+'" y2="'+(H-padB)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>'+dots; ov.style.display="";
    var dd=new Date(t), span=tMax-tMin;
    var hdr= span>26*3600*1000 ? dd.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit"})+" "+dd.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"}) : dd.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
    tip.innerHTML='<div style="color:var(--muted);margin-bottom:2px">'+hdr+'</div>'+rows;

/* Balkendiagramm */
function barChart(holder, bars, opts){

  function total(b){ return b.v+(b.v2||0); }
  var vMax=niceMax(Math.max.apply(null,bars.map(total)));

    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    yl+='<text x="'+(padL-8)+'" y="'+(y+7)+'" text-anchor="end" font-size="21" fill="var(--muted)">'+ylab(v)+'</text>'; });

    if(b.v2>0){ var y2=Y(tp), h2=Y(b.v)-y2; r+='<rect x="'+x+'" y="'+y2+'" width="'+bw+'" height="'+h2+'" rx="'+rx+'" fill="'+(b.color2||"var(--amber-lt)")+'"/>'; }
    if(!many) r+='<text x="'+(x+bw/2)+'" y="'+(yTop-6)+'" text-anchor="middle" font-size="19" fill="var(--muted)">'+fmt(tp,0)+'</text>';
    if(b.label) r+='<text x="'+(x+bw/2)+'" y="'+(H-22)+'" text-anchor="middle" font-size="19" fill="var(--muted)">'+b.label+'</text>'; });

    if(mx<padL||idx<0||idx>=n){ ov.style.display="none"; tip.style.opacity=0; return; }
    var b=bars[idx], bx=padL+slot*idx+(slot-bw)/2;
    ov.innerHTML='<rect x="'+bx+'" y="'+padT+'" width="'+bw+'" height="'+(H-padT-padB)+'" fill="var(--ink)" opacity="0.06"/>'; ov.style.display="";

//  "gruppiert" = pro Monat die Jahre nebeneinander (gruppierte Balken + Legende)
var CMP_NOTES={
  kumuliert:"Aufsummierte Energie im Jahresverlauf (Jan–Dez) – jede Linie ein Jahr. Zeigt, ob das laufende Jahr über oder unter den Vorjahren liegt.",
  alle:"Alle Monatssummen seit 2014 chronologisch, jedes Jahr in eigener Farbe.",
  gruppiert:"Je Monat die Jahre nebeneinander – zeigt, wie ein Monat im Vergleich zu den Vorjahren abschneidet."

PV.loadCumYear=function(){
  var holder=document.getElementById("chart-cumyear"); if(!holder)return;
  var mode=PV.cmpMode, token=++PV.cmpToken;
  var note=document.getElementById("cmp-note"); if(note) note.textContent=CMP_NOTES[mode];
  var mo=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"], now=new Date(), curY=now.getFullYear();

    var maxM=(yy===curY)?now.getMonth():11, ms=[]; for(var m=0;m<=maxM;m++) ms.push(m);
    return Promise.all(ms.map(function(m){ return pvMonthTotal(yy,m).then(function(v){return {m:m,v:v};}); })).then(function(res){
      var pts=res.filter(function(o){return o.v!==null&&o.v>0;}).sort(function(a,b){return a.m-b.m;});
      if(pts.length) yearsData.push({year:yy,pts:pts});
    });
  }); })(y);
  return chain.then(function(){
    if(token!==PV.cmpToken) return;  // inzwischen umgeschaltet

    var n=yearsData.length, legend=[];
    yearsData.forEach(function(s,i){ s.color="hsl("+Math.round(i*(360/n))+",70%,50%)"; legend.push({color:s.color,label:String(s.year)}); });
    if(mode==="alle"){

/* ---- Energie-Historie: schnelle Endpunkt-Abfragen + localStorage-Cache ----
   Abgeschlossene Monate aendern sich nie -> einmal holen, dann cachen; nur der
   laufende Monat/das laufende Jahr wird live geholt. Jahreswerte kommen aus den
   authoritativen Ist-Messwerten (genauer als ThingSpeak, das Luecken hat). */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }
function tsEnd(d){ function p(n){return (n<10?"0":"")+n;} return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" 23:59:59"; }

// Authoritative Jahres-Ist-Werte (kWh) aus den Abrechnungen; laufendes Jahr live.
var PV_HIST_YEARS = {
  2014:38115, 2015:40300, 2016:37200, 2017:38944, 2018:36022, 2019:39679,
  2020:40383, 2021:37189, 2022:40854, 2023:35549, 2024:31976, 2025:33986
};

// Historische Monatswerte (kWh, beide WR summiert) aus der MaxTalk-DB, Vor-
// ThingSpeak-Zeit. Index 0=Jan..11=Dez. 2016 hat kleine Aufzeichnungsluecken
// (Jun/Nov). Ab 2017 kommen die Monate live aus ThingSpeak.
var PV_HIST_MONTHS = {
  2014:[709,2271,4143,3860,3852,4716,3592,3715,4006,3270,2139,1125],
  2015:[1360,1986,3677,4490,4010,4506,4926,4257,3382,2574,2625,2704],
  2016:[1406,1552,3197,3337,3945,1923,4366,4534,4045,2748,1585,3132]
};

// Monatssumme (kWh): historischer Wert falls vorhanden, sonst via Endpunkt
// (Feld 3 = Energie aktueller Monat); abgeschlossene Monate gecacht.
function pvMonthTotal(year,m0){
  if(PV_HIST_MONTHS[year] && PV_HIST_MONTHS[year][m0]!=null) return Promise.resolve(PV_HIST_MONTHS[year][m0]);
  var now=new Date(), isCur=(year===now.getFullYear() && m0===now.getMonth());
  var key="pv_m_"+year+"_"+m0;
  if(!isCur){ var c=lsGet(key); if(c!==null) return Promise.resolve(parseFloat(c)); }
  var path = isCur ? "/feeds.json?results=1" : "/feeds.json?results=1&end="+encodeURIComponent(tsEnd(new Date(year,m0+1,0)));
  return j(api(PV.CH,path,true)).then(function(d){ var f=(d&&d.feeds)?d.feeds:[]; var v=f.length?num(f[f.length-1].field3):null;
    if(v!==null && !isCur) lsSet(key,v); return v; });
}
// Jahressumme (kWh): Ist-Wert falls vorhanden, sonst laufendes Jahr live (Feld 4)
function pvYearTotal(year){
  if(PV_HIST_YEARS[year]!=null) return Promise.resolve(PV_HIST_YEARS[year]);
  var now=new Date(), isCur=(year===now.getFullYear());
  var key="pv_y_"+year;
  if(!isCur){ var c=lsGet(key); if(c!==null) return Promise.resolve(parseFloat(c)); }
  var path = isCur ? "/feeds.json?results=1" : "/feeds.json?results=1&end="+encodeURIComponent(year+"-12-31 23:59:59");
  return j(api(PV.CH,path,true)).then(function(d){ var f=(d&&d.feeds)?d.feeds:[]; var v=f.length?num(f[f.length-1].field4):null;
    if(v!==null && !isCur) lsSet(key,v); return v; });
}

PV.loadEnergy=function(){
  var holder=document.getElementById("chart-days"); if(!holder)return;
  var mo=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  var now=new Date();
  if(PV.energyMode==="monate"){
    var months=[];
    if(PV.energyYear){ var maxM=(PV.energyYear===now.getFullYear())?now.getMonth():11;
      for(var m=0;m<=maxM;m++) months.push({y:PV.energyYear,m:m}); }
    else { for(var i=11;i>=0;i--){ var dd=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({y:dd.getFullYear(),m:dd.getMonth()}); } }
    Promise.all(months.map(function(mm){ return pvMonthTotal(mm.y,mm.m).then(function(v){return {y:mm.y,m:mm.m,v:v};}); })).then(function(res){
      var bars=res.filter(function(o){return o.v!==null&&o.v>0;}).map(function(o){return {label:mo[o.m]+" "+String(o.y).slice(2),v:o.v};});
      if(!bars.length){ holder.innerHTML='<div class="chart-empty">keine Daten für '+(PV.energyYear||"")+'</div>'; return; }
      barChart(holder,bars,{unit:"kWh",color:"var(--amber)"});
    }).catch(function(){ holder.innerHTML='<div class="chart-empty">Daten konnten nicht geladen werden.</div>'; });
  } else if(PV.energyMode==="jahre"){
    var years=[]; for(var y=2014;y<=now.getFullYear();y++) years.push(y);
    Promise.all(years.map(function(y){ return pvYearTotal(y).then(function(v){return {y:y,v:v};}); })).then(function(res){
      barChart(holder, res.filter(function(o){return o.v!==null&&o.v>0;}).map(function(o){return {label:String(o.y),v:o.v};}), {unit:"kWh",color:"var(--amber)"});
    }).catch(function(){ holder.innerHTML='<div class="chart-empty">Daten konnten nicht geladen werden.</div>'; });
  } else {
    // Ist-Tageswerte + Prognose (heute + naechste 2 Tage) als hellgelbe Balken
    Promise.all([
      j(api(PV.CH,"/feeds.json?days=15&average=15",true)),
      PLANNER.ensureForecast().catch(function(){return null;})
    ]).then(function(res){
      var d=res[0], fc=res[1];
      var f=(d&&d.feeds)?d.feeds:[],byDay={}; f.forEach(function(x){ var v=num(x.field2); if(v===null)return; var dt=new Date(x.created_at);
        var key=dt.getFullYear()+"-"+dt.getMonth()+"-"+dt.getDate(); if(!byDay[key]||v>byDay[key].v)byDay[key]={v:v,dt:dt}; });
      var arr=Object.keys(byDay).map(function(k){return byDay[k];}).sort(function(a,b){return a.dt-b.dt;}).slice(-14);
      var bars=arr.map(function(o){return {label:o.dt.getDate()+"."+(o.dt.getMonth()+1)+".",v:o.v,dt:o.dt};});
      function ymdOf(dt){ return dt.getFullYear()+"-"+("0"+(dt.getMonth()+1)).slice(-2)+"-"+("0"+dt.getDate()).slice(-2); }
      if(fc && fc.fc && fc.fc.hourly){
        var F=fc.factor, ht=fc.fc.hourly.time, hg=fc.fc.hourly.global_tilted_irradiance;
        var perDay={}, order=[], nowH=now.getHours(), todayYmd=ymdOf(now), remToday=0;
        for(var i=0;i<ht.length;i++){ var dt=new Date(ht[i].replace(" ","T")); var kw=(hg[i]||0)/1000*(F[dt.getHours()]||0); var ymd=ht[i].slice(0,10);
          if(!(ymd in perDay)){ perDay[ymd]=0; order.push(ymd); } perDay[ymd]+=kw;
          if(ymd===todayYmd && dt.getHours()>=nowH) remToday+=kw; }
        var fut=order.filter(function(y){return y>=todayYmd;}).slice(0,3);  // heute + 2
        var last=bars.length?bars[bars.length-1]:null;
        var lastYmd=(last&&last.dt)?ymdOf(last.dt):null;
        fut.forEach(function(ymd){
          var dObj=new Date(ymd+"T12:00"), lbl=dObj.getDate()+"."+(dObj.getMonth()+1)+".";
          if(ymd===todayYmd && lastYmd===todayYmd){
            // heute: Ist-Balken behalten, erwarteter Rest bis Tagesprognose oben aufstapeln
            last.v2=Math.max(0,Math.round(remToday)); last.color="var(--amber)"; last.color2="var(--amber-lt)";
            last.tip="Heute · bisher "+Math.round(last.v)+" + Prognose-Rest "+Math.round(remToday)+" kWh";
          } else {
            bars.push({label:lbl, v:0, v2:Math.round(perDay[ymd]||0), color2:"var(--amber-lt)",
              tip:(ymd===todayYmd?"Heute":lbl)+" · Prognose "+Math.round(perDay[ymd]||0)+" kWh"});
          }
        });
      }
      barChart(holder,bars,{unit:"kWh",color:"var(--amber)",legend:[{color:"var(--amber)",label:"Ist"},{color:"var(--amber-lt)",label:"Prognose"}]});
    }).catch(function(){ holder.innerHTML='<div class="chart-empty">Daten konnten nicht geladen werden.</div>'; });
  }
};

/* ========== Generische Ansicht (Wallbox/Heizung/Boiler) ========== */
function simpleView(cfg){
  var mode = "heute";  // "heute" (ab Mitternacht) | "24h" | "7tage" (steuert alle Charts der Ansicht)
  function g(id){ return document.getElementById(id); }
  function periodUrl(){ return periodQuery(mode); }

  // KPIs immer aktuell (letzter bekannter Wert), unabhaengig vom Zeitraum
  function loadKpis(){
    j(api(cfg.channel, "/feeds.json?results=10", false)).then(function(d){
      var f=(d&&d.feeds)?d.feeds:[]; if(!f.length){ if(g("head-meta"))g("head-meta").textContent="keine Daten"; return; }
      var last=f[f.length-1];
      function L(fd){ for(var i=f.length-1;i>=0;i--){var v=num(f[i][fd]); if(v!==null)return v;} return null; }
      cfg.kpis.forEach(function(k,i){ if(k.channel&&k.channel!==cfg.channel)return; var v=L(k.field); if(v!==null&&k.scale)v=v*k.scale; var el=g("kpi_"+i); if(!el)return;
        el.textContent = k.map ? (v===null?"–":k.map(v)) : fmt(v,k.dec||0);
        if(k.warnAbove!=null) el.style.color = (v!==null && v>k.warnAbove) ? "var(--red)" : "";
        if(k.color) el.style.color = (v===null) ? "" : k.color(v); });
      if(g("head-meta")&&last.created_at) g("head-meta").textContent="Aktualisiert "+relTime(new Date(last.created_at));
      // Ampel-Faerbung: KPI-Wert nach aktueller PV-Leistung gegenueber der Schwelle
      // (rot = keine PV-Leistung, orange bis zur Schwelle, gruen ab Schwelle)
      if(cfg.kpis.some(function(k){return k.colorPv;})){
        j(api(172430,"/feeds.json?results=5",true)).then(function(pd){
          var pf=(pd&&pd.feeds)?pd.feeds:[], pv=null; for(var i=pf.length-1;i>=0;i--){ var vv=num(pf[i].field1); if(vv!==null){pv=vv;break;} }
          cfg.kpis.forEach(function(k,ix){ if(!k.colorPv)return; var thr=L(k.field), el=g("kpi_"+ix); if(!el||thr===null||!thr||pv===null)return;
            el.style.color=thresholdColor(pv,thr); });
        }).catch(function(){});
      }
    }).catch(function(){});
    // KPIs aus anderen Kanaelen (z. B. HSH-Auslastung liegt im Wallbox-Kanal 172228)
    var extra={};
    cfg.kpis.forEach(function(k,i){ if(k.channel&&k.channel!==cfg.channel){ (extra[k.channel]=extra[k.channel]||[]).push({k:k,i:i}); } });
    Object.keys(extra).forEach(function(ch){
      j(api(ch, "/feeds.json?results=300", false)).then(function(d){
        var f=(d&&d.feeds)?d.feeds:[];
        function L2(fd){ for(var i=f.length-1;i>=0;i--){ var v=num(f[i][fd]); if(v!==null)return v; } return null; }
        extra[ch].forEach(function(o){ var g2=g("kpi_"+o.i); if(!g2)return; var v=L2(o.k.field); if(v!==null&&o.k.scale)v=v*o.k.scale;
          g2.textContent = o.k.map ? (v===null?"–":o.k.map(v)) : fmt(v,o.k.dec||0); });
      }).catch(function(){});
    });
  }

  // Charts gemaess Zeitraum (Heute: days=1 / 7 Tage: days=7)
  function loadCharts(){
    // Alle Kanaele sammeln, die von Chart-Linien gebraucht werden (Standard: cfg.channel).
    var chans={}; chans[String(cfg.channel)]=cfg.channel;
    cfg.charts.forEach(function(c){ (c.lines||[]).forEach(function(ln){ if(ln.channel) chans[String(ln.channel)]=ln.channel; }); });
    var keys=Object.keys(chans);
    Promise.all(keys.map(function(k){ var ch=chans[k];
      return j(api(ch, periodUrl(), String(ch)==="172430")).then(function(d){ return {k:k, feeds:(d&&d.feeds)?d.feeds:[]}; }); }))
    .then(function(results){
      var byChan={}; results.forEach(function(r){ byChan[r.k]=r.feeds; });
      var f=byChan[String(cfg.channel)]||[];
      var lastTs = f.length ? new Date(f[f.length-1].created_at) : null;
      cfg.charts.forEach(function(c,i){ var holder=g("chart_"+i); if(!holder)return;
        var series=c.lines.map(function(ln){ var pts=[]; var ff=byChan[String(ln.channel||cfg.channel)]||[]; ff.forEach(function(x){ var raw=num(x[ln.field]);
            var v = ln.derive ? ln.derive(raw) : (raw===null?null:(ln.scale? raw*ln.scale : raw));
            pts.push({t:new Date(x.created_at), v:v}); });
          return {color:ln.color, dash:ln.dash, width:ln.width, segColor:ln.segColor, bandFrac:ln.bandFrac, axis:ln.axis, dec:ln.dec, fill:ln.fill, pts: ln.derive? pts : downsample(pts,300)}; }).filter(function(s){return s.pts.length>1;});
        if(c.minmaxField){ var vv=[],ct=[]; f.forEach(function(x){ var v=num(x[c.minmaxField]); if(v!==null){ vv.push(v); ct.push(new Date(x.created_at)); } });
          if(vv.length>1){ var mn=Math.min.apply(null,vv), mx=Math.max.apply(null,vv), t0=ct[0], t1=ct[ct.length-1];
            series.push({color:"var(--muted)",dash:true,pts:[{t:t0,v:mn},{t:t1,v:mn}]});
            series.push({color:"var(--muted)",dash:true,pts:[{t:t0,v:mx},{t:t1,v:mx}]}); } }
        if(c.threshold!=null && f.length){ var t0=new Date(f[0].created_at), t1=new Date(f[f.length-1].created_at);
          series.push({color:"var(--red)",dash:true,pts:[{t:t0,v:c.threshold},{t:t1,v:c.threshold}]}); }
        if(g("ct_"+i)) g("ct_"+i).textContent = lastTs ? "Stand "+relTime(lastTs) : "";
        lineChart(holder, series, {unit:c.unit, zero:c.zero, padL:c.padL, yMin:c.yMin, yMax:c.yMax, yTicks:c.yTicks, unit2:c.unit2, zero2:c.zero2, yMin2:c.yMin2, yMax2:c.yMax2});
      });
      if(g("err2"))g("err2").textContent="";
    }).catch(function(){ if(g("err2"))g("err2").textContent="Daten konnten nicht geladen werden."; });
  }

  return {
    render:function(main){
      mode = "heute";  // bei jedem Mount auf Standard (passt zum aktiven Button)
      var kp=cfg.kpis.map(function(k,i){ return kpiCard(k.label,"kpi_"+i,k.unit||""); }).join("");
      var charts=cfg.charts.map(function(c,i){
        var items=(c.lines||[]).map(function(ln){ return '<span class="it"><span class="sw" style="border-color:'+ln.color+(ln.dash?';border-top-style:dashed':'')+'"></span>'+(ln.label||'')+'</span>'; });
        if(c.minmaxField) items.push('<span class="it"><span class="sw" style="border-color:var(--muted);border-top-style:dashed"></span>Min/Max</span>');
        var leg = (c.lines && (c.lines.length>1 || c.minmaxField)) ? '<div class="legend">'+items.join("")+'</div>' : "";
        return '<div class="panel"><h2>'+c.title+' <span class="tag" id="ct_'+i+'"></span></h2>'+leg+'<div id="chart_'+i+'"><div class="chart-empty">wird geladen…</div></div>'+(c.note?'<div class="note">'+c.note+'</div>':'')+'</div>';
      }).join("");
      main.innerHTML='<div class="wrap"><div class="view-head"><h1>'+cfg.icon+" "+cfg.title+'</h1>'+
        '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">'+
          '<span class="seg" id="seg-period"><button data-m="heute" class="active">Heute</button><button data-m="24h">24 h</button><button data-m="7tage">7 Tage</button></span>'+
          '<div class="meta" id="head-meta">wird geladen…</div>'+
        '</div></div>'+
        '<div class="kpis">'+kp+'</div>'+charts+
        '<footer>Datenquelle: ThingSpeak Kanal '+cfg.channel+' · Aktualisierung alle 60 s · <span id="err2" style="color:var(--red)"></span></footer></div>';
      var sp=g("seg-period"); if(sp) sp.addEventListener("click",function(e){ var b=e.target.closest("button[data-m]"); if(!b)return; mode=b.getAttribute("data-m"); segActive(sp,b); loadCharts(); });
    },
    load:function(){ loadKpis(); loadCharts(); }
  };
}

    {field:"field8",label:"Abgas",unit:"°C",dec:0},
    {field:"field4",label:"Schnitzel-Füllstand",unit:"%",dec:0},
    {field:"field3",label:"Temp. vor Schnitzelbunker",unit:"°C",dec:1,warnAbove:25},
    {channel:172228,field:"field1",label:"HSH-Auslastung",unit:"%",dec:0}
  ],
  charts:[
    {title:"Kesseltemperaturen", unit:"°C", zero:false, minmaxField:"field1", lines:[{field:"field1",label:"oben",color:"var(--amber)"},{field:"field2",label:"mitte",color:"var(--blue)"}]},
    {title:"Abgastemperatur", unit:"°C", zero:false, lines:[{field:"field8",label:"Abgas",color:"var(--red)"}]},
    {title:"Temperatur vor Schnitzelbunker", unit:"°C", zero:false, threshold:25, lines:[{field:"field3",label:"vor Bunker",color:"#b5651d"}]},
    {title:"Holzschnitzel-Füllstand", unit:"%", lines:[{field:"field4",label:"Füllstand",color:"var(--green)"}]}
  ]});

var BOILER=simpleView({ channel:502977, icon:'<svg viewBox="0 0 24 24" width="22" height="22" style="vertical-align:-4px"><rect x="5.5" y="4" width="13" height="17" rx="5" fill="#2b83c7"/><rect x="10.5" y="1.5" width="3" height="3" rx="1" fill="#7fb2dd"/><path d="M12 9.5c1.7 2.1 2.6 3.4 2.6 4.7a2.6 2.6 0 1 1-5.2 0c0-1.3 .9-2.6 2.6-4.7z" fill="#eaf4fb"/></svg>', title:"Boiler",
  kpis:[
    {field:"field1",label:"Temperatur mitte",unit:"°C",dec:1,
      color:function(v){ return bandColor([[25,"#3b5bdb"],[45,"#d4c21a"],[70,"#2fb344"],[90,"#f08c00"],[Infinity,"#e03131"]],v); }},
    {field:"field2",label:"Temperatur unten",unit:"°C",dec:1,
      color:function(v){ return bandColor([[35,"#8b5cf6"],[70,"#2fb344"],[90,"#f4a261"],[Infinity,"#e03131"]],v); }},
    {field:"field3",label:"Ladeleistung",unit:"W",dec:0,color:chargeColor},
    {field:"field4",label:"Einschaltschwelle",unit:"W",dec:0,colorPv:true}
  ],
  charts:[
    {title:"Boiler-Temperaturen", unit:"°C", zero:false, lines:[{field:"field1",label:"mitte",color:"var(--amber)"},{field:"field2",label:"unten",color:"var(--blue)"}]},
    {title:"Ladeleistung &amp; Einschaltschwelle", unit:"W", yMax:7000, lines:[{field:"field3",label:"Ladeleistung",color:"var(--green)",dec:0,fill:true},{field:"field3",label:"Laden verlangen, zu wenig PV-Überschuss",color:"var(--red)",width:4,derive:function(v){return (v>0 && v<11)?10:null;}},{channel:172430,field:"field1",label:"PV-Leistung",color:"var(--amber)",dec:0},{field:"field4",label:"Einschaltschwelle",color:"var(--blue)",dec:0,dash:true}]}
  ]});

/* ================= Routing ================= */
/* ================= View: Vorgeschlagene Gerätenutzung (Solar-Planer) ================= */
var PLANNER={ LAT:46.966, LON:7.742, TILT:60, AZ:0, CH:172430,
  // Testannahmen Geraete (Leistung/Energie je Lauf)
  // je Geraet: Laufdauer h und Leistung kw (Energie/Lauf = h*kw)
  devices:[ {n:"Waschmaschine", h:1.5, kw:1}, {n:"Geschirrspüler", h:3, kw:1}, {n:"Tumbler", h:3.5, kw:1} ],
  car:{ n:"Auto (VW ID.3)", cap:58, minKw:1.3, maxKw:11, kwhPer100:20 },  // Verbrauch 20 kWh/100km
  // Haushalts-Grundlast (kW) je Monat Jan..Dez, tagsueber (von PV gedeckt, daher
  // im Netzbezug ~unsichtbar). Realer Dauerbezug ~0.5 kW (Kuehlung, Standby,
  // Pumpen), Winter etwas hoeher. Wird beim Ueberschuss immer abgezogen.
  baseByMonth:[0.7,0.7,0.6,0.5,0.5,0.5,0.5,0.5,0.5,0.6,0.65,0.7], _cache:null, _pNow:null, _todayActual:null, _boilerNow:null, _carNow:null };

PLANNER.render=function(main){
  main.innerHTML='<div class="wrap">'+
    '<div class="view-head"><h1>🗓️ Vorgeschlagene Gerätenutzung</h1><div class="meta" id="pl-meta">wird geladen…</div></div>'+
    '<div class="panel"><h2>Solarprognose 7 Tage <span class="tag" id="pl-cal"></span></h2>'+
      '<div id="pl-chart"><div class="chart-empty">wird geladen…</div></div>'+
      '<div class="note">Erwartete PV-Leistung – Prognose (Open-Meteo, geneigte Einstrahlung '+PLANNER.TILT+'°/Süd), pro Tagesstunde an den letzten 14 Tagen kalibriert (berücksichtigt die lokale Horizont-Verschattung im Tal, v.a. abends).</div></div>'+
    '<div class="panel"><h2>Tagesübersicht &amp; Empfehlungen</h2><div id="pl-days"><div class="chart-empty">wird geladen…</div></div>'+
      '<div class="note">Ampel je Gerät: 🟢 gut machbar · 🟠 knapp · 🔴 zu spät bzw. zu wenig Überschuss. „Heute" wird ab der aktuellen Uhrzeit gerechnet und mit der aktuellen PV-Leistung nachgeführt (Nowcast); Aktualisierung alle 60 s. Laufzeiten: Waschmaschine 1.5 h, Geschirrspüler 3 h, Tumbler 3.5 h (je 1 kW). Überschuss = Brutto-PV (ab Wechselrichter) − Haushalts-Grundlast (~0.5 kW) − aktuelle Boiler-/Auto-Ladeleistung (Vorrang Boiler → Auto → Geräte). Auto: 58 kWh, 1.3–11 kW, 20 kWh/100 km.</div></div>'+
    '<footer>Prognose: Open-Meteo · Kalibrierung: ThingSpeak Kanal '+PLANNER.CH+' · <span id="pl-err" style="color:var(--red)"></span></footer></div>';
};

// Kalibrierung pro Tagesstunde: Median(Ist-Leistung / GTI) je Stunde der letzten
// 14 Tage. Bildet die lokale Horizont-/Terrain-Verschattung ab (im Emmental-Tal
// geht die Sonne abends frueh hinter die Huegel -> Abendfaktor faellt gegen 0),
// die die reine Prognose nicht kennt. Ergebnis: F[0..23] (kW pro kW/m²).
PLANNER._calcHourFactors=function(){
  var u="https://api.open-meteo.com/v1/forecast?latitude="+PLANNER.LAT+"&longitude="+PLANNER.LON+"&hourly=global_tilted_irradiance&tilt="+PLANNER.TILT+"&azimuth="+PLANNER.AZ+"&past_days=14&forecast_days=0&timezone=Europe%2FZurich";
  var pj=api(PLANNER.CH,"/feeds.json?days=14&average=60&timezone=Europe/Zurich",true);
  return Promise.all([ j(u), j(pj) ]).then(function(res){
    var gj=res[0], tj=res[1];
    var gt=gj.hourly.time, gg=gj.hourly.global_tilted_irradiance, gmap={};
    for(var i=0;i<gt.length;i++) gmap[gt[i].slice(0,13)]=gg[i];  // key YYYY-MM-DDTHH (lokal)
    var bh={}; (tj.feeds||[]).forEach(function(x){ var k=x.created_at.slice(0,13); var g=gmap[k]; if(g==null||g<40)return; var a=num(x.field1); if(a===null)return; var h=parseInt(k.slice(11,13),10); (bh[h]=bh[h]||[]).push((a/1000)/(g/1000)); });
    function med(a){ a.sort(function(x,y){return x-y;}); return a.length?a[Math.floor(a.length/2)]:0; }
    var F=[], any=false; for(var h=0;h<24;h++){ F[h]=bh[h]?med(bh[h]):0; if(F[h]>0)any=true; }
    if(!any){ for(var h2=8;h2<=17;h2++) F[h2]=25; }  // Fallback ohne Ist-Daten
    return F;
  });
};

// Prognose (Stunden-Faktoren + 7-Tage-Vorhersage) laden/cachen (30 min).
// Geteilt von der Nutzung-Ansicht und der Energie-Tage-Grafik.
PLANNER.ensureForecast=function(){
  var self=this;
  if(self._cache && (Date.now()-self._cache.t)<1800000) return Promise.resolve(self._cache);
  var fcUrl="https://api.open-meteo.com/v1/forecast?latitude="+self.LAT+"&longitude="+self.LON+"&hourly=global_tilted_irradiance&tilt="+self.TILT+"&azimuth="+self.AZ+"&forecast_days=7&timezone=Europe%2FZurich";
  return Promise.all([ self._calcHourFactors(), j(fcUrl) ]).then(function(res){
    self._cache={t:Date.now(), factor:res[0], fc:res[1]}; return self._cache;
  });
};

PLANNER.load=function(){
  var g=function(id){return document.getElementById(id);};
  var draw=function(c){
    var F=c.factor, hj=c.fc;  // F = Stunden-Faktoren [0..23]
    var fmid=Math.round(F[13]||F[12]||0);
    if(g("pl-cal")) g("pl-cal").textContent="kalibriert stündlich (Ø mittags ~"+fmid+")";
    var ht=hj.hourly.time, hg=hj.hourly.global_tilted_irradiance;
    // stuendliche Leistung (kW) + Tageswerte
    var pts=[], days={}, order=[];
    for(var i=0;i<ht.length;i++){ var dt=new Date(ht[i].replace(" ","T")); var kw=(hg[i]||0)/1000*(F[dt.getHours()]||0);
      var base=PLANNER.baseByMonth[dt.getMonth()];
      pts.push({t:dt, v:kw});
      var d=ht[i].slice(0,10); if(!days[d]){ days[d]={kwh:0, surplus:0, peak:0, win:[], date:dt, base:base}; order.push(d); }
      days[d].kwh+=kw; days[d].surplus+=Math.max(0,kw-base); if(kw>days[d].peak)days[d].peak=kw; days[d].win.push({h:dt.getHours(),kw:kw}); }
    if(g("pl-chart")) lineChart(g("pl-chart"), [{color:"var(--green)", fill:true, pts:pts}], {unit:"kW", dec:1});
    // Tageskarten
    var wd=["So","Mo","Di","Mi","Do","Fr","Sa"], today=new Date().toISOString().slice(0,10);
    var nowH=new Date().getHours();
    var applTotal=0; PLANNER.devices.forEach(function(dv){applTotal+=dv.h*dv.kw;});  // 8 kWh
    var col={green:"var(--green)",orange:"var(--amber)",red:"var(--red)"};
    var cards=order.map(function(d,idx){ var o=days[d];
      var isToday=(d===today);
      // --- Nowcast HEUTE: aktuelle/heutige Ist-Produktion einbeziehen -----------
      // scale korrigiert die Restprognose. Bevorzugt kumulativ (Summe Ist /
      // Summe Prognose ueber die bereits vergangenen produktiven Stunden heute),
      // ersatzweise die Momentanleistung. So greift der Nowcast auch morgens,
      // sobald die Sonne ueber den Talrand kommt, und nicht erst mittags.
      var scale=1, curKw=(isToday && PLANNER._pNow!=null)?PLANNER._pNow:null;
      if(isToday){
        var ta=PLANNER._todayActual||{}, aSum=0, fSum=0;
        o.win.forEach(function(w){ if(w.h<nowH && w.kw>0.3 && ta[w.h]!=null){ aSum+=ta[w.h]; fSum+=w.kw; } });
        if(fSum>1){ scale=Math.min(aSum/fSum, 1.3); }
        else if(curKw!=null){ var fN=0; o.win.forEach(function(w){ if(w.h===nowH) fN=w.kw; }); if(fN>0.3) scale=Math.min(curKw/fN, 1.3); }
      }
      // effektive Stundenleistung: vergangene Stunden = Ist, aktuelle = Momentan,
      // kuenftige = Prognose x Nowcast-Faktor.
      function effKw(w){
        if(!isToday) return w.kw;
        if(w.h<nowH){ var a=(PLANNER._todayActual||{})[w.h]; return (a!=null)?a:w.kw*scale; }
        if(w.h===nowH && curKw!=null) return curKw;
        return w.kw*scale;
      }
      // Vorrang-Lasten HEUTE (aktuelle Ist-Werte): Boiler + Auto-Laden werden vom
      // Ueberschuss abgezogen (Reihenfolge Boiler -> Auto -> Geraete). Nur die
      // aktuelle Ist-Last -> wirkt auf die aktuelle Stunde bzw. den Jetzt-Ueberschuss.
      var loadNow = isToday ? ((PLANNER._boilerNow||0)+(PLANNER._carNow||0)) : 0;
      function effSur(w){ var s=effKw(w)-o.base; if(isToday && w.h===nowH) s-=loadNow; return Math.max(0,s); }
      // Kennzahlen: heute ab jetzt (Rest) mit Nowcast, sonst volle Tagesprognose.
      var kwh=0, sur=0, peak=0, lo=null, hi=null;
      o.win.forEach(function(w){ if(isToday && w.h<nowH) return; var e=effKw(w);
        kwh+=e; sur+=effSur(w); if(e>peak)peak=e; if(e>=2){ if(lo===null)lo=w.h; hi=w.h; } });
      kwh=Math.round(kwh); sur=Math.round(sur);
      // aktuell FREI verfuegbarer Ueberschuss (heute) nach Boiler+Auto – "wirklich Strom da"
      var curSur=null;
      if(isToday){ var fN=0; o.win.forEach(function(w){ if(w.h===nowH) fN=w.kw; }); var nowEff=(curKw!=null?curKw:fN*scale); curSur=nowEff-o.base-loadNow; }
      var winTxt = lo!==null ? ((lo<10?"0"+lo:lo)+"–"+(hi+1<10?"0"+(hi+1):(hi+1))+" Uhr") : "kaum Ertrag";
      var sun = sur>=100?"☀️☀️☀️":(sur>=50?"☀️☀️":(sur>=15?"☀️":"☁️"));
      var chargeKw=Math.max(PLANNER.car.minKw, Math.min(PLANNER.car.maxKw, Math.round(peak-o.base)));
      // Geraete-Ampel: Stunden (heute ab jetzt) mit Ueberschuss >= 1 kW; reicht die Fensterdauer fuer die Laufzeit?
      var q=o.win.filter(function(w){ return (!isToday || w.h>=nowH) && effSur(w)>=1; });
      function ampel(dev){ if(!q.length || sur < dev.h*dev.kw) return "red";
        var avail=(q[q.length-1].h+1)-q[0].h;
        if(avail < dev.h*0.5) return "red";
        // heute nur gruen, wenn AKTUELL wirklich Ueberschuss (>=1 kW) produziert wird;
        // vor Sonnenaufgang / bei zu wenig Leistung hoechstens orange.
        if(isToday && !(curSur>=1)) return "orange";
        return avail>=dev.h ? "green" : "orange"; }
      var devRows=PLANNER.devices.map(function(dev){ var c=ampel(dev);
        return '<div style="display:flex;align-items:center;gap:7px;font-size:.85rem;margin:3px 0"><span style="width:11px;height:11px;border-radius:50%;background:'+col[c]+';flex:none"></span>'+dev.n+' <span style="color:var(--muted)">('+String(dev.h).replace(".",",")+' h)</span></div>'; }).join("");
      var carKwh=Math.min(Math.max(0,Math.round(sur-applTotal)), PLANNER.car.cap);
      var carKm=Math.round(carKwh/PLANNER.car.kwhPer100*100);
      // Auto-Ampel: reicht (Rest-)Fenster & Ueberschuss zum sinnvollen Laden?
      function carAmpel(){ if(carKwh<3 || !q.length) return "red";
        var avail=(q[q.length-1].h+1)-q[0].h;
        if(isToday){ if(avail<2) return "orange"; return curSur>=1 ? "green" : "orange"; }
        return carKwh>=15 ? "green" : "orange"; }
      var carC=carAmpel();
      var carSvg='<svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:-5px;margin-right:4px;flex:none"><path fill="'+col[carC]+'" d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>';
      var carTxt = carC==="red" ? "Auto: kaum Solar-Laden möglich" : ("Auto ~"+carKwh+" kWh (~"+carKm+" km) laden, bis "+chargeKw+" kW");
      var carRow='<div class="pd-rec" style="margin-top:6px">'+carSvg+carTxt+'</div>';
      var dateTxt=(isToday?"Heute · ":"")+wd[o.date.getDay()]+" "+o.date.getDate()+"."+(o.date.getMonth()+1)+".";
      // Live-Zeile heute: aktuelle PV-Leistung + Vorrang-Lasten (Boiler/Auto) sichtbar machen
      var liveRow = '';
      if(isToday){
        var lc=(curSur!=null&&curSur>=1)?"var(--green)":"var(--muted)", ex="";
        if((PLANNER._boilerNow||0)>=0.1) ex+=" · Boiler "+PLANNER._boilerNow.toFixed(1);
        if((PLANNER._carNow||0)>=0.1) ex+=" · Auto "+PLANNER._carNow.toFixed(1);
        var freeTxt=(loadNow>=0.1)?(" → frei "+(curSur!=null?curSur.toFixed(1):"?")+" kW"):"";
        liveRow='<div class="pd-win" style="color:'+lc+';font-weight:600">Aktuell '+(curKw!=null?curKw.toFixed(1):"?")+' kW'+ex+freeTxt+(scale<0.9?" · Prognose ×"+scale.toFixed(2):"")+'</div>';
      }
      var kwhLbl = isToday ? ' <small>kWh ab jetzt</small>' : ' <small>kWh</small>';
      return '<div class="plday"><div class="pd-date">'+dateTxt+'</div><div class="pd-kwh">'+kwh+kwhLbl+'</div>'+
        liveRow+
        '<div class="pd-sun">'+sun+' <span style="font-size:.8rem;color:var(--muted);font-weight:600">Überschuss ~'+sur+' kWh</span></div>'+
        '<div class="pd-win">Solarfenster '+winTxt+' · Peak '+peak.toFixed(1)+' kW</div>'+
        devRows+carRow+'</div>';
    }).join("");
    if(g("pl-days")) g("pl-days").innerHTML='<div class="pldays">'+cards+'</div>';
    // Wochen-Tipp: Tag mit groesstem Ueberschuss fuers Auto
    var best=order.reduce(function(a,b){return days[b].surplus>days[a].surplus?b:a;},order[0]);
    var bo=days[best]; if(g("pl-meta")) g("pl-meta").textContent="Bester Ladetag: "+wd[bo.date.getDay()]+" "+bo.date.getDate()+"."+(bo.date.getMonth()+1)+". (~"+Math.round(bo.surplus)+" kWh Überschuss)";
    if(g("pl-err")) g("pl-err").textContent="";
  };
  var afterPnow=function(){
    PLANNER.ensureForecast().then(draw).catch(function(){ if(g("pl-err")) g("pl-err").textContent="Prognosedaten konnten nicht geladen werden."; });
  };
  // aktuelle PV-Leistung + heutige Ist-Kurve jedes Mal frisch holen
  // (Nowcast der Heute-Ampel, ~alle 60 s). _pNow = Momentanleistung (kW),
  // _todayActual = {stunde:kW} der bereits vergangenen Stunden heute.
  Promise.all([
    j(api(PLANNER.CH,"/feeds.json?results=1",true)),
    j(api(PLANNER.CH,"/feeds.json?days=1&average=60&timezone=Europe/Zurich",true)),
    j(api(502977,"/feeds.json?results=1")).catch(function(){return null;}),   // Boiler (oeffentlich)
    j(api(172228,"/feeds.json?results=1")).catch(function(){return null;})    // Wallbox (oeffentlich)
  ]).then(function(r){
    var f=(r[0]&&r[0].feeds)?r[0].feeds:[]; var v=f.length?num(f[f.length-1].field1):null;
    PLANNER._pNow=(v===null?null:v/1000);
    var td=new Date().toISOString().slice(0,10), th={};
    ((r[1]&&r[1].feeds)?r[1].feeds:[]).forEach(function(x){ if(x.created_at.slice(0,10)!==td)return; var a=num(x.field1); if(a===null)return; th[parseInt(x.created_at.slice(11,13),10)]=a/1000; });
    PLANNER._todayActual=th;
    // aktuelle Boiler-Ladeleistung (kW, field3 in W) – Vorrang, wird abgezogen
    var bf=(r[2]&&r[2].feeds&&r[2].feeds[0])?r[2].feeds[0]:null;
    PLANNER._boilerNow = bf ? Math.max(0,(num(bf.field3)||0)/1000) : null;
    // aktuelle Auto-Ladeleistung (kW, field4 in µW) – nur wenn Wallbox laedt (Status 67)
    var wf=(r[3]&&r[3].feeds&&r[3].feeds[0])?r[3].feeds[0]:null;
    PLANNER._carNow = wf ? (Math.round(num(wf.field8))===67 ? Math.max(0,(num(wf.field4)||0)*1e-6) : 0) : null;
    afterPnow();
  }).catch(function(){ afterPnow(); });
};

var VIEWS={ pv:PV, wallbox:WALLBOX, heizung:HEIZUNG, boiler:BOILER, planer:PLANNER };
var state={timer:null};
function switchView(v){
  if(!VIEWS[v]) v="pv";
  if(state.timer){ clearInterval(state.timer); state.timer=null; }
  var tabs=document.querySelectorAll("#tabs a");
  tabs.forEach(function(a){ a.classList.toggle("active", a.getAttribute("data-view")===v); });
  var main=document.getElementById("view");
  VIEWS[v].render(main);
  VIEWS[v].load();
  state.timer=setInterval(VIEWS[v].load, 60000);
  if(location.hash.slice(1)!==v) location.hash=v;
}
document.getElementById("tabs").addEventListener("click",function(e){ var a=e.target.closest("a[data-view]"); if(!a)return; e.preventDefault(); switchView(a.getAttribute("data-view")); });
window.addEventListener("hashchange",function(){ switchView(location.hash.slice(1)); });
switchView(location.hash.slice(1) || "pv");
</script>
