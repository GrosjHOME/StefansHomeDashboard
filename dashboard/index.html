<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- PWA: als App installierbar (Manifest + Service Worker sw.js, Icons in icons/) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#059669">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zuhause">
<title>Grosjeans Zuhause – Dashboard</title>
<style>
  :root{
    --bg:#eef2f5; --card:#ffffff; --ink:#1f2933; --muted:#6b7280; --line:#e3e8ee;
    --amber:#f5a623; --amber-lt:#f7d774; --green:#2e9e5b; --blue:#2b83c7; --red:#d64545;
    --nav:#ffffff; --shadow:0 1px 3px rgba(20,30,40,.10), 0 1px 2px rgba(20,30,40,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0f1720; --card:#18212b; --ink:#e6edf3; --muted:#95a1ad; --line:#2a3540;
    --nav:#131b24; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0f1720; --card:#18212b; --ink:#e6edf3; --muted:#95a1ad; --line:#2a3540; --nav:#131b24; --shadow:0 1px 3px rgba(0,0,0,.4);
  }}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; font-size:15px; line-height:1.4;}

  /* Moderne Top-Navigation */
  .nav{position:sticky; top:0; z-index:10; background:var(--nav); border-bottom:1px solid var(--line);
    box-shadow:var(--shadow); display:flex; align-items:center; gap:14px; padding:10px 16px; flex-wrap:wrap;}
  .brand{font-weight:700; font-size:1.05rem; display:flex; align-items:center; gap:7px; white-space:nowrap;}
  .tabs{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
  .tabs a{cursor:pointer; text-decoration:none; color:var(--muted); font-weight:600; font-size:.92rem;
    padding:7px 14px; border-radius:999px; display:flex; align-items:center; gap:6px; transition:all .15s ease;}
  .tabs a:hover{background:var(--bg); color:var(--ink);}
  .tabs a.active{background:var(--green); color:#fff;}
  .navright{display:flex; align-items:center; gap:10px;}
  .link-old{font-size:.8rem; color:var(--muted); text-decoration:none; padding:6px 10px; border:1px solid var(--line); border-radius:8px;}
  .link-old:hover{color:var(--ink);}
  .theme-btn{cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; width:36px; height:36px; font-size:1.05rem;}

  .wrap{max-width:1100px; margin:0 auto; padding:16px 16px 30px;}
  .view-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .view-head h1{font-size:1.3rem; margin:0; display:flex; align-items:center; gap:8px;}
  .meta{font-size:.82rem; color:var(--muted); text-align:right;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle;}
  .dot.ok{background:var(--green);} .dot.bad{background:var(--red);} .dot.na{background:#b0b8c0;}

  .hero{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:16px;}
  .hero .lbl{color:var(--muted); font-size:.85rem;}
  .hero .val{font-size:2.8rem; font-weight:700; line-height:1.1; margin:2px 0 6px;}
  .hero .val small{font-size:1.1rem; font-weight:600; color:var(--muted);}
  .bar{position:relative; height:12px; border-radius:6px; background:var(--line); overflow:hidden;}
  .bar > span{position:relative; z-index:1; display:block; height:100%; border-radius:6px; background:var(--muted); transition:width .6s ease;}
  .bar > .band{display:none; position:absolute; z-index:0; top:0; bottom:0; background:var(--green); opacity:.18;}
  .bar > .mark{display:none; position:absolute; z-index:2; top:0; bottom:0; width:3px; margin-left:-1.5px; border-radius:2px; background:var(--ink); opacity:.55;}
  .bar-soll{font-size:.72rem; color:var(--muted); margin-top:4px;}
  .bar-scale{position:relative; display:flex; justify-content:space-between; font-size:.72rem; color:var(--muted); margin-top:3px;}
  /* Mittlere Skalenbeschriftung: am Soll-Strich (bzw. 15 kW in der Mitte, wenn kein Soll) */
  .bar-scale .mid{position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap;}
  .bar-scale .mid.soll{color:var(--ink); font-weight:600;}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px;}
  .kpi{background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px;}
  .kpi .k{color:var(--muted); font-size:.8rem; margin-bottom:4px;}
  .kpi .v{font-size:1.45rem; font-weight:700;}
  .kpi .v small{font-size:.8rem; font-weight:600; color:var(--muted);}
  .kpi .stale{font-size:.72rem; font-weight:600; color:var(--red); margin-top:4px;}
  .kpi .v.txt{font-size:1.1rem; line-height:1.3;}   /* Text-Werte (z. B. "Lädt nicht") kleiner als Zahlen */
  .sec-head{display:flex; align-items:center; flex-wrap:wrap; gap:4px 8px; margin:2px 2px 10px;}
  .sec-head h2{font-size:1rem; margin:0;}
  .sec-head .tag{font-size:.7rem; font-weight:600; color:var(--muted); background:var(--card); padding:2px 8px; border-radius:20px;}
  .sec-head .tag.warn{color:var(--red);}
  /* In Gruppen: Kacheln behalten ihre Breite (auto-fill statt auto-fit) - eine einzelne
     Kachel wird nicht ueber die ganze Zeile gezogen, Spalten fluchten ueber alle Gruppen */
  .sec-head + .kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}

  .panel{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px; margin-bottom:16px;}
  .panel h2{font-size:1rem; margin:0 0 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .panel h2 .tag{font-size:.7rem; font-weight:600; color:var(--muted); background:var(--bg); padding:2px 8px; border-radius:20px;}
  .seg{display:inline-flex; gap:2px; background:var(--bg); border-radius:8px; padding:2px; flex-wrap:wrap; margin-left:auto;}
  /* Zusatz-Steuerelement links vom Umschalter: der Umschalter bleibt fix oben rechts.
     flex-basis 0 haelt die Gruppe in der Titelzeile; wird es zu eng, bricht dank
     wrap-reverse nur das Zusatz-Element unter den Umschalter um. */
  .head-ctl{flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap-reverse;}
  .head-ctl .seg{margin-left:0;}
  .seg button{cursor:pointer; border:0; background:transparent; color:var(--muted); font-family:inherit; font-size:.76rem; font-weight:600; padding:4px 10px; border-radius:6px;}
  .seg button.active{background:var(--card); color:var(--ink); box-shadow:var(--shadow);}
  .chart-wrap{position:relative;}
  .tip{position:absolute; pointer-events:none; background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:8px; padding:6px 9px; font-size:.78rem; line-height:1.35; white-space:nowrap; opacity:0; transition:opacity .08s; z-index:5;}
  svg.chart{width:100%; height:auto; display:block;}
  .chart-empty{color:var(--muted); font-size:.9rem; padding:20px 0; text-align:center;}
  .legend{display:flex; gap:4px 16px; flex-wrap:wrap; font-size:.8rem; color:var(--muted); margin:2px 0 10px;}
  .legend .it{display:flex; align-items:center; gap:6px;}
  .legend .sw{width:16px; height:0; border-top:3px solid;}

  table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums;}
  th,td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--line);}
  th:first-child,td:first-child{text-align:left;}
  thead th{font-size:.78rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  tbody tr:last-child td{border-bottom:none;}
  tr.sum td{font-weight:700; border-top:2px solid var(--line);}
  .wr-head{font-weight:700; color:var(--blue);}
  .note{font-size:.8rem; color:var(--muted); margin-top:10px;}
  /* Tageskarten: hoechstens 4 nebeneinander (7 Tage -> 4 + 3, weniger Zeilenumbrueche in den
     Karten); schmale Bildschirme wie bisher mit weniger Spalten (mind. 180 px je Karte) */
  .pldays{display:grid; grid-template-columns:repeat(auto-fit,minmax(max(180px, calc((100% - 3*12px)/4)),1fr)); gap:12px;}
  .plday{background:var(--bg); border-radius:12px; padding:12px 14px; border:1px solid var(--line);}
  .plday .pd-date{font-size:.8rem; color:var(--muted); font-weight:600;}
  .plday .pd-kwh{font-size:1.5rem; font-weight:700; margin:2px 0;}
  .plday .pd-sun{font-size:1.05rem; margin-bottom:6px;}
  .plday .pd-win{font-size:.78rem; color:var(--muted); margin-bottom:6px;}
  .plday .pd-rec{font-size:.85rem; line-height:1.35;}
  footer{font-size:.78rem; color:var(--muted); text-align:center; margin-top:8px;}
  /* PV-Tab auf breiten Bildschirmen: ganze Breite, zwei Spalten mit zusammengehoerenden Paaren
     (Leistung | Energie, Jahre | Strom + Spannung, DC | Mittags-Strom). Darunter bleibt alles einspaltig. */
  @media (min-width:1500px){
    .wrap.wide{max-width:2400px; padding-left:24px; padding-right:24px;}
    .pv-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); column-gap:16px; align-items:start;
      grid-template-areas:"hero kpi" "leist energ" "jahr strom" "jahr spann" "dc verl";}
    .pv-grid .a-hero{grid-area:hero; align-self:stretch; display:flex; flex-direction:column; justify-content:center;}
    .pv-grid .a-kpi{grid-area:kpi; grid-template-columns:repeat(4,minmax(0,1fr));}
    .pv-grid .a-leist{grid-area:leist;} .pv-grid .a-energ{grid-area:energ;}
    .pv-grid .a-jahr{grid-area:jahr; align-self:stretch;} .pv-grid .a-strom{grid-area:strom;} .pv-grid .a-spann{grid-area:spann;}
    .pv-grid .a-dc{grid-area:dc;} .pv-grid .a-verl{grid-area:verl;}
    /* Wallbox/Heizung/Boiler: Kennzahl-Gruppen nebeneinander, Grafiken paarweise */
    .kp-grid{display:grid; grid-template-columns:var(--cols); column-gap:16px; align-items:start;}
    .ch-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); column-gap:16px; align-items:stretch;}
    /* Nutzung: Prognose-Grafik volle Breite (autoW), die 7 Tageskarten in einer Reihe */
    .plan-wide .pldays{grid-template-columns:repeat(7,minmax(0,1fr));}
  }
  @media (max-width:560px){
    .wrap{padding:12px 12px 24px;}
    .nav{gap:8px 12px; padding:8px 12px;}
    .brand{font-size:.95rem; order:1;}
    .navright{order:2; margin-left:auto;}
    .tabs{order:3; flex:1 1 100%; flex-wrap:nowrap; justify-content:space-between;}
    .tabs a{padding:6px 10px; font-size:1.15rem; white-space:nowrap;}
    .tabs a .tl{display:none;}  /* wenig Platz -> nur Icons */
    .hero .val{font-size:2.2rem;}
    .panel{padding:12px 12px;}
    .kpis{gap:8px; grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}
    .sec-head + .kpis{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
    .view-head h1{font-size:1.15rem;}
  }
</style>
</head>
<body>
  <header class="nav">
    <div class="brand">⚡ Grosjeans Zuhause</div>
    <nav class="tabs" id="tabs">
      <a data-view="pv">☀️<span class="tl"> PV-Anlage</span></a>
      <a data-view="wallbox">🚗<span class="tl"> Wallbox</span></a>
      <a data-view="heizung">🔥<span class="tl"> Heizung</span></a>
      <a data-view="boiler"><svg viewBox="0 0 24 24" width="17" height="17" style="vertical-align:-4px"><rect x="5.5" y="4" width="13" height="17" rx="5" fill="#2b83c7"/><rect x="10.5" y="1.5" width="3" height="3" rx="1" fill="#7fb2dd"/><path d="M12 9.5c1.7 2.1 2.6 3.4 2.6 4.7a2.6 2.6 0 1 1-5.2 0c0-1.3 .9-2.6 2.6-4.7z" fill="#eaf4fb"/></svg><span class="tl"> Boiler</span></a>
      <a data-view="planer">🗓️<span class="tl"> Nutzung</span></a>
    </nav>
    <div class="navright">
      <a class="link-old" href="../thingspeak-dashboard/index.html" title="Original mit ThingSpeak-iframes">ThingSpeak</a>
      <button id="theme-toggle" class="theme-btn" title="Hell/Dunkel">🌙</button>
    </div>
  </header>
  <main id="view"></main>

<script>
/* ================= Theme ================= */
(function(){
  var root=document.documentElement, t=null;
  try{ t=localStorage.getItem("shoTheme"); }catch(e){}
  if(t) root.setAttribute("data-theme",t);
  function cur(){ return root.getAttribute("data-theme") || ((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light"); }
  var btn=document.getElementById("theme-toggle");
  function upd(){ btn.textContent = cur()==="dark"?"☀️":"🌙"; }
  btn.addEventListener("click",function(){ var n=cur()==="dark"?"light":"dark"; root.setAttribute("data-theme",n); try{localStorage.setItem("shoTheme",n);}catch(e){} upd(); });
  upd();
})();

/* ================= Helfer ================= */
function j(u){ return fetch(u,{cache:"no-store"}).then(function(r){return r.json();}); }
function num(x){ return (x===null||x===undefined||x==="")?null:parseFloat(x); }
function fmt(v,d){ return v===null?"–":v.toLocaleString("de-CH",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function relTime(dt){ var s=Math.round((Date.now()-dt.getTime())/1000); if(s<90)return "vor "+s+" s"; var m=Math.round(s/60); if(m<90)return "vor "+m+" min"; var h=Math.round(m/60); if(h<48)return "vor "+h+" h"; return "vor "+Math.round(h/24)+" T"; }
function niceMax(m){ if(m<=0)return 1; var p=Math.pow(10,Math.floor(Math.log10(m))); var c=[1,1.5,2,2.5,3,4,5,6,8,10]; for(var i=0;i<c.length;i++){ if(c[i]*p>=m) return c[i]*p; } return 10*p; }
function ylab(v){ return (Math.abs(v-Math.round(v))<1e-9)?String(Math.round(v)):v.toFixed(1); }
// Farbverlauf ueber Stuetzstellen [[x,[r,g,b]],...], ausserhalb geklemmt
function rampColor(stops,x){
  var c=stops[stops.length-1][1];
  if(!(x>stops[0][0])) c=stops[0][1];
  else for(var i=1;i<stops.length;i++){ if(x<=stops[i][0]){ var a=stops[i-1], b=stops[i], f=(x-a[0])/(b[0]-a[0]);
    c=[0,1,2].map(function(k){ return Math.round(a[1][k]+(b[1][k]-a[1][k])*f); }); break; } }
  return "rgb("+c.join(",")+")";
}
// Feste Farbbaender [[obereGrenze,farbe],...] wie bei den ThingSpeak-Tachos
function bandColor(bands,v){ for(var i=0;i<bands.length;i++){ if(v<bands[i][0]) return bands[i][1]; } return bands[bands.length-1][1]; }
var C_RED=[214,69,69], C_ORANGE=[245,140,35], C_GREEN_LT=[166,227,161], C_GREEN_MID=[87,201,106], C_GREEN=[22,163,74];
// Einschaltschwelle: rot (keine PV) -> orange bis zur Schwelle; ab Schwelle gruen, 2 kW darueber voll gruen
function thresholdColor(pv,thr){
  return pv<thr ? rampColor([[0,C_RED],[thr,C_ORANGE]],pv) : rampColor([[thr,C_GREEN_LT],[thr+2000,C_GREEN]],pv);
}
// Boiler-Ladeleistung: 0 W neutral, 1-10 W rot (Laden verlangt, zu wenig PV), darueber Gruenverlauf
function chargeColor(w){
  if(w<=0) return "";
  if(w<11) return "rgb("+C_RED.join(",")+")";
  return rampColor([[1000,C_GREEN_LT],[1800,C_GREEN_MID],[4000,C_GREEN]],w);
}
function el(html){ var d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }
function api(ch,path,withKey){ var u="https://api.thingspeak.com/channels/"+ch+path; if(withKey) u+=(path.indexOf("?")>=0?"&":"?")+"api_key=6GIAGINL9VN4CTL8"; return u; }

/* Zeit-Liniendiagramm (1..n Serien) */
function lineChart(holder, series, opts){
  opts=opts||{};
  var hasRight = series.some(function(s){ return s.axis==="right"; });
  var allL=[], allR=[];
  series.forEach(function(s){ if(s.bandFrac!=null)return; var tgt=(s.axis==="right")?allR:allL; s.pts.forEach(function(p){ if(p.v!=null) tgt.push(p); }); });
  var all=allL.concat(allR);
  if(all.length<1){ holder.innerHTML='<div class="chart-empty">noch keine Daten</div>'; return; }
  // Linker Rand waechst mit der laengsten Text-Beschriftung der Y-Achse (Schrift 21 px, ~11.5 px/Zeichen)
  var longestTick=Math.max.apply(null,[0].concat((opts.yTicks||[]).map(function(tk){ return tk.label!=null?String(tk.label).length:0; })));
  // opts.autoW: Zeichenbreite = Pixelbreite (mind. 1000), damit Schrift und Hoehe bei sehr breiten
  // Charts (volle Bildschirmbreite) nicht mitwachsen
  var W=opts.autoW?Math.max(1000,Math.round(holder.clientWidth||0)):1000;
  var H=(opts.height||300),padL=Math.max(opts.padL||58, Math.ceil(longestTick*11.5)+16),padR=(hasRight?70:16),padT=28,padB=36;
  var tMin=Math.min.apply(null,all.map(function(p){return p.t.getTime();}));
  var tMax=Math.max.apply(null,all.map(function(p){return p.t.getTime();}));
  var singleT=(tMax===tMin); if(singleT)tMax=tMin+1;  // nur ein Zeitpunkt -> mittig
  function scaleFor(arr, zeroOpt, yMinOpt, yMaxOpt){
    if(!arr.length) return {base:0, top:1};
    var vMin=Math.min.apply(null,arr.map(function(p){return p.v;}));
    var vMax=Math.max.apply(null,arr.map(function(p){return p.v;}));
    var base,top;
    if(zeroOpt===false){ var pad=(vMax-vMin)*0.1||1; base=Math.floor(vMin-pad); top=Math.ceil(vMax+pad); }
    else { base=0; top=niceMax(vMax); }
    if(yMinOpt!=null) base=yMinOpt;
    if(yMaxOpt!=null) top=yMaxOpt;
    if(top<=base) top=base+1;
    return {base:base, top:top};
  }
  var L=scaleFor(allL, opts.zero, opts.yMin, opts.yMax);
  var R=scaleFor(allR, opts.zero2, opts.yMin2, opts.yMax2);
  function X(t){ return singleT ? (padL+(W-padR))/2 : padL+(W-padL-padR)*((t-tMin)/(tMax-tMin)); }
  function clampF(f){ return f<0?0:(f>1?1:f); }
  function Y(v){ return padT+(H-padT-padB)*(1-clampF((v-L.base)/(L.top-L.base))); }
  function Y2(v){ return padT+(H-padT-padB)*(1-clampF((v-R.base)/(R.top-R.base))); }
  function YF(s){ return (s.axis==="right")?Y2:Y; }
  var rColor="var(--amber)"; series.forEach(function(s){ if(s.axis==="right") rColor=s.color; });
  var grid="",yl="";
  var ticks = opts.yTicks || [{v:L.base},{v:(L.base+L.top)/2},{v:L.top}];
  ticks.forEach(function(tk){ var y=Y(tk.v);
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    yl+='<text x="'+(padL-8)+'" y="'+(y+7)+'" text-anchor="end" font-size="21" fill="var(--muted)">'+(tk.label!=null?tk.label:ylab(tk.v))+'</text>';
    if(hasRight){ var frac=1-(y-padT)/(H-padT-padB), rv=R.base+(R.top-R.base)*frac;
      yl+='<text x="'+(W-padR+8)+'" y="'+(y+7)+'" text-anchor="start" font-size="21" fill="'+rColor+'">'+ylab(rv)+'</text>'; } });
  var paths="";
  series.forEach(function(s){ if(s.pts.length<2)return; var YS=YF(s);
    if(s.segColor){ // segmentweise Faerbung nach Wert
      for(var q=0;q<s.pts.length-1;q++){ var p0=s.pts[q],p1=s.pts[q+1]; if(p0.v==null||p1.v==null)continue;
        paths+='<path d="M '+X(p0.t.getTime())+' '+YS(p0.v)+' L '+X(p1.t.getTime())+' '+YS(p1.v)+'" fill="none" stroke="'+s.segColor(p0.v)+'" stroke-width="2" stroke-linejoin="round"/>'; }
    } else { var yb = s.bandFrac!=null ? (padT+(H-padT-padB)*(1-s.bandFrac)) : null;
      var d="", pen=false; s.pts.forEach(function(p){ if(p.v==null){ pen=false; return; } d+=(pen?" L ":"M ")+X(p.t.getTime())+" "+(yb!=null?yb:YS(p.v)); pen=true; });
      paths+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.width||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="5 4"':'')+'/>'; } });
  // Punkt-Marker: bei opts.dots oder wenn eine Serie nur aus einem Punkt besteht
  // (dann waere sonst keine Linie sichtbar, z.B. erster Tag der Verlust-Diagnose).
  series.forEach(function(s){ if(s.bandFrac!=null||s.segColor)return; var YS=YF(s);
    var vis=s.pts.filter(function(p){return p.v!=null;});

var CMP_NOTES={
  kumuliert:"Aufsummierte Energie im Jahresverlauf (Jan–Dez) – jede Linie ein Jahr. Zeigt, ob das laufende Jahr über oder unter den Vorjahren liegt. Gestrichelt: aktueller Stand bis Dezember weitergezogen (Vergleich mit den Jahresendwerten).",

// Zweispaltig (ab 1500 px) steht der Jahresvergleich neben Strom + Spannung: seine Hoehe wird so
// angepasst, dass beide Spalten unten buendig abschliessen (sonst Luecke bzw. Ueberhang).
// Einspaltig: feste Hoehe 600. Ausgeloest nach dem Zeichnen und wenn Strom/Spannung die Groesse aendern.
PV.cumH=600;
PV.fitJahr=function(){
  var c=PV._cum; if(!c || !document.body.contains(c.holder)) return;
  var want=600;
  if(window.matchMedia("(min-width:1500px)").matches){
    var q=function(s){ return document.querySelector(s); }, st=q(".a-strom"), sp=q(".a-spann"), pn=q(".a-jahr"), nt=q("#cmp-note"), svg=c.holder.querySelector("svg");
    if(!st||!sp||!pn||!nt||!svg) return;
    var target=sp.getBoundingClientRect().bottom-st.getBoundingClientRect().top;       // Hoehe der rechten Spalte
    var natural=nt.getBoundingClientRect().bottom+parseFloat(getComputedStyle(nt).marginBottom||0)+
      parseFloat(getComputedStyle(pn).paddingBottom||0)-pn.getBoundingClientRect().top;  // Inhalt des Jahres-Panels
    var r=svg.getBoundingClientRect(); if(!r.width) return;
    want=Math.max(400, Math.round((r.height+target-natural)*1000/r.width));            // viewBox-Breite 1000
  }
  if(Math.abs(want-PV.cumH)<4) return;
  PV.cumH=want; c.opts.height=want; lineChart(c.holder, c.lines, c.opts);
};

// Balken "Aktuelle Leistung" gegen die Soll-Leistung jetzt. Soll = Planer-Prognose
// (Open-Meteo-Einstrahlung auf die Modulflaeche x stuendlicher Kalibrierfaktor der letzten
// 14 Tage), linear zwischen den Stunden interpoliert. Der Balken ist bis Soll - Toleranz
// (10 % darunter) voll orange, geht bis zum Soll-Strich in Gruen ueber und ist ab Soll gruen;
// das Toleranzband um den Soll-Strich ist dezent auf der Spur sichtbar. Nachts/ohne Prognose grau.
// Hinweis: Die Kalibrierung lernt laufend mit - ein schleichender Leistungsverlust
// faellt hier NICHT auf (dafuer die Grafik "Tracker-Strom mittags").
PV.SOLL_TOL=0.10;      // +-10 % der Soll-Leistung ...
PV.SOLL_TOL_MIN=0.5;   // ... mindestens +-0.5 kW (morgens/abends waeren 10 % zu eng)
PV.SOLL_MIN=0.3;       // Soll darunter (Nacht, Daemmerung): keine Bewertung
PV.NOWCAST_MAX=1.3;    // Nowcast (Rest des Tages x Ist/Prognose bis jetzt): hoechstens x1.3
                       // (Energie-Chart "heute" und Nutzung-Ansicht rechnen gleich)
PV.REF_FROM=2014;      // Energie/Monate: laufender Monat gegen Ø/Min/Max ALLER Jahre ab 2014
                       // (bewusst alle - ein Rueckgang der Anlage soll sichtbar bleiben, nicht wegmitteln)
PV.sollJetzt=function(c){
  var F=c.factor, ht=c.fc.hourly.time, hg=c.fc.hourly.global_tilted_irradiance, now=Date.now(), a=null, b=null;
  for(var i=0;i<ht.length;i++){ var d=new Date(ht[i]), tm=d.getTime()+1800000, kw=(hg[i]||0)/1000*(F[d.getHours()]||0);  // Stundenmittel = Wert zur Stundenmitte
    if(tm<=now) a={t:tm,v:kw}; else { b={t:tm,v:kw}; break; } }
  if(!a||!b) return null;
  return a.v+(b.v-a.v)*(now-a.t)/(b.t-a.t);
};
// PV-Morgenprognose vom Server (Val Town, scripts/valtown_pv_prognose/): um 05:00 fuer den
// ganzen Tag in 15-min-Schritten gerechnet und eingefroren. Grafik "Leistung" (heute, blau
// gestrichelt) und Soll am Balken nehmen sie; fehlt sie, rechnet der Balken live wie bisher.
PV.PROGNOSE_URL="https://steffgrosjean--23dbba40c0d911f1a70c1607ee4eb77e.web.val.run/";   // Val GrosjeansHomeDashboard, prognose.ts (leer = aus)
PV._morgen=null;      // {datum, p, t, pr}
PV.morgenPrognose=function(){
  if(!PV.PROGNOSE_URL) return Promise.resolve(null);
  var heute=ymdLocal(new Date()), c=PV._morgen;
  if(c && c.datum===heute){ if(c.pr) return c.pr; if(c.p || Date.now()-c.t<600000) return Promise.resolve(c.p); }  // ohne Prognose: nach 10 min erneut
  var pr=j(PV.PROGNOSE_URL).then(function(p){ return (p && p.datum===heute && p.punkte && p.punkte.length) ? p : null; })
    .catch(function(){ return null; })
    .then(function(p){ PV._morgen={datum:heute, p:p, t:Date.now()}; return p; });
  PV._morgen={datum:heute, p:null, t:Date.now(), pr:pr};
  return pr;

// Prognose-Leistung (kW) zu einem Zeitpunkt, zwischen den 15-min-Punkten linear
PV.morgenBei=function(p, ms){
  var a=p.punkte; if(!a.length || ms<a[0][0] || ms>a[a.length-1][0]) return null;
  for(var i=1;i<a.length;i++){ if(a[i][0]>=ms){ var x0=a[i-1], x1=a[i]; return x0[1]+(x1[1]-x0[1])*(ms-x0[0])/(x1[0]-x0[0]); } }
  return a[0][1];
};
PV.updateSoll=function(pKW){
  function g(id){return document.getElementById(id);}
  var bar=g("power-bar"), mk=g("power-soll"), bd=g("power-band"), tx=g("power-soll-txt"); if(!bar)return;
  var sm=g("power-scale-mid");
  function neutral(){ bar.style.background=""; if(mk)mk.style.display="none"; if(bd)bd.style.display="none"; if(tx)tx.textContent="";
    if(sm){ sm.textContent="15 kW"; sm.style.left="50%"; sm.className="mid"; } }   // ohne Soll: feste Mitte
  if(pKW===null){ neutral(); return; }
  // Soll: Morgenprognose (05:00) zur aktuellen Uhrzeit, sonst Live-Prognose
  PV.morgenPrognose().then(function(mp){
    var sm0=mp ? PV.morgenBei(mp, Date.now()) : null;
    if(sm0!==null) return {s:sm0, q:"Prognose von "+hhmm(Date.parse(mp.erstellt))+" Uhr"};
    return PLANNER.ensureForecast().then(function(c){ return {s:PV.sollJetzt(c), q:"Prognose aktuell"}; });
  }).then(function(r){
    if(!g("power-bar"))return;   // Ansicht inzwischen gewechselt
    var s=r.s;
    if(s===null || s<PV.SOLL_MIN){ neutral(); return; }
    var tol=Math.max(PV.SOLL_TOL*s, PV.SOLL_TOL_MIN), lo=Math.max(0,s-tol), hi=s+tol, lage;
    if(pKW<lo) lage="unter Soll"; else if(pKW>hi) lage="über Soll"; else lage="im Rahmen";
    function pc(kw){ return Math.max(0,Math.min(100,kw/30*100)); }   // Position auf der 0-30-kW-Spur
    // Farbverlauf auf dem Ist-Balken: voll orange bis Soll - Toleranz (10 % darunter), von dort
    // Uebergang bis zum Soll-Strich, ab Soll gruen. Stopps relativ zur Balkenlaenge (0..pKW)
    // und bewusst NICHT auf 100 % begrenzt: liegt der Uebergang rechts vom Balkenende, bleibt
    // der Balken orange bzw. nur teilweise gruen.
    if(pKW>0){ var st=function(kw){ return Math.min(5000,Math.max(0,kw/pKW*100)).toFixed(2)+"%"; };
      bar.style.background="linear-gradient(90deg, var(--amber) 0%, var(--amber) "+st(lo)+", var(--green) "+st(s)+")"; }
    if(bd){ bd.style.display="block"; bd.style.left=pc(lo)+"%"; bd.style.width=(pc(hi)-pc(lo))+"%"; }
    if(mk){ mk.style.display="block"; mk.style.left=pc(s)+"%"; mk.title="Soll jetzt: "+fmt(s,1)+" kW ("+r.q+")"; }
    // Skala: mittlere Beschriftung an den Soll-Strich; am Rand etwas nach innen, damit sie nicht
    // mit "0" bzw. "30 kW" kollidiert (der Strich selbst bleibt exakt).
    if(sm){ sm.textContent="Soll "+fmt(s,1)+" kW"; sm.style.left=Math.max(12,Math.min(85,pc(s)))+"%"; sm.className="mid soll"; }
    var dv=Math.round((pKW/s-1)*100);
    if(tx) tx.textContent="Soll "+fmt(s,1)+" kW · Ist "+(dv>0?"+":"")+dv+" % – "+lage+" (±"+fmt(tol,1)+" kW)";
  }).catch(neutral);
};

/* ---- Energie-Historie: schnelle Endpunkt-Abfragen + localStorage-Cache ----
   Abgeschlossene Monate aendern sich nie -> einmal holen, dann cachen; nur der
   laufende Monat/das laufende Jahr wird live geholt. Jahreswerte kommen aus den
   authoritativen Ist-Messwerten (genauer als ThingSpeak, das Luecken hat). */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }
function tsEnd(d){ function p(n){return (n<10?"0":"")+n;} return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" 23:59:59"; }

// Authoritative Jahres-Ist-Werte (kWh) aus den Abrechnungen; laufendes Jahr live.
var PV_HIST_YEARS = {
  2014:38115, 2015:40300, 2016:37200, 2017:38944, 2018:36022, 2019:39679,
  2020:40383, 2021:37189, 2022:40854, 2023:35549, 2024:31976, 2025:33986
};

// Historische Monatswerte (kWh, beide WR summiert) aus der MaxTalk-DB, Vor-
// ThingSpeak-Zeit. Index 0=Jan..11=Dez. Juni 2016: ein Wechselrichter war
// defekt, der gemessene Wert (1923 kWh) ist daher verdoppelt. Nov 2016 hat eine
// kleine Aufzeichnungsluecke. Ab 2017 kommen die Monate live aus ThingSpeak.
var PV_HIST_MONTHS = {
  2014:[709,2271,4143,3860,3852,4716,3592,3715,4006,3270,2139,1125],
  2015:[1360,1986,3677,4490,4010,4506,4926,4257,3382,2574,2625,2704],
  2016:[1406,1552,3197,3337,3945,1923*2,4366,4534,4045,2748,1585,3132]
};

// Monatssumme (kWh): historischer Wert falls vorhanden, sonst via Endpunkt
// (Feld 3 = Energie aktueller Monat); abgeschlossene Monate gecacht.
function pvMonthTotal(year,m0){
  if(PV_HIST_MONTHS[year] && PV_HIST_MONTHS[year][m0]!=null) return Promise.resolve(PV_HIST_MONTHS[year][m0]);
  var now=new Date(), isCur=(year===now.getFullYear() && m0===now.getMonth());
  var key="pv_m_"+year+"_"+m0;
  if(!isCur){ var c=lsGet(key); if(c!==null) return Promise.resolve(parseFloat(c)); }
  var path = isCur ? "/feeds.json?results=1" : "/feeds.json?results=1&end="+encodeURIComponent(tsEnd(new Date(year,m0+1,0)));
  return j(api(PV.CH,path,true)).then(function(d){ var f=(d&&d.feeds)?d.feeds:[]; var v=f.length?num(f[f.length-1].field3):null;
    if(v!==null && !isCur) lsSet(key,v); return v; });
}
// Jahressumme (kWh): Ist-Wert falls vorhanden, sonst laufendes Jahr live (Feld 4)
function pvYearTotal(year){
  if(PV_HIST_YEARS[year]!=null) return Promise.resolve(PV_HIST_YEARS[year]);
  var now=new Date(), isCur=(year===now.getFullYear());
  var key="pv_y_"+year;
  if(!isCur){ var c=lsGet(key); if(c!==null) return Promise.resolve(parseFloat(c)); }
  var path = isCur ? "/feeds.json?results=1" : "/feeds.json?results=1&end="+encodeURIComponent(year+"-12-31 23:59:59");
  return j(api(PV.CH,path,true)).then(function(d){ var f=(d&&d.feeds)?d.feeds:[]; var v=f.length?num(f[f.length-1].field4):null;
    if(v!==null && !isCur) lsSet(key,v); return v; });
}

// Laufender Monat/Jahr gegen die Vorjahre: Ist (orange) + hellgelb aufgestockt bis zum
// Durchschnitt, feine Striche fuer Min/Max. refs = Vergleichswerte (kWh) aller Vorjahre ab
// PV.REF_FROM - bewusst alle, damit ein Rueckgang der Anlage sichtbar bleibt.
function pvRefBand(b, refs, what, span, unit, dec){
  unit=unit||"kWh"; dec=dec||0;
  var avg=refs.reduce(function(a,c){ return a+c; },0)/refs.length, mn=Math.min.apply(null,refs), mx=Math.max.apply(null,refs);
  b.v2=Math.max(0,avg-b.v); b.color2="var(--amber-lt)"; b.lo=mn; b.hi=mx; b.show=b.v;
  b.tipExtra="Ø "+what+" "+span+": "+fmt(avg,dec)+" "+unit+" · Min "+fmt(mn,dec)+" · Max "+fmt(mx,dec);   // 3. Tooltip-Zeile
  return b;
}
function pvRefLegend(span){ return [{color:"var(--amber)",label:"Ist"},{color:"var(--amber-lt)",label:"Ø "+span},{color:"var(--muted)",label:"Min/Max "+span}]; }

// Tagesertraege vergangener Jahre fuer das Vergleichsband im Tage-Modus. Feld 2 = Tages-
// energie (kumuliert). ACHTUNG: der Zaehler wird nicht genau um Mitternacht zurueckgesetzt,
// sondern erst zwischen 00:00 und 01:00 - der 00:00-Wert ist noch der Vortag. Darum wird
// nach Zaehler-Reset getrennt (Abfall = neuer Produktionstag, dessen Maximum = Tagessumme)
// statt nach Kalenderdatum. Vergangene Tage aendern sich nie -> je Tag gecacht.
PV.DAY_REF_FROM=2017;  // Tageswerte gibt es erst ab 2017 (ThingSpeak; 2014-16 nur Monatssummen)
PV.DAY_REF_WIN=0;      // Vergleich: 0 = exakt derselbe Kalendertag der Vorjahre (gewuenscht, auch
                       // wenn zufaelliger); >0 = Fenster +-N Tage (robuster, Fenster ueberlappen)
PV.DAY_MAX_KWH=300;    // Plausibilitaet: groessere Tageswerte = Messfehler (30 kWp x 10 h)
function ymdStr(dt){ return dt.getFullYear()+"-"+("0"+(dt.getMonth()+1)).slice(-2)+"-"+("0"+dt.getDate()).slice(-2); }
// cal = [{yOff, m0, d}] (fortlaufende Kalendertage) -> Promise {"MM-DD": kWh} fuer das Jahr year
function pvDayTotals(year, cal){
  var out={}, miss=[];
  cal.forEach(function(c){ var dt=new Date(year+c.yOff, c.m0, c.d), k=ymdStr(dt), v=lsGet("pv_d_"+k);
    if(v!==null) out[k.slice(5)]=parseFloat(v); else miss.push(dt); });
  if(!miss.length) return Promise.resolve(out);
  var first=new Date(miss[0]); first.setDate(first.getDate()-1);   // Vortag mitladen (Nacht-Uebertrag)
  var path="/fields/2.json?start="+encodeURIComponent(ymdStr(first)+" 00:00:00")+"&end="+encodeURIComponent(ymdStr(miss[miss.length-1])+" 23:59:59")+
           "&timescale=60&timezone=Europe%2FZurich";
  return j(api(PV.CH,path,true)).then(function(d){ var mx={}, seg=null, prev=null;
    ((d&&d.feeds)||[]).forEach(function(x){ var v=num(x.field2); if(v===null||v<0||v>PV.DAY_MAX_KWH)return;
      var day=x.created_at.slice(0,10);
      // neuer Produktionstag: Zaehler faellt (Reset) - oder Datumswechsel nach einem Tag
      // ohne Ertrag (< 1 kWh, z. B. Schnee), dort ist kein Reset sichtbar
      if(seg===null || (prev!==null && v<prev-1) || (day!==seg.k && prev!==null && prev<1)){ seg={k:day, max:v};
        if(mx[seg.k]==null) mx[seg.k]=v; }
      if(v>seg.max) seg.max=v;
      if(seg.max>mx[seg.k]) mx[seg.k]=seg.max;
      prev=v; });
    miss.forEach(function(dt){ var k=ymdStr(dt); if(mx[k]!=null){ out[k.slice(5)]=mx[k]; lsSet("pv_d_"+k,mx[k]); } });   // nur Vorhandenes cachen
    return out; });
}
// Liefert eine Funktion range(t): Min/Max der Tagesertraege aller Vorjahre fuer "heute + t Tage"
// (t = 0 heute, 1/2 Prognose-Tage) samt Datum des Min-/Max-Tages, oder null. Mit
// PV.DAY_REF_WIN > 0 im Fenster +-N Tage (dann kann derselbe Rekordtag bei mehreren Balken
// das Maximum sein, weil sich die Fenster ueberlappen).
function pvDayHistory(){
  var now=new Date(), cy=now.getFullYear(), W=PV.DAY_REF_WIN, cal=[], yOffOf={};
  function at(off){ return new Date(cy, now.getMonth(), now.getDate()+off); }
  for(var off=-W; off<=2+W; off++){ var dt=at(off); cal.push({yOff:dt.getFullYear()-cy, m0:dt.getMonth(), d:dt.getDate()});
    yOffOf[ymdStr(dt).slice(5)]=dt.getFullYear()-cy; }
  var ys=[]; for(var y=PV.DAY_REF_FROM; y<cy; y++) ys.push(y);
  function dstr(e){ return parseInt(e.k.slice(3),10)+"."+parseInt(e.k.slice(0,2),10)+"."+e.y; }   // "5.10.2017"
  return Promise.all(ys.map(function(y){ return pvDayTotals(y,cal).catch(function(){ return {}; }); })).then(function(rs){
    var by={}; rs.forEach(function(res,i){ Object.keys(res).forEach(function(k){
      (by[k]=by[k]||[]).push({v:res[k], k:k, y:ys[i]+(yOffOf[k]||0)}); }); });
    return function(t){ var lo=null, hi=null, n=0;
      for(var o=t-W; o<=t+W; o++){ (by[ymdStr(at(o)).slice(5)]||[]).forEach(function(e){ n++;
        if(!lo||e.v<lo.v) lo=e; if(!hi||e.v>hi.v) hi=e; }); }
      return n ? {lo:lo.v, hi:hi.v, loDate:dstr(lo), hiDate:dstr(hi), n:n} : null; };
  });
}

PV.loadEnergy=function(){
  var holder=document.getElementById("chart-days"); if(!holder)return;
  var mo=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  var now=new Date();
  if(PV.energyMode==="monate"){
    var months=[];
    if(PV.energyYear){ var maxM=(PV.energyYear===now.getFullYear())?now.getMonth():11;
      for(var m=0;m<=maxM;m++) months.push({y:PV.energyYear,m:m}); }
    else { for(var i=11;i>=0;i--){ var dd=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({y:dd.getFullYear(),m:dd.getMonth()}); } }
    // Laufender Monat: Ist (orange) + hellgelb aufgestockt bis zum Durchschnitt dieses Monats
    // in allen Vorjahren ab PV.REF_FROM, dazu feine Striche fuer Min/Max dieser Jahre.
    var cy=now.getFullYear(), cm=now.getMonth();
    var showCur=months.some(function(mm){ return mm.y===cy && mm.m===cm; });
    var refYears=[]; if(showCur){ for(var ry=PV.REF_FROM; ry<cy; ry++) refYears.push(ry); }
    var span=refYears.length ? refYears[0]+"–"+String(refYears[refYears.length-1]).slice(2) : "";
    Promise.all([
      Promise.all(months.map(function(mm){ return pvMonthTotal(mm.y,mm.m).then(function(v){return {y:mm.y,m:mm.m,v:v};}); })),
      Promise.all(refYears.map(function(y){ return pvMonthTotal(y,cm).catch(function(){ return null; }); }))
    ]).then(function(rr){
      var res=rr[0], refs=rr[1].filter(function(v){ return v!==null && v>0; }), hasRef=false;
      var bars=res.filter(function(o){ return (o.v!==null&&o.v>0) || (o.y===cy&&o.m===cm); }).map(function(o){
        var b={label:mo[o.m]+" "+String(o.y).slice(2), v:o.v||0};
        if(o.y===cy && o.m===cm && refs.length){ pvRefBand(b, refs, mo[cm], span); hasRef=true; }
        return b; }).filter(function(b){ return b.v>0 || b.v2>0; });
      if(!bars.length){ holder.innerHTML='<div class="chart-empty">keine Daten für '+(PV.energyYear||"")+'</div>'; return; }
      barChart(holder,bars,{unit:"kWh",color:"var(--amber)", legend: hasRef ? pvRefLegend(span) : null});
    }).catch(function(){ holder.innerHTML='<div class="chart-empty">Daten konnten nicht geladen werden.</div>'; });
  } else if(PV.energyMode==="jahre"){
    var years=[]; for(var y=2014;y<=now.getFullYear();y++) years.push(y);
    Promise.all(years.map(function(y){ return pvYearTotal(y).then(function(v){return {y:y,v:v};}); })).then(function(res){
      // Laufendes Jahr gegen alle Vorjahre ab PV.REF_FROM (wie beim laufenden Monat).
      // Anzeige in MWh (kWh-Werte im 5-stelligen Bereich sprengen die Achsenbeschriftung).
      var cy=now.getFullYear(), span=PV.REF_FROM+"–"+String(cy-1).slice(2), hasRef=false;
      var refs=res.filter(function(o){ return o.y>=PV.REF_FROM && o.y<cy && o.v!==null && o.v>0; }).map(function(o){ return o.v/1000; });
      var bars=res.filter(function(o){return o.v!==null&&o.v>0;}).map(function(o){ var b={label:String(o.y),v:o.v/1000};
        if(o.y===cy && refs.length){ pvRefBand(b, refs, "Jahr", span, "MWh", 1); hasRef=true; }
        return b; });
      barChart(holder, bars, {unit:"MWh",dec:1,color:"var(--amber)", legend: hasRef ? pvRefLegend(span) : null});
    }).catch(function(){ holder.innerHTML='<div class="chart-empty">Daten konnten nicht geladen werden.</div>'; });
  } else {
    // Ist-Tageswerte + Prognose (heute + naechste 2 Tage) als hellgelbe Balken
    // Heute + Prognose-Tage zusaetzlich mit feinen Min/Max-Strichen: Spannweite der Tages-
    // ertraege aller Vorjahre (ab PV.DAY_REF_FROM) am selben Kalendertag (PV.DAY_REF_WIN).
    Promise.all([
      j(api(PV.CH,"/feeds.json?days=15&average=15",true)),
      PLANNER.ensureForecast().catch(function(){return null;}),
      pvDayHistory().catch(function(){return null;}),
      PV.prognoseListe()
    ]).then(function(res){
      var d=res[0], fc=res[1], hist=res[2], ml=res[3], hasHist=false;
      var hSpan=PV.DAY_REF_FROM+"–"+String(now.getFullYear()-1).slice(2);
      function band(b, ymd, todayYmd){ if(!hist)return; var t=Math.round((new Date(ymd+"T12:00")-new Date(todayYmd+"T12:00"))/864e5);
        var r=hist(t); if(!r)return; b.lo=r.lo; b.hi=r.hi; hasHist=true;
        b.tipExtra=(b.tipExtra?b.tipExtra+"<br>":"")+"Max "+fmt(r.hi,0)+" kWh ("+r.hiDate+") · Min "+fmt(r.lo,0)+" kWh ("+r.loDate+")"; }
      var f=(d&&d.feeds)?d.feeds:[],byDay={}; f.forEach(function(x){ var v=num(x.field2); if(v===null)return; var dt=new Date(x.created_at);
        var key=dt.getFullYear()+"-"+dt.getMonth()+"-"+dt.getDate(); if(!byDay[key]||v>byDay[key].v)byDay[key]={v:v,dt:dt}; });
      var arr=Object.keys(byDay).map(function(k){return byDay[k];}).sort(function(a,b){return a.dt-b.dt;}).slice(-14);
      var bars=arr.map(function(o){return {label:o.dt.getDate()+"."+(o.dt.getMonth()+1)+".",v:o.v,dt:o.dt};});
      function ymdOf(dt){ return dt.getFullYear()+"-"+("0"+(dt.getMonth()+1)).slice(-2)+"-"+("0"+dt.getDate()).slice(-2); }
      if(fc && fc.fc && fc.fc.hourly){
        var F=fc.factor, ht=fc.fc.hourly.time, hg=fc.fc.hourly.global_tilted_irradiance;
        var perDay={}, order=[], nowH=now.getHours(), frac=now.getMinutes()/60, todayYmd=ymdOf(now), remToday=0, pastToday=0;
        for(var i=0;i<ht.length;i++){ var dt=new Date(ht[i].replace(" ","T")); var kw=(hg[i]||0)/1000*(F[dt.getHours()]||0); var ymd=ht[i].slice(0,10);
          if(!(ymd in perDay)){ perDay[ymd]=0; order.push(ymd); } perDay[ymd]+=kw;
          // Heute: Prognose bis jetzt und Rest ab jetzt. Die laufende Stunde nur anteilig -
          // ihr abgelaufener Teil steckt schon im Ist (sonst doppelt gezaehlt).
          if(ymd===todayYmd){ var hh=dt.getHours();
            if(hh<nowH) pastToday+=kw; else if(hh===nowH){ pastToday+=kw*frac; remToday+=kw*(1-frac); } else remToday+=kw; } }
        var fut=order.filter(function(y){return y>=todayYmd;}).slice(0,3);  // heute + 2
        var last=bars.length?bars[bars.length-1]:null;
        var lastYmd=(last&&last.dt)?ymdOf(last.dt):null;
        fut.forEach(function(ymd){
          var dObj=new Date(ymd+"T12:00"), lbl=dObj.getDate()+"."+(dObj.getMonth()+1)+".";
          if(ymd===todayYmd && lastYmd===todayYmd){
            // heute: Ist-Balken behalten, erwarteten Rest oben aufstapeln. Nowcast wie in der
            // Nutzung-Ansicht: Rest x (Ist / Prognose bis jetzt), max. x PV.NOWCAST_MAX - laeuft
            // die Anlage heute ueber/unter der Prognose, gilt das auch fuer den Rest des Tages.
            var sc=1; if(pastToday>1) sc=Math.min(last.v/pastToday, PV.NOWCAST_MAX);
            var rest=remToday*sc;
            last.v2=Math.max(0,Math.round(rest)); last.color="var(--amber)"; last.color2="var(--amber-lt)";
            last.tip="Heute · bisher "+Math.round(last.v)+" + Rest "+Math.round(rest)+" kWh";
            last.tipExtra="Prognose roh ganzer Tag "+Math.round(perDay[ymd])+" kWh · Rest ×"+sc.toFixed(2)+" (Ist/Prognose bis jetzt)";
            band(last, ymd, todayYmd);
          } else {
            var nb={label:lbl, v:0, v2:Math.round(perDay[ymd]||0), color2:"var(--amber-lt)",
              tip:(ymd===todayYmd?"Heute":lbl)+" · Prognose"};   // Wert steht in der Tooltip-Wertzeile
            band(nb, ymd, todayYmd); bars.push(nb);
          }
        });
      }
      // Morgenprognose je Tag (prognose.ts ?liste) als blauer Strich; abgeschlossene Tage mit Abweichung
      // Ist gegen Prognose, in der Legende die mittlere Abweichung (Betrag) dieser Tage
      var devs=[], anyMark=false;
      if(ml){ var tY=ymdOf(now);
        bars.forEach(function(b){ if(!b.dt) return; var ymd=ymdOf(b.dt), mp=ml[ymd]; if(!mp) return;
          b.mark=mp.kwh; anyMark=true; var txt="Prognose "+hhmm(Date.parse(mp.erstellt))+" Uhr: "+mp.kwh+" kWh";
          if(ymd<tY && mp.kwh>0){ var dv=Math.round((b.v/mp.kwh-1)*100); devs.push(Math.abs(dv)); txt+=" · Ist "+(dv>0?"+":"")+dv+" %"; }
          b.tipExtra=txt+(b.tipExtra?"<br>"+b.tipExtra:""); }); }
      var leg=[{color:"var(--amber)",label:"Ist"},{color:"var(--amber-lt)",label:"Prognose"}];
      if(anyMark){ var avg=devs.reduce(function(a,x){return a+x;},0)/(devs.length||1);
        leg.push({color:"var(--blue)",label:"Prognose 05:00"+(devs.length?" (Ø Abweichung ±"+Math.round(avg)+" % über "+devs.length+" Tag"+(devs.length>1?"e":"")+")":"")}); }
      if(hasHist) leg.push({color:"var(--muted)",label:(PV.DAY_REF_WIN ? "Min/Max ±"+PV.DAY_REF_WIN+" Tage " : "Min/Max gleicher Tag ")+hSpan});
      barChart(holder,bars,{unit:"kWh",color:"var(--amber)",legend:leg});
    }).catch(function(){ holder.innerHTML='<div class="chart-empty">Daten konnten nicht geladen werden.</div>'; });
  }
};

/* ========== Generische Ansicht (Wallbox/Heizung/Boiler) ========== */
function simpleView(cfg){
  var mode = "heute";  // "heute" (ab Mitternacht) | "24h" | "7tage" (steuert alle Charts der Ansicht)
  function g(id){ return document.getElementById(id); }
  function periodUrl(){ return periodQuery(mode); }

  // Gruppen-Kopf (cfg.sections): "Stand vor ..." des Kanals; mit staleMin der Gruppe
  // rot "veraltet", wenn der Kanal so lange nichts Neues geliefert hat (z. B. Poller aus).
  // Mit season (Monate 0-11, in denen die Anlage laeuft) ausserhalb der Saison statt der
  // roten Warnung neutral "Sommerpause" - z. B. Heizung, die nicht das ganze Jahr laeuft.
  function secStand(ch, ts){ (cfg.sections||[]).forEach(function(s){ if(String(s.channel)!==String(ch))return; var el=g("sec_"+s.key); if(!el)return;
    var t=ts?new Date(ts):null, old=!!s.staleMin && (!t || (Date.now()-t.getTime())>s.staleMin*60000);
    var inSeason=!s.season || s.season.indexOf(new Date().getMonth())>=0, warn=old && inSeason;
    el.textContent=(warn?"⚠ veraltet – ":(old?"Sommerpause – ":""))+(t?"Stand "+relTime(t):"keine Daten");
    el.className="tag"+(warn?" warn":""); }); }

  // KPIs immer aktuell (letzter bekannter Wert), unabhaengig vom Zeitraum
  function loadKpis(){
    j(api(cfg.channel, "/feeds.json?results=10", false)).then(function(d){
      var f=(d&&d.feeds)?d.feeds:[]; if(!f.length){ if(g("head-meta"))g("head-meta").textContent="keine Daten"; return; }
      var last=f[f.length-1];
      function L(fd){ for(var i=f.length-1;i>=0;i--){var v=num(f[i][fd]); if(v!==null)return v;} return null; }
      cfg.kpis.forEach(function(k,i){ if(k.integrate)return; if(k.channel&&k.channel!==cfg.channel)return; var v=L(k.field); if(v!==null&&k.scale)v=v*k.scale; var el=g("kpi_"+i); if(!el)return;
        el.textContent = k.map ? (v===null?"–":k.map(v)) : fmt(v,k.dec||0);
        if(k.warnAbove!=null) el.style.color = (v!==null && v>k.warnAbove) ? "var(--red)" : "";
        if(k.color) el.style.color = (v===null) ? "" : k.color(v); });
      if(g("head-meta")&&last.created_at) g("head-meta").textContent="Aktualisiert "+relTime(new Date(last.created_at));
      secStand(cfg.channel, last.created_at);
      // Ampel-Faerbung: KPI-Wert nach aktueller PV-Leistung gegenueber der Schwelle
      // (rot = keine PV-Leistung, orange bis zur Schwelle, gruen ab Schwelle)
      if(cfg.kpis.some(function(k){return k.colorPv;})){
        j(api(172430,"/feeds.json?results=5",true)).then(function(pd){
          var pf=(pd&&pd.feeds)?pd.feeds:[], pv=null; for(var i=pf.length-1;i>=0;i--){ var vv=num(pf[i].field1); if(vv!==null){pv=vv;break;} }
          cfg.kpis.forEach(function(k,ix){ if(!k.colorPv)return; var thr=L(k.field), el=g("kpi_"+ix); if(!el||thr===null||!thr||pv===null)return;
            el.style.color=thresholdColor(pv,thr); });
        }).catch(function(){});
      }
    }).catch(function(){});
    // KPIs aus anderen Kanaelen (z. B. HSH-Auslastung liegt im Wallbox-Kanal 172228)
    var extra={};
    cfg.kpis.forEach(function(k,i){ if(k.channel&&k.channel!==cfg.channel){ (extra[k.channel]=extra[k.channel]||[]).push({k:k,i:i}); } });
    Object.keys(extra).forEach(function(ch){
      j(api(ch, "/feeds.json?results=300", false)).then(function(d){
        var f=(d&&d.feeds)?d.feeds:[];
        function L2(fd){ for(var i=f.length-1;i>=0;i--){ var v=num(f[i][fd]); if(v!==null)return v; } return null; }
        extra[ch].forEach(function(o){ var g2=g("kpi_"+o.i); if(!g2)return; var v=L2(o.k.field); if(v!==null&&o.k.scale)v=v*o.k.scale;
          g2.textContent = o.k.map ? (v===null?"–":o.k.map(v)) : fmt(v,o.k.dec||0);
          // Warnung, wenn der Kanal seit staleMin Minuten nichts Neues geliefert hat (z. B. Poller ausgefallen)
          if(o.k.staleMin){ var card=g2.closest(".kpi"), w=card.querySelector(".stale");
            if(!w){ w=document.createElement("div"); w.className="stale"; card.appendChild(w); }
            var lastT=f.length?new Date(f[f.length-1].created_at):null, old=!lastT||(Date.now()-lastT.getTime())>o.k.staleMin*60000;
            w.textContent = old ? "⚠ veraltet – "+(lastT?"Stand "+relTime(lastT):"keine Daten") : "";
            w.style.display = old ? "" : "none"; } });
        secStand(ch, f.length ? f[f.length-1].created_at : null);
      }).catch(function(){});
    });
  }

  // Charts gemaess Zeitraum (Heute: days=1 / 7 Tage: days=7)
  function loadCharts(){
    // Alle Kanaele sammeln, die von Chart-Linien gebraucht werden (Standard: cfg.channel).
    var chans={}; chans[String(cfg.channel)]=cfg.channel;
    cfg.charts.forEach(function(c){ (c.lines||[]).forEach(function(ln){ if(ln.channel) chans[String(ln.channel)]=ln.channel;
      (ln.uses||[]).forEach(function(u){ chans[String(u)]=u; }); }); });
    var keys=Object.keys(chans);
    Promise.all(keys.map(function(k){ var ch=chans[k];
      return j(api(ch, periodUrl(), String(ch)==="172430")).then(function(d){ return {k:k, feeds:(d&&d.feeds)?d.feeds:[]}; }); }))
    .then(function(results){
      var byChan={}; results.forEach(function(r){ byChan[r.k]=r.feeds; });
      var f=byChan[String(cfg.channel)]||[];
      // Wert eines Feldes (beliebiger Kanal) zum Zeitpunkt t: letzter Eintrag <= t (Stufe halten).
      // Fuer berechnete Linien (calc), z. B. Schaltschwellen, die von der PV-Leistung abhaengen.
      var smp={};
      function at(ch,field,t){ var key=ch+"|"+field, s=smp[key];
        if(!s){ s=smp[key]={ts:[],vs:[]}; (byChan[String(ch)]||[]).forEach(function(x){ var v=num(x[field]); if(v!==null){ s.ts.push(new Date(x.created_at).getTime()); s.vs.push(v); } }); }
        var lo=0, hi=s.ts.length-1, r=-1; while(lo<=hi){ var m=(lo+hi)>>1; if(s.ts[m]<=t){ r=m; lo=m+1; } else hi=m-1; }
        return r<0 ? (s.vs.length?s.vs[0]:null) : s.vs[r]; }
      var lastTs = f.length ? new Date(f[f.length-1].created_at) : null;
      // Integral-KPIs (z. B. "Geladene Menge"): Leistung (W) ueber den Zeitraum
      // aufintegrieren -> kWh. Heute/24h aus den vorhandenen Chart-Feeds; fuer 7 Tage
      // die vollen 7 Tage in 2 Fenstern nachladen (ThingSpeak roh ~8000 Punkte ≈ 6.5 Tage).
      cfg.kpis.forEach(function(k,ki){ if(!k.integrate)return; var el=g("kpi_"+ki); if(!el)return;
        var ch=k.channel||cfg.channel, dec=(k.dec!=null?k.dec:1), withKey=(String(ch)==="172430"), toKw=k.intScale;
        if(mode==="7tage"){
          var now=Date.now(), mid=now-3.5*864e5, wk=mode;
          var u1=api(ch,"/feeds.json?start="+encodeURIComponent(tsStamp(now-7*864e5))+"&end="+encodeURIComponent(tsStamp(mid)),withKey);
          var u2=api(ch,"/feeds.json?start="+encodeURIComponent(tsStamp(mid))+"&end="+encodeURIComponent(tsStamp(now)),withKey);
          Promise.all([j(u1),j(u2)]).then(function(rr){ if(mode!==wk)return;  // Zeitraum inzwischen gewechselt
            var ff=((rr[0]&&rr[0].feeds)||[]).concat((rr[1]&&rr[1].feeds)||[]);
            el.textContent = fmt(integKwh(ff,k.field,toKw), dec); }).catch(function(){});
        } else {
          el.textContent = fmt(integKwh(byChan[String(ch)]||[], k.field, toKw), dec);
        }
      });
      cfg.charts.forEach(function(c,i){ var holder=g("chart_"+i); if(!holder)return;
        var series=c.lines.map(function(ln){ var pts=[]; var ff=byChan[String(ln.channel||cfg.channel)]||[];
          if(ln.calc){
            // Berechnete Linie, z. B. Schaltschwellen. Optional calcBase: ein Stufenwert (etwa 58/63 °C).
            // Mit ln.maxHoldMin bleibt der hoechste Basiswert so lange nach seinem letzten Auftreten
            // stehen - schwankt die PV-Leistung um eine Grenze (wolkig), entsteht ein ruhiger Block statt
            // Gezappel, und kurze Phasen gehen nicht verloren. calc bekommt den Wert als 3. Argument.
            var baseAt=null;
            if(ln.calcBase){
              var bt=[], bv=[];
              ff.forEach(function(x){ var tm=new Date(x.created_at).getTime();
                var b=ln.calcBase(x, function(ch,field){ return at(ch,field,tm); });
                if(b===null||b===undefined) return;
                bt.push(tm); bv.push(b); });
              var win=(ln.maxHoldMin||0)*60000;
              baseAt=function(tm){
                var lo=0, hi=bt.length-1, r=-1; while(lo<=hi){ var m=(lo+hi)>>1; if(bt[m]<=tm){ r=m; lo=m+1; } else hi=m-1; }
                if(r<0) return bv.length?bv[0]:null;
                var mx=bv[r]; for(var i=r-1; i>=0 && bt[i]>=tm-win; i--){ if(bv[i]>mx) mx=bv[i]; }   // Maximum im Fenster
                return mx; };
            }
            var cp=[];
            ff.forEach(function(x){ var t=new Date(x.created_at), tm=t.getTime();
              var v=ln.calc(x, function(ch,field){ return at(ch,field,tm); }, baseAt?baseAt(tm):null);
              if(v===null||v===undefined) return;
              cp.push({t:t, v:v}); });
            // Gleiche Werte in Folge auf Anfang/Ende reduzieren: Konstanten und Stufen bleiben scharf,
            // gleitende Abschnitte (z. B. Mitte + 2 K) bleiben vollstaendig erhalten.
            cp.forEach(function(p,i){ var a=cp[i-1], b=cp[i+1]; if(a && b && a.v===p.v && b.v===p.v) return; pts.push(p); });
            return {color:ln.color, dash:ln.dash, width:ln.width, axis:ln.axis, dec:ln.dec, pts:pts};
          }
          ff.forEach(function(x){ var raw=num(x[ln.field]);
            // Eintraege ohne dieses Feld ueberspringen statt als Luecke zeichnen: z. B. schreibt in den
            // Wallbox-Kanal stuendlich ein Eintrag nur mit field1. derive-Linien (rote Markierung)
            // brauchen die Nullen dagegen bewusst, um nur abschnittsweise zu erscheinen.
            if(raw===null && !ln.derive) return;
            var v = ln.derive ? ln.derive(raw) : (ln.scale? raw*ln.scale : raw);
            pts.push({t:new Date(x.created_at), v:v}); });
          return {color:ln.color, dash:ln.dash, width:ln.width, segColor:ln.segColor, bandFrac:ln.bandFrac, axis:ln.axis, dec:ln.dec, fill:ln.fill, pts: ln.derive? pts : downsample(pts,300)}; }).filter(function(s){return s.pts.length>1;});
        if(c.minmaxField){ var vv=[],ct=[]; f.forEach(function(x){ var v=num(x[c.minmaxField]); if(v!==null){ vv.push(v); ct.push(new Date(x.created_at)); } });
          if(vv.length>1){ var mn=Math.min.apply(null,vv), mx=Math.max.apply(null,vv), t0=ct[0], t1=ct[ct.length-1];
            series.push({color:"var(--muted)",dash:true,pts:[{t:t0,v:mn},{t:t1,v:mn}]});
            series.push({color:"var(--muted)",dash:true,pts:[{t:t0,v:mx},{t:t1,v:mx}]}); } }
        if(c.threshold!=null && f.length){ var t0=new Date(f[0].created_at), t1=new Date(f[f.length-1].created_at);
          series.push({color:"var(--red)",dash:true,pts:[{t:t0,v:c.threshold},{t:t1,v:c.threshold}]}); }
        if(g("ct_"+i)) g("ct_"+i).textContent = lastTs ? "Stand "+relTime(lastTs) : "";
        lineChart(holder, series, {unit:c.unit, zero:c.zero, padL:c.padL, yMin:c.yMin, yMax:c.yMax, yTicks:c.yTicks, unit2:c.unit2, zero2:c.zero2, yMin2:c.yMin2, yMax2:c.yMax2});
      });
      if(g("err2"))g("err2").textContent="";
    }).catch(function(){ if(g("err2"))g("err2").textContent="Daten konnten nicht geladen werden."; });
  }

  return {
    render:function(main){
      mode = "heute";  // bei jedem Mount auf Standard (passt zum aktiven Button)
      // KPI-Kacheln (Text-Werte kleiner). Mit cfg.sections in beschriftete Gruppen getrennt -
      // je Gruppe eine Quelle mit eigener Aktualitaet ("Stand vor ...", ggf. veraltet).
      function cards(filter){ return cfg.kpis.map(function(k,i){ return filter(k) ? kpiCard(k.label,"kpi_"+i,k.unit||"",k.map?"txt":"") : ""; }).join(""); }
      // Breit (ab 1500 px) stehen die Gruppen nebeneinander, Spaltenbreite nach Anzahl Kacheln (--cols)
      var nSec=function(s){ return Math.max(1, cfg.kpis.filter(function(k){ return k.sec===s.key; }).length); };
      var kp = cfg.sections
        ? '<div class="kp-grid" style="--cols:'+cfg.sections.map(function(s){ return "minmax(0,"+nSec(s)+"fr)"; }).join(" ")+'">'+
          cfg.sections.map(function(s){ return '<div class="kp-sec"><div class="sec-head"><h2>'+s.title+'</h2><span class="tag" id="sec_'+s.key+'"></span></div>'+
            '<div class="kpis">'+cards(function(k){ return k.sec===s.key; })+'</div></div>'; }).join("")+'</div>'
        : '<div class="kpis">'+cards(function(){ return true; })+'</div>';
      var charts=cfg.charts.map(function(c,i){
        var items=(c.lines||[]).map(function(ln){ return '<span class="it"><span class="sw" style="border-color:'+ln.color+(ln.dash?';border-top-style:dashed':'')+'"></span>'+(ln.label||'')+'</span>'; });
        if(c.minmaxField) items.push('<span class="it"><span class="sw" style="border-color:var(--muted);border-top-style:dashed"></span>Min/Max</span>');
        var leg = (c.lines && (c.lines.length>1 || c.minmaxField)) ? '<div class="legend">'+items.join("")+'</div>' : "";
        return '<div class="panel"><h2>'+c.title+' <span class="tag" id="ct_'+i+'"></span></h2>'+leg+'<div id="chart_'+i+'"><div class="chart-empty">wird geladen…</div></div>'+(c.note?'<div class="note">'+c.note+'</div>':'')+'</div>';
      }).join("");
      main.innerHTML='<div class="wrap wide"><div class="view-head"><h1>'+cfg.icon+" "+cfg.title+'</h1>'+
        '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">'+
          '<span class="seg" id="seg-period"><button data-m="heute" class="active">Heute</button><button data-m="24h">24 h</button><button data-m="7tage">7 Tage</button></span>'+
          '<div class="meta" id="head-meta">wird geladen…</div>'+
        '</div></div>'+
        kp+'<div class="ch-grid">'+charts+'</div>'+
        '<footer>Datenquelle: ThingSpeak Kanal '+cfg.channel+' · Aktualisierung alle 60 s · <span id="err2" style="color:var(--red)"></span></footer></div>';
      var sp=g("seg-period"); if(sp) sp.addEventListener("click",function(e){ var b=e.target.closest("button[data-m]"); if(!b)return; mode=b.getAttribute("data-m"); segActive(sp,b); loadCharts(); });
    },
    load:function(){ loadKpis(); loadCharts(); }
  };
}

// Kalibrierung pro Tagesstunde: Median(Ist-Leistung / GTI) je Stunde der letzten
// 14 Tage. Bildet die lokale Horizont-/Terrain-Verschattung ab (im Emmental-Tal
// geht die Sonne abends frueh hinter die Huegel -> Abendfaktor faellt gegen 0),
// die die reine Prognose nicht kennt. Ergebnis: F[0..23] (kW pro kW/m²), F[h] gilt fuer h-h+1 Uhr.
// Die PV-Stundenmittel kommen in drei 5-Tage-Fenstern: ThingSpeak mittelt hoechstens ~8000
// Rohwerte, mit days=14 kaemen nur ~8 Tage (PV sendet minuetlich).
PLANNER._calcHourFactors=function(){
  var u="https://api.open-meteo.com/v1/forecast?latitude="+PLANNER.LAT+"&longitude="+PLANNER.LON+"&hourly=global_tilted_irradiance&tilt="+PLANNER.TILT+"&azimuth="+PLANNER.AZ+"&past_days=14&forecast_days=0&timezone=Europe%2FZurich";
  var now=Date.now(), win=[0,1,2].map(function(k){ var e=now-k*5*864e5;
    return j(api(PLANNER.CH,"/feeds.json?average=60&start="+encodeURIComponent(tsStamp(e-5*864e5))+"&end="+encodeURIComponent(tsStamp(e)),true)); });
  return Promise.all([ j(u) ].concat(win)).then(function(res){
    var gj=res[0], feeds=[]; res.slice(1).forEach(function(t){ feeds=feeds.concat((t&&t.feeds)||[]); });
    var gt=gj.hourly.time, gg=omStart(gj.hourly.global_tilted_irradiance), gmap={};
    for(var i=0;i<gt.length;i++) gmap[gt[i].slice(0,13)]=gg[i];  // key YYYY-MM-DDTHH (lokal, Stundenbeginn)
    var bh={}; feeds.forEach(function(x){ var d=new Date(x.created_at), h=d.getHours();   // created_at in UTC
      var g=gmap[ymdLocal(d)+"T"+("0"+h).slice(-2)]; if(g==null||g<40)return; var a=num(x.field1); if(a===null)return; (bh[h]=bh[h]||[]).push((a/1000)/(g/1000)); });
    function med(a){ a.sort(function(x,y){return x-y;}); return a.length?a[Math.floor(a.length/2)]:0; }
    var F=[], any=false; for(var h=0;h<24;h++){ F[h]=bh[h]?med(bh[h]):0; if(F[h]>0)any=true; }
    if(!any){ for(var h2=8;h2<=17;h2++) F[h2]=25; }  // Fallback ohne Ist-Daten
    return F;
  });
};

// Prognose (Stunden-Faktoren + 7-Tage-Vorhersage) laden/cachen (30 min).
// Geteilt von der Nutzung-Ansicht und der Energie-Tage-Grafik.
PLANNER.ensureForecast=function(){
  var self=this;
  if(self._cache && (Date.now()-self._cache.t)<1800000) return Promise.resolve(self._cache);
  var fcUrl="https://api.open-meteo.com/v1/forecast?latitude="+self.LAT+"&longitude="+self.LON+"&hourly=global_tilted_irradiance,temperature_2m&tilt="+self.TILT+"&azimuth="+self.AZ+"&forecast_days=7&timezone=Europe%2FZurich";
  return Promise.all([ self._calcHourFactors(), j(fcUrl) ]).then(function(res){
    res[1].hourly.global_tilted_irradiance=omStart(res[1].hourly.global_tilted_irradiance);  // Wert bei h = h-h+1 Uhr
    self._cache={t:Date.now(), factor:res[0], fc:res[1]}; return self._cache;
  });
};

PLANNER.load=function(){
  var g=function(id){return document.getElementById(id);};
  var draw=function(c){
    var F=c.factor, hj=c.fc;  // F = Stunden-Faktoren [0..23]
    var fmid=Math.round(F[13]||F[12]||0);
    if(g("pl-cal")) g("pl-cal").textContent="kalibriert stündlich (Ø mittags ~"+fmid+")";
    var ht=hj.hourly.time, hg=hj.hourly.global_tilted_irradiance;

      var base=PLANNER.baseByMonth[dt.getMonth()];

      var d=ht[i].slice(0,10); if(!days[d]){ days[d]={kwh:0, surplus:0, peak:0, win:[], date:dt, base:base}; order.push(d); }

      plLegend=[{color:"var(--green)",label:"PV-Leistung (kW)"},{color:"var(--blue)",label:"Temperatur 2 m (°C)"}]; }
    // Pro Tag genau eine Datumsbeschriftung, mittig (12:00) unter dem jeweiligen Tagesverlauf
    var plWd=["So","Mo","Di","Mi","Do","Fr","Sa"], plTicks=order.map(function(d){ var nd=new Date(d+"T12:00:00");
      return {t:nd, label:plWd[nd.getDay()]+" "+nd.getDate()+"."+(nd.getMonth()+1)+"."}; });
    if(g("pl-chart")) lineChart(g("pl-chart"), plSeries, {unit:"kW", dec:1, unit2:"°C", zero2:false, legend:plLegend, xTicks:plTicks, autoW:true});
    // Tageskarten
    var wd=["So","Mo","Di","Mi","Do","Fr","Sa"], today=ymdLocal(new Date());   // Ortszeit (UTC waere 00-02 Uhr noch der Vortag)

      var scale=1, curKw=(isToday && PLANNER._pNow!=null)?PLANNER._pNow:null;
      if(isToday){
        var ta=PLANNER._todayActual||{}, aSum=0, fSum=0;
        o.win.forEach(function(w){ if(w.h<nowH && w.kw>0.3 && ta[w.h]!=null){ aSum+=ta[w.h]; fSum+=w.kw; } });
        if(fSum>1){ scale=Math.min(aSum/fSum, PV.NOWCAST_MAX); }
        else if(curKw!=null){ var fN=0; o.win.forEach(function(w){ if(w.h===nowH) fN=w.kw; }); if(fN>0.3) scale=Math.min(curKw/fN, PV.NOWCAST_MAX); }
      }

        if(w.h===nowH && curKw!=null) return curKw;

      }
      // Vorrang-Lasten HEUTE (aktuelle Ist-Werte): Boiler + Auto-Laden werden vom
      // Ueberschuss abgezogen (Reihenfolge Boiler -> Auto -> Geraete). Nur die
      // aktuelle Ist-Last -> wirkt auf die aktuelle Stunde bzw. den Jetzt-Ueberschuss.
      var loadNow = isToday ? ((PLANNER._boilerNow||0)+(PLANNER._carNow||0)) : 0;
      function effSur(w){ var s=effKw(w)-o.base; if(isToday && w.h===nowH) s-=loadNow; return Math.max(0,s); }
      // Kennzahlen: heute ab jetzt (Rest) mit Nowcast, sonst volle Tagesprognose.
      var kwh=0, sur=0, peak=0, lo=null, hi=null;
      o.win.forEach(function(w){ if(isToday && w.h<nowH) return; var e=effKw(w);
        kwh+=e; sur+=effSur(w); if(e>peak)peak=e; if(e>=2){ if(lo===null)lo=w.h; hi=w.h; } });
      kwh=Math.round(kwh); sur=Math.round(sur);
      // Boiler (grosser, unabhaengiger Verbraucher mit Warmwasser-Vorrang):
      // Tages-Ladearbeit. HEUTE Ist-basiert = max(Monats-Referenz, bereits heute geladen);
      // vom REST-Ueberschuss wird nur die noch kommende Energie abgezogen
      // (Ist-bisher ist bereits Vergangenheit). Solar-Deckung des Rests bewerten.

      var winTxt = lo!==null ? ((lo<10?"0"+lo:lo)+"–"+(hi+1<10?"0"+(hi+1):(hi+1))+" Uhr") : "kaum Ertrag";

        if((PLANNER._boilerNow||0)>=0.1) ex+=" · Boiler "+PLANNER._boilerNow.toFixed(1);
        if((PLANNER._carNow||0)>=0.1) ex+=" · Auto "+PLANNER._carNow.toFixed(1);
        var freeTxt=(loadNow>=0.1)?(" → frei "+(curSur!=null?curSur.toFixed(1):"?")+" kW"):"";
        liveRow='<div class="pd-win" style="color:'+lc+';font-weight:600">Aktuell '+(curKw!=null?curKw.toFixed(1):"?")+' kW'+ex+freeTxt+(scale<0.9?" · Prognose ×"+scale.toFixed(2):"")+'</div>';
      }
      var kwhLbl = isToday ? ' <small>kWh ab jetzt</small>' : ' <small>kWh</small>';
      return '<div class="plday"><div class="pd-date">'+dateTxt+'</div><div class="pd-kwh">'+kwh+kwhLbl+'</div>'+
        liveRow+
        '<div class="pd-sun">'+sun+' <span style="font-size:.8rem;color:var(--muted);font-weight:600">Überschuss ~'+sur+' kWh</span></div>'+
        '<div class="pd-win">Solarfenster '+winTxt+' · Peak '+peak.toFixed(1)+' kW</div>'+
        devRows+carRow+boilerRow+'</div>';
    }).join("");
    if(g("pl-days")) g("pl-days").innerHTML='<div class="pldays">'+cards+'</div>';
    // Wochen-Tipp: Tag mit groesstem Ueberschuss fuers Auto
    var best=order.reduce(function(a,b){return days[b].surplus>days[a].surplus?b:a;},order[0]);
    var bo=days[best]; if(g("pl-meta")) g("pl-meta").textContent="Bester Ladetag: "+wd[bo.date.getDay()]+" "+bo.date.getDate()+"."+(bo.date.getMonth()+1)+". (~"+Math.round(bo.surplus)+" kWh Überschuss)";
    if(g("pl-err")) g("pl-err").textContent="";
  };
  var afterPnow=function(){
    PLANNER.ensureForecast().then(draw).catch(function(){ if(g("pl-err")) g("pl-err").textContent="Prognosedaten konnten nicht geladen werden."; });
  };
  // aktuelle PV-Leistung + heutige Ist-Kurve jedes Mal frisch holen
  // (Nowcast der Heute-Ampel, ~alle 60 s). _pNow = Momentanleistung (kW),
  // _todayActual = {stunde:kW} der bereits vergangenen Stunden heute.
  Promise.all([
    j(api(PLANNER.CH,"/feeds.json?results=1",true)),
    j(api(PLANNER.CH,"/feeds.json?days=1&average=60&timezone=Europe/Zurich",true)),
    j(api(502977,"/feeds.json?results=1")).catch(function(){return null;}),   // Boiler aktuell (oeffentlich)
    j(api(172228,"/feeds.json?results=5")).catch(function(){return null;}),   // Wallbox (oeffentlich)
    j(api(502977,"/feeds.json?days=1&average=60&timezone=Europe/Zurich")).catch(function(){return null;})  // Boiler heute (Stundenmittel)
  ]).then(function(r){
    var f=(r[0]&&r[0].feeds)?r[0].feeds:[]; var v=f.length?num(f[f.length-1].field1):null;
    PLANNER._pNow=(v===null?null:v/1000);
    var td=ymdLocal(new Date()), th={};
    ((r[1]&&r[1].feeds)?r[1].feeds:[]).forEach(function(x){ if(x.created_at.slice(0,10)!==td)return; var a=num(x.field1); if(a===null)return; th[parseInt(x.created_at.slice(11,13),10)]=a/1000; });
    PLANNER._todayActual=th;
    // aktuelle Boiler-Ladeleistung (kW, field3 in W) – Vorrang, wird abgezogen
    var bf=(r[2]&&r[2].feeds&&r[2].feeds[0])?r[2].feeds[0]:null;
    PLANNER._boilerNow = bf ? Math.max(0,(num(bf.field3)||0)/1000) : null;
    // aktuelle Einschaltschwelle (W, field4): ab dieser PV-Leistung laedt der Boiler
    PLANNER._boilerThr = bf ? num(bf.field4) : null;
    // heute bereits geladene Boiler-Energie (kWh) aus Stundenmittel field3 integriert
    var bt=0, bany=false;
    ((r[4]&&r[4].feeds)?r[4].feeds:[]).forEach(function(x){ if(x.created_at.slice(0,10)!==td)return; var p=num(x.field3); if(p===null)return; bt+=Math.max(0,p)/1000; bany=true; });
    PLANNER._boilerTodayKwh = bany ? bt : null;
    // aktuelle Auto-Ladeleistung (kW, field4 in µW) – nur wenn Wallbox laedt (Status 67)
    var wfs=(r[3]&&r[3].feeds)?r[3].feeds:[], wf=wfs.length?wfs[wfs.length-1]:null;
    PLANNER._carNow = wf ? (Math.round(num(wf.field8))===67 ? Math.max(0,(num(wf.field4)||0)*1e-6) : 0) : null;
    // geglaettete Lade-Vorgabe der Wallbox (kW, field7 in W) – letzter vorhandener Wert
    PLANNER._carVorgabe=null;
    for(var wi=wfs.length-1;wi>=0;wi--){ var vg=num(wfs[wi].field7); if(vg!==null){ PLANNER._carVorgabe=Math.max(0,vg/1000); break; } }
    afterPnow();
  }).catch(function(){ afterPnow(); });
};

var VIEWS={ pv:PV, wallbox:WALLBOX, heizung:HEIZUNG, boiler:BOILER, planer:PLANNER };
var state={timer:null};
function switchView(v){
  if(!VIEWS[v]) v="pv";
  if(state.timer){ clearInterval(state.timer); state.timer=null; }
  var tabs=document.querySelectorAll("#tabs a");
  tabs.forEach(function(a){ a.classList.toggle("active", a.getAttribute("data-view")===v); });
  var main=document.getElementById("view");
  VIEWS[v].render(main);
  VIEWS[v].load();
  state.timer=setInterval(VIEWS[v].load, 60000);
  if(location.hash.slice(1)!==v) location.hash=v;
}
document.getElementById("tabs").addEventListener("click",function(e){ var a=e.target.closest("a[data-view]"); if(!a)return; e.preventDefault(); switchView(a.getAttribute("data-view")); });
window.addEventListener("hashchange",function(){ switchView(location.hash.slice(1)); });
switchView(location.hash.slice(1) || "pv");

// PWA: Service Worker registrieren (macht die Seite als App installierbar). Geht nur
// ueber http(s), nicht als lokale Datei (file://) - dort einfach ueberspringen.
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}

// Neue Dashboard-Version von selbst laden: Eine installierte App bleibt oft tagelang
// offen und wuerde sonst bei der alten Version bleiben (die Daten kommen trotzdem).
// Geprueft wird beim Zurueckwechseln in die App (nach >= 5 min im Hintergrund) und
// alle 6 h, falls sie dauernd sichtbar offen ist (z. B. am PC). Verglichen wird der
// Fingerabdruck dieser Seite beim Server (ETag bzw. Last-Modified von GitHub Pages);
// hat er sich seit dem Laden geaendert, laedt die App neu - die Adresse mit #Tab bleibt.
(function(){
  if(location.protocol.indexOf("http")!==0) return;   // nicht als lokale Datei
  var HIDDEN_MIN_MS=5*60000, PERIOD_MS=6*3600000, url=location.pathname, base=null, hiddenAt=0;
  function stamp(r){ return r.ok ? (r.headers.get("ETag")||r.headers.get("Last-Modified")) : null; }
  // Fingerabdruck der GELADENEN Version: aus dem Browser-Cache (dieselbe Datei, die die
  // Seite gerade benutzt) - nicht vom Server, sonst ginge ein Update in den ersten
  // Minuten nach dem Deploy verloren.
  fetch(url,{cache:"force-cache"}).then(function(r){ base=stamp(r); }).catch(function(){});
  function check(){
    if(!base) return;
    fetch(url,{method:"HEAD",cache:"no-store"}).then(function(r){
      var s=stamp(r); if(s && s!==base) location.reload();
    }).catch(function(){});   // offline o. ae.: naechstes Mal
  }
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ hiddenAt=Date.now(); return; }
    if(hiddenAt && Date.now()-hiddenAt>=HIDDEN_MIN_MS) check();
  });
  setInterval(function(){ if(!document.hidden) check(); }, PERIOD_MS);
})();
</script>
