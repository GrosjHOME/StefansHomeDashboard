<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHO Energie – Dashboard</title>
<style>
  :root{
    --bg:#eef2f5; --card:#ffffff; --ink:#1f2933; --muted:#6b7280; --line:#e3e8ee;
    --amber:#f5a623; --green:#2e9e5b; --blue:#2b83c7; --red:#d64545;
    --nav:#ffffff; --shadow:0 1px 3px rgba(20,30,40,.10), 0 1px 2px rgba(20,30,40,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0f1720; --card:#18212b; --ink:#e6edf3; --muted:#95a1ad; --line:#2a3540;
    --nav:#131b24; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0f1720; --card:#18212b; --ink:#e6edf3; --muted:#95a1ad; --line:#2a3540; --nav:#131b24; --shadow:0 1px 3px rgba(0,0,0,.4);
  }}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; font-size:15px; line-height:1.4;}

  /* Moderne Top-Navigation */
  .nav{position:sticky; top:0; z-index:10; background:var(--nav); border-bottom:1px solid var(--line);
    box-shadow:var(--shadow); display:flex; align-items:center; gap:14px; padding:10px 16px; flex-wrap:wrap;}
  .brand{font-weight:700; font-size:1.05rem; display:flex; align-items:center; gap:7px; white-space:nowrap;}
  .tabs{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
  .tabs a{cursor:pointer; text-decoration:none; color:var(--muted); font-weight:600; font-size:.92rem;
    padding:7px 14px; border-radius:999px; display:flex; align-items:center; gap:6px; transition:all .15s ease;}
  .tabs a:hover{background:var(--bg); color:var(--ink);}
  .tabs a.active{background:var(--green); color:#fff;}
  .navright{display:flex; align-items:center; gap:10px;}
  .link-old{font-size:.8rem; color:var(--muted); text-decoration:none; padding:6px 10px; border:1px solid var(--line); border-radius:8px;}
  .link-old:hover{color:var(--ink);}
  .theme-btn{cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; width:36px; height:36px; font-size:1.05rem;}

  .wrap{max-width:1100px; margin:0 auto; padding:16px 16px 30px;}
  .view-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .view-head h1{font-size:1.3rem; margin:0; display:flex; align-items:center; gap:8px;}
  .meta{font-size:.82rem; color:var(--muted); text-align:right;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle;}
  .dot.ok{background:var(--green);} .dot.bad{background:var(--red);} .dot.na{background:#b0b8c0;}

  .hero{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:16px;}
  .hero .lbl{color:var(--muted); font-size:.85rem; text-transform:uppercase; letter-spacing:.04em;}
  .hero .val{font-size:2.8rem; font-weight:700; line-height:1.1; margin:2px 0 6px;}
  .hero .val small{font-size:1.1rem; font-weight:600; color:var(--muted);}
  .bar{height:12px; border-radius:6px; background:var(--line); overflow:hidden;}
  .bar > span{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--green),var(--amber)); transition:width .6s ease;}
  .bar-scale{display:flex; justify-content:space-between; font-size:.72rem; color:var(--muted); margin-top:3px;}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px;}
  .kpi{background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px;}
  .kpi .k{color:var(--muted); font-size:.8rem; margin-bottom:4px;}
  .kpi .v{font-size:1.45rem; font-weight:700;}
  .kpi .v small{font-size:.8rem; font-weight:600; color:var(--muted);}

  .panel{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px; margin-bottom:16px;}
  .panel h2{font-size:1rem; margin:0 0 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .panel h2 .tag{font-size:.7rem; font-weight:600; color:var(--muted); background:var(--bg); padding:2px 8px; border-radius:20px;}
  .seg{display:inline-flex; gap:2px; background:var(--bg); border-radius:8px; padding:2px; flex-wrap:wrap; margin-left:auto;}
  .seg button{cursor:pointer; border:0; background:transparent; color:var(--muted); font-family:inherit; font-size:.76rem; font-weight:600; padding:4px 10px; border-radius:6px;}
  .seg button.active{background:var(--card); color:var(--ink); box-shadow:var(--shadow);}
  .chart-wrap{position:relative;}
  .tip{position:absolute; pointer-events:none; background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:8px; padding:6px 9px; font-size:.78rem; line-height:1.35; white-space:nowrap; opacity:0; transition:opacity .08s; z-index:5;}
  svg.chart{width:100%; height:auto; display:block;}
  .chart-empty{color:var(--muted); font-size:.9rem; padding:20px 0; text-align:center;}
  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:.8rem; color:var(--muted); margin:2px 0 10px;}
  .legend .it{display:flex; align-items:center; gap:6px;}
  .legend .sw{width:16px; height:0; border-top:3px solid;}

  table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums;}
  th,td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--line);}
  th:first-child,td:first-child{text-align:left;}
  thead th{font-size:.78rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  tbody tr:last-child td{border-bottom:none;}
  tr.sum td{font-weight:700; border-top:2px solid var(--line);}
  .wr-head{font-weight:700; color:var(--blue);}
  .note{font-size:.8rem; color:var(--muted); margin-top:10px;}
  footer{font-size:.78rem; color:var(--muted); text-align:center; margin-top:8px;}
</style>
</head>
<body>
  <header class="nav">
    <div class="brand">⚡ SHO Energie</div>
    <nav class="tabs" id="tabs">
      <a data-view="pv">☀️ PV</a>
      <a data-view="wallbox">🔌 Wallbox</a>
      <a data-view="heizung">🔥 Heizung</a>
      <a data-view="boiler">♨️ Boiler</a>
    </nav>
    <div class="navright">
      <a class="link-old" href="../thingspeak-dashboard/index.html" title="Original mit ThingSpeak-iframes">ThingSpeak</a>
      <button id="theme-toggle" class="theme-btn" title="Hell/Dunkel">🌙</button>
    </div>
  </header>
  <main id="view"></main>

<script>
/* ================= Theme ================= */
(function(){
  var root=document.documentElement, t=null;
  try{ t=localStorage.getItem("shoTheme"); }catch(e){}
  if(t) root.setAttribute("data-theme",t);
  function cur(){ return root.getAttribute("data-theme") || ((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light"); }
  var btn=document.getElementById("theme-toggle");
  function upd(){ btn.textContent = cur()==="dark"?"☀️":"🌙"; }
  btn.addEventListener("click",function(){ var n=cur()==="dark"?"light":"dark"; root.setAttribute("data-theme",n); try{localStorage.setItem("shoTheme",n);}catch(e){} upd(); });
  upd();
})();

/* ================= Helfer ================= */
function j(u){ return fetch(u,{cache:"no-store"}).then(function(r){return r.json();}); }
function num(x){ return (x===null||x===undefined||x==="")?null:parseFloat(x); }
function fmt(v,d){ return v===null?"–":v.toLocaleString("de-CH",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function relTime(dt){ var s=Math.round((Date.now()-dt.getTime())/1000); if(s<90)return "vor "+s+" s"; var m=Math.round(s/60); if(m<90)return "vor "+m+" min"; var h=Math.round(m/60); if(h<48)return "vor "+h+" h"; return "vor "+Math.round(h/24)+" T"; }
function niceMax(m){ if(m<=0)return 1; var p=Math.pow(10,Math.floor(Math.log10(m))); var c=[1,1.5,2,2.5,3,4,5,6,8,10]; for(var i=0;i<c.length;i++){ if(c[i]*p>=m) return c[i]*p; } return 10*p; }
function ylab(v){ return (Math.abs(v-Math.round(v))<1e-9)?String(Math.round(v)):v.toFixed(1); }
function el(html){ var d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }
function api(ch,path,withKey){ var u="https://api.thingspeak.com/channels/"+ch+path; if(withKey) u+=(path.indexOf("?")>=0?"&":"?")+"api_key=6GIAGINL9VN4CTL8"; return u; }

/* Zeit-Liniendiagramm (1..n Serien) */
function lineChart(holder, series, opts){
  opts=opts||{}; var all=[]; series.forEach(function(s){ all=all.concat(s.pts); });
  if(all.length<2){ holder.innerHTML='<div class="chart-empty">noch keine Daten</div>'; return; }
  var W=1000,H=300,padL=46,padR=12,padT=24,padB=26;
  var tMin=Math.min.apply(null,all.map(function(p){return p.t.getTime();}));
  var tMax=Math.max.apply(null,all.map(function(p){return p.t.getTime();})); if(tMax===tMin)tMax=tMin+1;
  var vMin=Math.min.apply(null,all.map(function(p){return p.v;}));
  var vMax=Math.max.apply(null,all.map(function(p){return p.v;}));
  var base,top;
  if(opts.zero===false){ var pad=(vMax-vMin)*0.1||1; base=Math.floor(vMin-pad); top=Math.ceil(vMax+pad); }
  else { base=0; top=niceMax(vMax); }
  if(top<=base) top=base+1;
  function X(t){ return padL+(W-padL-padR)*((t-tMin)/(tMax-tMin)); }
  function Y(v){ return padT+(H-padT-padB)*(1-(v-base)/(top-base)); }
  var grid="",yl="";
  [base,(base+top)/2,top].forEach(function(v){ var y=Y(v);
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    yl+='<text x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+ylab(v)+'</text>'; });
  var paths="";
  series.forEach(function(s){ if(s.pts.length<2)return; var d=""; s.pts.forEach(function(p,i){ d+=(i?" L ":"M ")+X(p.t.getTime())+" "+Y(p.v); });
    paths+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round"'+(s.dash?' stroke-dasharray="5 4"':'')+'/>'; });
  var fill="";
  if(series.length===1 && base<=0){ var s0=series[0], a="M "+X(s0.pts[0].t.getTime())+" "+Y(0);
    s0.pts.forEach(function(p){ a+=" L "+X(p.t.getTime())+" "+Y(p.v); });
    a+=" L "+X(s0.pts[s0.pts.length-1].t.getTime())+" "+Y(0)+" Z";
    var gid="g"+Math.random().toString(36).slice(2);
    fill='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+s0.color+'" stop-opacity="0.30"/><stop offset="100%" stop-color="'+s0.color+'" stop-opacity="0.02"/></linearGradient></defs><path d="'+a+'" fill="url(#'+gid+')"/>'; }
  var xl="";
  for(var k=0;k<=5;k++){ var tt=tMin+(tMax-tMin)*k/5, x=padL+(W-padL-padR)*k/5;
    var span=tMax-tMin, dd=new Date(tt);
    var lab = span> 26*3600*1000 ? dd.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit"}) : dd.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
    xl+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+lab+'</text>'; }
  holder.innerHTML='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+fill+grid+paths+yl+xl+
    '<text x="6" y="14" font-size="11" fill="var(--muted)">'+(opts.unit||"")+'</text></svg>';
}
/* Balkendiagramm */
function barChart(holder, bars, opts){
  opts=opts||{}; if(!bars.length){ holder.innerHTML='<div class="chart-empty">noch keine Daten</div>'; return; }
  var W=1000,H=300,padL=46,padR=12,padT=24,padB=40,n=bars.length;
  var vMax=niceMax(Math.max.apply(null,bars.map(function(b){return b.v;})));
  function Y(v){ return padT+(H-padT-padB)*(1-v/vMax); }
  var slot=(W-padL-padR)/n, bw=slot*0.6, grid="",yl="";
  [0,vMax/2,vMax].forEach(function(v){ var y=Y(v);
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    yl+='<text x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+ylab(v)+'</text>'; });
  var r="";
  bars.forEach(function(b,i){ var x=padL+slot*i+(slot-bw)/2, y=Y(b.v), h=Y(0)-y;
    r+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+(opts.color||"var(--green)")+'"/>';
    r+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+fmt(b.v,0)+'</text>';
    r+='<text x="'+(x+bw/2)+'" y="'+(H-24)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+b.label+'</text>'; });
  holder.innerHTML='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+grid+r+yl+
    '<text x="6" y="14" font-size="11" fill="var(--muted)">'+(opts.unit||"")+'</text></svg>';
}
function parseStatus(s){ var o={},re=/([UI])([56])=([\d.]+)\/([\d.]+)\/([\d.]+)/g,m; while((m=re.exec(s))){ o[m[1]+m[2]]=[parseFloat(m[3]),parseFloat(m[4]),parseFloat(m[5])]; } return o; }
function downsample(arr,max){ var st=Math.max(1,Math.ceil(arr.length/max)), out=[]; for(var i=0;i<arr.length;i+=st) out.push(arr[i]); if(arr.length && out[out.length-1]!==arr[arr.length-1]) out.push(arr[arr.length-1]); return out; }

/* ================= View: PV ================= */
var PV={ CH:172430, powerMode:"heute", energyMode:"tage" };
function segActive(container, btn){ Array.prototype.forEach.call(container.querySelectorAll("button"), function(b){ b.classList.toggle("active", b===btn); }); }
PV.render=function(main){
  main.innerHTML='<div class="wrap">'+
    '<div class="view-head"><h1>☀️ PV-Anlage</h1><div class="meta"><div id="sd-status"><span class="dot na"></span>SD-Karte</div><div id="updated">wird geladen…</div></div></div>'+
    '<div class="hero"><div class="lbl">Aktuelle Leistung</div><div class="val"><span id="power">–</span> <small>kW</small></div>'+
      '<div class="bar"><span id="power-bar" style="width:0%"></span></div><div class="bar-scale"><span>0</span><span>15 kW</span><span>30 kW</span></div></div>'+
    '<div class="kpis">'+
      kpiCard("Heute","e-today","kWh")+kpiCard("Gestern","e-yesterday","kWh")+kpiCard("Aktueller Monat","e-month","kWh")+
      kpiCard("Letzter Monat","e-lastmonth","kWh")+kpiCard("Dieses Jahr","e-year","kWh")+kpiCard("Ø DC-Spannung","dc-mean","V")+'</div>'+
    '<div class="panel"><h2>Leistung <span class="seg" id="seg-power"><button data-m="heute" class="active">Heute</button><button data-m="7tage">7 Tage</button></span></h2><div id="chart-power"><div class="chart-empty">wird geladen…</div></div></div>'+
    '<div class="panel"><h2>Energie <span class="seg" id="seg-energy"><button data-m="tage" class="active">Tage</button><button data-m="monate">Monate</button><button data-m="jahre">Jahre</button></span></h2><div id="chart-days"><div class="chart-empty">wird geladen…</div></div></div>'+
    '<div class="panel"><h2>Strom je MPP-Tracker heute <span class="tag" id="strom-tag"></span></h2>'+
      '<div class="legend"><span class="it"><span class="sw" style="border-color:var(--green)"></span>Tracker 1</span>'+
      '<span class="it"><span class="sw" style="border-color:var(--blue)"></span>Tracker 2</span>'+
      '<span class="it"><span class="sw" style="border-color:var(--amber)"></span>Tracker 3</span>'+
      '<span class="it">— WR 5 · - - - WR 6</span></div><div id="chart-strom"><div class="chart-empty">wird geladen…</div></div></div>'+
    '<div class="panel"><h2>Spannung je MPP-Tracker heute <span class="tag" id="spannung-tag"></span></h2>'+
      '<div class="legend"><span class="it"><span class="sw" style="border-color:var(--green)"></span>Tracker 1</span>'+
      '<span class="it"><span class="sw" style="border-color:var(--blue)"></span>Tracker 2</span>'+
      '<span class="it"><span class="sw" style="border-color:var(--amber)"></span>Tracker 3</span>'+
      '<span class="it">— WR 5 · - - - WR 6</span></div><div id="chart-spannung"><div class="chart-empty">wird geladen…</div></div></div>'+
    '<div class="panel"><h2>DC je MPP-Tracker <span class="tag" id="status-time"></span></h2><div id="tracker-holder"><div class="chart-empty">wird geladen…</div></div>'+
      '<div class="note">Tracker 1 &amp; 2 = je 2 Strings parallel, Tracker 3 = 1 String (halb so viele Module – so ausgelegt, daher ~halber Strom).</div></div>'+
    '<footer>Datenquelle: ThingSpeak Kanal 172430 · Aktualisierung alle 60 s · <span id="err" style="color:var(--red)"></span></footer></div>';
  var sp=document.getElementById("seg-power"); if(sp) sp.addEventListener("click",function(e){ var b=e.target.closest("button[data-m]"); if(!b)return; PV.powerMode=b.getAttribute("data-m"); segActive(sp,b); PV.loadPower(); });
  var se=document.getElementById("seg-energy"); if(se) se.addEventListener("click",function(e){ var b=e.target.closest("button[data-m]"); if(!b)return; PV.energyMode=b.getAttribute("data-m"); segActive(se,b); PV.loadEnergy(); });
};
function kpiCard(k,id,unit){ return '<div class="kpi"><div class="k">'+k+'</div><div class="v"><span id="'+id+'">–</span> <small>'+unit+'</small></div></div>'; }
function panel(title,tag,id){ return '<div class="panel"><h2>'+title+' '+tag+'</h2><div id="'+id+'"><div class="chart-empty">wird geladen…</div></div></div>'; }
PV.load=function(){
  var errEl=function(){return document.getElementById("err");};
  function g(id){return document.getElementById(id);}
  var p1=j(api(PV.CH,"/feeds.json?results=20",true)).then(function(d){
    var f=(d&&d.feeds)?d.feeds:[]; if(!f.length||!g("power"))return; var last=f[f.length-1];
    var pW=num(last.field1),pKW=pW===null?null:pW/1000;
    g("power").textContent=fmt(pKW,2); g("power-bar").style.width=(pKW===null?0:Math.max(0,Math.min(100,pKW/30*100)))+"%";
    function L(fd){ for(var i=f.length-1;i>=0;i--){var v=num(f[i][fd]); if(v!==null)return v;} return null; }
    g("e-today").textContent=fmt(L("field2"),1); g("e-yesterday").textContent=fmt(L("field5"),1);
    g("e-month").textContent=fmt(L("field3"),0); g("e-lastmonth").textContent=fmt(L("field6"),0);
    g("e-year").textContent=fmt(L("field4"),0); g("dc-mean").textContent=fmt(L("field8"),0);
    var sd=L("field7"); g("sd-status").innerHTML= sd===1?'<span class="dot ok"></span>SD-Karte OK':(sd===0?'<span class="dot bad"></span>SD-Karte Fehler':'<span class="dot na"></span>SD-Karte');
    if(last.created_at) g("updated").textContent="Aktualisiert "+relTime(new Date(last.created_at));
  });
  PV.loadPower(); PV.loadEnergy();
  var p4=j(api(PV.CH,"/status.json?days=1",true)).then(function(d){
    var f=(d&&d.feeds)?d.feeds:[]; var last=f.length?f[f.length-1]:null; var holder=g("tracker-holder"); if(!holder)return;
    if(last&&last.status){ g("status-time").textContent=relTime(new Date(last.created_at)); var p=parseStatus(last.status);
      function wr(w){ var U=p["U"+w],I=p["I"+w]; if(!U||!I)return '<tr><td class="wr-head">WR '+w+'</td><td colspan="3" style="text-align:left;color:var(--muted)">keine Daten</td></tr>';
        var rows="",sum=0; for(var t=0;t<3;t++){var pw=U[t]*I[t];sum+=pw; rows+='<tr><td>Tracker '+(t+1)+(t===2?' <span style="color:var(--muted)">(1 String)</span>':'')+'</td><td>'+U[t].toFixed(0)+' V</td><td>'+I[t].toFixed(1)+' A</td><td>'+(pw/1000).toFixed(2)+' kW</td></tr>';}
        return '<tr><td class="wr-head" colspan="4">Wechselrichter '+w+'</td></tr>'+rows+'<tr class="sum"><td>Summe WR '+w+'</td><td></td><td></td><td>'+(sum/1000).toFixed(2)+' kW</td></tr>'; }
      holder.innerHTML='<table><thead><tr><th>Tracker</th><th>Spannung</th><th>Strom</th><th>Leistung</th></tr></thead><tbody>'+wr(5)+wr(6)+'</tbody></table>';
    } else holder.innerHTML='<div class="chart-empty">kein Status verfügbar</div>';
    var ds=downsample(f,200), cols=["var(--green)","var(--blue)","var(--amber)"];
    var SI=[[],[],[],[],[],[]], SU=[[],[],[],[],[],[]];
    ds.forEach(function(e){ if(!e.status)return; var pp=parseStatus(e.status),tt=new Date(e.created_at);
      if(pp.I5)for(var a=0;a<3;a++)SI[a].push({t:tt,v:pp.I5[a]});
      if(pp.I6)for(var b=0;b<3;b++)SI[3+b].push({t:tt,v:pp.I6[b]});
      if(pp.U5)for(var c1=0;c1<3;c1++)SU[c1].push({t:tt,v:pp.U5[c1]});
      if(pp.U6)for(var c2=0;c2<3;c2++)SU[3+c2].push({t:tt,v:pp.U6[c2]}); });
    function mk(A){ return [{color:cols[0],pts:A[0]},{color:cols[1],pts:A[1]},{color:cols[2],pts:A[2]},
      {color:cols[0],dash:true,pts:A[3]},{color:cols[1],dash:true,pts:A[4]},{color:cols[2],dash:true,pts:A[5]}].filter(function(s){return s.pts.length>1;}); }
    if(g("chart-strom")) lineChart(g("chart-strom"),mk(SI),{unit:"A"});
    if(g("chart-spannung")) lineChart(g("chart-spannung"),mk(SU),{unit:"V",zero:false});
    if(g("spannung-tag")&&last&&last.created_at) g("spannung-tag").textContent="Stand "+relTime(new Date(last.created_at));
  });
  Promise.all([p1,p4]).then(function(){ if(errEl())errEl().textContent=""; }).catch(function(){ if(errEl())errEl().textContent="Daten konnten nicht geladen werden – nächster Versuch in 60 s."; });
};

PV.loadPower=function(){
  var holder=document.getElementById("chart-power"); if(!holder)return;
  var url = PV.powerMode==="7tage" ? "/feeds.json?days=7&average=60" : "/feeds.json?days=1&average=10";
  j(api(PV.CH,url,true)).then(function(d){
    var f=(d&&d.feeds)?d.feeds:[],pts=[]; f.forEach(function(x){ var v=num(x.field1); if(v!==null)pts.push({t:new Date(x.created_at),v:v/1000}); });
    lineChart(holder,[{color:"var(--green)",pts:pts}],{unit:"kW"});
  });
};
PV.loadEnergy=function(){
  var holder=document.getElementById("chart-days"); if(!holder)return;
  var mo=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  if(PV.energyMode==="monate"){
    j(api(PV.CH,"/feeds.json?days=365&average=1440",true)).then(function(d){
      var f=(d&&d.feeds)?d.feeds:[],byM={};
      f.forEach(function(x){ var v=num(x.field5); if(v===null)return; var dt=new Date(x.created_at); var key=dt.getFullYear()+"-"+dt.getMonth();
        if(!byM[key])byM[key]={v:0,dt:new Date(dt.getFullYear(),dt.getMonth(),1)}; byM[key].v+=v; });
      var arr=Object.keys(byM).map(function(k){return byM[k];}).sort(function(a,b){return a.dt-b.dt;}).slice(-12);
      barChart(holder,arr.map(function(o){return {label:mo[o.dt.getMonth()]+" "+String(o.dt.getFullYear()).slice(2),v:o.v};}),{unit:"kWh",color:"var(--amber)"});
    });
  } else if(PV.energyMode==="jahre"){
    var yr=new Date().getFullYear(), reqs=[];
    for(var y=yr-5;y<=yr;y++){ (function(y){
      var u = y===yr ? "/feeds.json?results=1" : "/feeds.json?results=1&end="+y+"-12-31%2023:59:59";
      reqs.push(j(api(PV.CH,u,true)).then(function(d){ var f=d&&d.feeds?d.feeds:[]; return {y:y, v:f.length?num(f[f.length-1].field4):null}; }));
    })(y); }
    Promise.all(reqs).then(function(res){
      barChart(holder, res.filter(function(o){return o.v!==null&&o.v>0;}).map(function(o){return {label:String(o.y),v:o.v};}), {unit:"kWh",color:"var(--amber)"});
    });
  } else {
    j(api(PV.CH,"/feeds.json?days=15&average=15",true)).then(function(d){
      var f=(d&&d.feeds)?d.feeds:[],byDay={}; f.forEach(function(x){ var v=num(x.field2); if(v===null)return; var dt=new Date(x.created_at);
        var key=dt.getFullYear()+"-"+dt.getMonth()+"-"+dt.getDate(); if(!byDay[key]||v>byDay[key].v)byDay[key]={v:v,dt:dt}; });
      var arr=Object.keys(byDay).map(function(k){return byDay[k];}).sort(function(a,b){return a.dt-b.dt;}).slice(-14);
      barChart(holder,arr.map(function(o){return {label:o.dt.getDate()+"."+(o.dt.getMonth()+1)+".",v:o.v};}),{unit:"kWh",color:"var(--amber)"});
    });
  }
};

/* ========== Generische Ansicht (Wallbox/Heizung/Boiler) ========== */
function simpleView(cfg){
  return {
    render:function(main){
      var kp=cfg.kpis.map(function(k,i){ return kpiCard(k.label,"kpi_"+i,k.unit||""); }).join("");
      var charts=cfg.charts.map(function(c,i){
        var items=(c.lines||[]).map(function(ln){ return '<span class="it"><span class="sw" style="border-color:'+ln.color+(ln.dash?';border-top-style:dashed':'')+'"></span>'+(ln.label||'')+'</span>'; });
        if(c.minmaxField) items.push('<span class="it"><span class="sw" style="border-color:var(--muted);border-top-style:dashed"></span>Min/Max</span>');
        var leg = (c.lines && (c.lines.length>1 || c.minmaxField)) ? '<div class="legend">'+items.join("")+'</div>' : "";
        return '<div class="panel"><h2>'+c.title+' <span class="tag" id="ct_'+i+'"></span></h2>'+leg+'<div id="chart_'+i+'"><div class="chart-empty">wird geladen…</div></div></div>';
      }).join("");
      main.innerHTML='<div class="wrap"><div class="view-head"><h1>'+cfg.icon+" "+cfg.title+'</h1><div class="meta" id="head-meta">wird geladen…</div></div>'+
        '<div class="kpis">'+kp+'</div>'+charts+
        '<footer>Datenquelle: ThingSpeak Kanal '+cfg.channel+' · Aktualisierung alle 60 s · <span id="err2" style="color:var(--red)"></span></footer></div>';
    },
    load:function(){
      function g(id){return document.getElementById(id);}
      j(api(cfg.channel,"/feeds.json?results=300",false)).then(function(d){
        var f=(d&&d.feeds)?d.feeds:[]; if(!f.length){ if(g("head-meta"))g("head-meta").textContent="keine Daten"; return; }
        var last=f[f.length-1];
        function L(fd){ for(var i=f.length-1;i>=0;i--){var v=num(f[i][fd]); if(v!==null)return v;} return null; }
        cfg.kpis.forEach(function(k,i){ if(k.channel&&k.channel!==cfg.channel)return; var v=L(k.field); if(!g("kpi_"+i))return;
          g("kpi_"+i).textContent = k.map ? (v===null?"–":k.map(v)) : fmt(v,k.dec||0); });
        if(g("head-meta")&&last.created_at) g("head-meta").textContent="Aktualisiert "+relTime(new Date(last.created_at));
        // Charts bauen
        cfg.charts.forEach(function(c,i){ var holder=g("chart_"+i); if(!holder)return;
          var series=c.lines.map(function(ln){ var pts=[]; f.forEach(function(x){ var v=num(x[ln.field]); if(v!==null) pts.push({t:new Date(x.created_at), v: ln.scale? v*ln.scale : v}); }); return {color:ln.color, dash:ln.dash, pts:downsample(pts,200)}; }).filter(function(s){return s.pts.length>1;});
          if(c.minmaxField){ var vv=[],ct=[]; f.forEach(function(x){ var v=num(x[c.minmaxField]); if(v!==null){ vv.push(v); ct.push(new Date(x.created_at)); } });
            if(vv.length>1){ var mn=Math.min.apply(null,vv), mx=Math.max.apply(null,vv), t0=ct[0], t1=ct[ct.length-1];
              series.push({color:"var(--muted)",dash:true,pts:[{t:t0,v:mn},{t:t1,v:mn}]});
              series.push({color:"var(--muted)",dash:true,pts:[{t:t0,v:mx},{t:t1,v:mx}]}); } }
          if(g("ct_"+i)&&last.created_at) g("ct_"+i).textContent="Stand "+relTime(new Date(last.created_at));
          lineChart(holder, series, {unit:c.unit, zero:c.zero});
        });
        if(g("err2"))g("err2").textContent="";
      }).catch(function(){ if(g("err2"))g("err2").textContent="Daten konnten nicht geladen werden."; });

      // KPIs aus anderen Kanaelen (z. B. HSH-Auslastung liegt im Wallbox-Kanal 172228)
      var extra={};
      cfg.kpis.forEach(function(k,i){ if(k.channel&&k.channel!==cfg.channel){ (extra[k.channel]=extra[k.channel]||[]).push({k:k,i:i}); } });
      Object.keys(extra).forEach(function(ch){
        j(api(ch,"/feeds.json?results=300",false)).then(function(d){
          var f=(d&&d.feeds)?d.feeds:[];
          function L2(fd){ for(var i=f.length-1;i>=0;i--){ var v=num(f[i][fd]); if(v!==null)return v; } return null; }
          extra[ch].forEach(function(o){ var g2=document.getElementById("kpi_"+o.i); if(!g2)return; var v=L2(o.k.field);
            g2.textContent = o.k.map ? (v===null?"–":o.k.map(v)) : fmt(v,o.k.dec||0); });
        }).catch(function(){});
      });
    }
  };
}

/* ================= Routing ================= */
var VIEWS={ pv:PV, wallbox:WALLBOX, heizung:HEIZUNG, boiler:BOILER };
var state={timer:null};
function switchView(v){
  if(!VIEWS[v]) v="pv";
  if(state.timer){ clearInterval(state.timer); state.timer=null; }
  var tabs=document.querySelectorAll("#tabs a");
  tabs.forEach(function(a){ a.classList.toggle("active", a.getAttribute("data-view")===v); });
  var main=document.getElementById("view");
  VIEWS[v].render(main);
  VIEWS[v].load();
  state.timer=setInterval(VIEWS[v].load, 60000);
  if(location.hash.slice(1)!==v) location.hash=v;
}
document.getElementById("tabs").addEventListener("click",function(e){ var a=e.target.closest("a[data-view]"); if(!a)return; e.preventDefault(); switchView(a.getAttribute("data-view")); });
window.addEventListener("hashchange",function(){ switchView(location.hash.slice(1)); });
switchView(location.hash.slice(1) || "pv");
</script>
