name: ID.3 SoC (Tibber) -> ThingSpeak

# Pollt den Ladezustand des VW ID.3 ueber die Tibber Data API und schreibt ihn
# in den ThingSpeak-Kanal 3514838. Laeuft in der Cloud (kein PC noetig).
# Tibber-Refresh-Tokens rotieren -> der Poller aktualisiert das Secret
# TIBBER_REFRESH_TOKEN nach jedem Lauf selbst (braucht Secret GH_PAT mit
# 'Secrets: write' auf dieses Repo).

on:
  schedule:
    - cron: '7,24,41,58 * * * *'   # ~alle 17 min, bewusst abseits der Viertel-Marken (:00/:15/:30/:45).
                             # Dort verwirft GitHub geplante Laeufe am haeufigsten (Hochlast). Test:
                             # ob andere Minuten die Trefferquote verbessern - sonst via ThingSpeak-TimeControl.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: id3-tibber
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyNaCl installieren (fuer Secret-Verschluesselung)
        run: pip install --quiet pynacl
      - name: SoC lesen, ThingSpeak schreiben, Refresh-Token rotieren
        env:
          TIBBER_CLIENT_ID: ${{ secrets.TIBBER_CLIENT_ID }}
          TIBBER_CLIENT_SECRET: ${{ secrets.TIBBER_CLIENT_SECRET }}
          TIBBER_REFRESH_TOKEN: ${{ secrets.TIBBER_REFRESH_TOKEN }}
          TS_WRITE_KEY: ${{ secrets.TS_WRITE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/id3_tibber_cloud.py
